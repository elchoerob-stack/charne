name: Sync Gap King to the Pages branch

# The repository's GitHub Pages site deploys from the score-prediction app's
# branch, so publishing the game means copying its folder onto that branch.
# The Pages auto-build then redeploys the whole site (score app at the root,
# Gap King at /rugby-positioning-game/).

on:
  push:
    branches: [claude/rugby-positioning-game-oktl2h]
    paths: ["rugby-positioning-game/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Pages branch
        uses: actions/checkout@v4
        with:
          ref: claude/sa-score-prediction-app-eia010
          path: site
      - name: Check out the game branch
        uses: actions/checkout@v4
        with:
          ref: claude/rugby-positioning-game-oktl2h
          path: game
      - name: Copy the game into the site
        run: |
          rm -rf site/rugby-positioning-game
          cp -r game/rugby-positioning-game site/rugby-positioning-game
      - name: Commit and push if anything changed
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Game already up to date on the Pages branch."
          else
            git commit -m "Update Gap King app from ${GITHUB_SHA::7}"
            git push
          fi
