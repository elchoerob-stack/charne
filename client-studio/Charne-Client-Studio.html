/* Charné Client Studio
   Two surfaces: the studio (Charné's side: navy home, light editor) and the
   pages (what the client sees: cream paper, serif headings). Pages are laid
   out at A4 landscape (1122 x 793 px) and scaled to fit, so the preview, the
   full-screen presentation and the PDF are the same thing. On a phone the
   pages reflow into one readable column instead. */

:root{
  --night:#1E2438; --night-2:#262D45; --night-3:#323A5C;
  --paper:#FBFAF6; --paper-2:#F3F0E8; --stone:#E6E1D5; --stone-2:#D3CCBC;
  --ink:#1D2130; --body:#4B5060; --muted:#767B88;
  --blue:#2D4B8E; --blue-2:#22396E; --blue-soft:#E8EDF7;
  --seller:#A8742F; --buyer:#8C6BC8;
  --ok:#2E7D4F; --ok-bg:#E3F1E8; --warn:#8F5600; --warn-bg:#FBEED6; --bad:#A3352B;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--night);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid #6E8BD6;outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Buttons ───────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-size:14.5px;font-weight:600;border:1px solid transparent;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-2)}
.btn-l{background:#fff;color:var(--ink);border-color:var(--stone-2)}
.btn-l:hover{border-color:var(--ink)}
.btn-d{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.btn-d:hover{background:rgba(255,255,255,.16)}
.btn-g{background:#1F7A4D;color:#fff}
.btn-g:hover{background:#17623D}
.btn-big{padding:14px 26px;font-size:16px}
.btn-sm{padding:6px 13px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ── Home ──────────────────────────────────── */
.home{min-height:100vh;background:var(--night);color:#fff;padding:0 24px 72px}
.topbar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:20px 0;flex-wrap:wrap}
.topbar .lock{height:38px;width:auto;display:block}
.topbar .app-name{border-left:1px solid rgba(255,255,255,.2);padding-left:14px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.topbar .sp{flex:1}
.hello{max-width:1120px;margin:30px auto 34px}
.eyebrow{letter-spacing:.24em;text-transform:uppercase;font-size:12px;font-weight:600}
.hello .eyebrow{color:rgba(255,255,255,.6)}
.hello h1{font-size:clamp(40px,5.4vw,62px);font-weight:500;line-height:1.04;margin-top:10px}
.hello p{color:rgba(255,255,255,.74);max-width:62ch;margin-top:14px;font-weight:300;font-size:17.5px}
.banner{max-width:1120px;margin:0 auto 26px;background:#FBEED6;color:#5B3A00;border-radius:12px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:600}
.banner .sp{flex:1}
.cards{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:30px}
.card{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{position:relative;aspect-ratio:16/8.4;overflow:hidden;background:#3A4466}
.card .ph svg,.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:22px;left:22px;padding:7px 16px;color:#fff;font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:600}
.tag.seller{background:var(--seller)}
.tag.buyer{background:var(--buyer)}
.card .bd{padding:30px 34px 32px;display:flex;flex-direction:column;gap:14px;flex:1}
.card h2{font-size:42px;font-weight:500;line-height:1.08}
.card .bd p{color:var(--body);font-weight:300;font-size:17px;line-height:1.7}
.card .acts{margin-top:auto;padding-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cta{background:none;border:0;padding:0;color:var(--blue);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
.cta:hover{color:var(--blue-2);text-decoration:underline;text-underline-offset:5px}
.cta.quiet{color:var(--muted);letter-spacing:.14em;font-size:12.5px}

.section-h{max-width:1120px;margin:60px auto 16px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section-h h2{font-size:34px;font-weight:500;color:#fff}
.section-h p{color:rgba(255,255,255,.6);font-size:14px}
.clients{max-width:1120px;margin:0 auto;display:grid;gap:12px}
.crow{background:var(--night-2);border:1px solid rgba(255,255,255,.08);border-radius:12px;display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:18px;align-items:center;padding:12px 16px 12px 12px}
.crow .thumb{width:104px;height:70px;border-radius:8px;overflow:hidden;background:#3A4466;display:block;border:0;padding:0}
.crow .thumb img,.crow .thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.crow .nm{font-family:var(--serif);font-size:24px;font-weight:600;color:#fff;line-height:1.15;background:none;border:0;padding:0;text-align:left}
.crow .nm:hover{text-decoration:underline;text-underline-offset:4px}
.crow .meta{font-size:13px;color:rgba(255,255,255,.62);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;line-height:1.7}
.pill.seller{background:var(--seller)}
.pill.buyer{background:var(--buyer)}
.pill.ex{background:rgba(255,255,255,.14)}
.crow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{max-width:1120px;margin:0 auto;border:1.5px dashed rgba(255,255,255,.22);border-radius:12px;padding:28px;text-align:center;color:rgba(255,255,255,.7)}
.home-foot{max-width:1120px;margin:56px auto 0;color:rgba(255,255,255,.5);font-size:13px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:760px){
  .crow{grid-template-columns:72px minmax(0,1fr)}
  .crow .thumb{width:72px;height:56px}
  .crow .acts{grid-column:1/-1;justify-content:flex-start}
  .card .bd{padding:24px 22px}
  .card h2{font-size:34px}
}

/* ── Editor ────────────────────────────────── */
.ed{min-height:100vh;background:var(--paper-2);color:var(--ink)}
.ed-bar{position:sticky;top:0;z-index:30;background:var(--night);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.ed-bar .ttl{font-family:var(--serif);font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ed-bar .ttl small{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:500;margin-left:10px}
.ed-bar .saved{font-size:12.5px;color:rgba(255,255,255,.62)}
.steps{display:flex;gap:6px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--stone);overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--stone);background:#fff;font-size:13.5px;white-space:nowrap;color:var(--body)}
.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);font-size:12px}
.step:hover{border-color:var(--stone-2)}
.step.on{border-color:var(--blue);color:var(--blue);font-weight:600}
.step.on b{background:var(--blue);color:#fff}
.step.done b{background:var(--ok);color:#fff}
.ed-main{display:grid;grid-template-columns:minmax(360px,450px) minmax(0,1fr);gap:28px;padding:24px 20px 20px;max-width:1560px;margin:0 auto;align-items:start}
.form{background:#fff;border:1px solid var(--stone);border-radius:14px;padding:26px 26px 22px;display:grid;gap:18px;min-width:0;margin-bottom:140px}
.comp3{grid-template-columns:.7fr 1.5fr 1.2fr}
.form h2{font-size:32px;font-weight:600;line-height:1.1}
.form .lead{color:var(--body);font-size:14.5px;margin-top:-8px}
.f{display:grid;gap:6px;min-width:0}
.f > label,.lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.in{width:100%;border:1px solid var(--stone-2);border-radius:8px;padding:10px 12px;background:#fff;font-size:15px;min-width:0}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(45,75,142,.15)}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
select.in{appearance:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--stone-2);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;line-height:1.3}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--night);border-color:var(--night);color:#fff}
.chip.on::before{content:"✓ "}
.addrow{display:flex;gap:8px}
.drop{border:2px dashed var(--stone-2);border-radius:12px;padding:18px;text-align:center;background:var(--paper);cursor:pointer;display:grid;gap:6px;place-items:center;color:var(--body);font-size:14px}
.drop:hover,.drop:focus-visible{border-color:var(--blue)}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop img{max-height:150px;border-radius:8px;display:block}
.drop .big{font-weight:600;color:var(--ink)}
.drop-acts{display:flex;gap:10px;justify-content:center}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.comp{border:1px solid var(--stone);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--paper)}
.comp-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:#F8EAEA}
.sumbox{background:var(--blue-soft);border-radius:10px;padding:14px 16px;display:grid;gap:4px;font-size:14px}
.sumbox b{font-variant-numeric:tabular-nums}
.sumbox .big{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--blue-2);line-height:1.1}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mkc{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--stone-2);background:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.35}
.mkc svg{flex:none;width:20px;height:20px;margin-top:1px;color:var(--muted)}
.mkc.on{border-color:var(--night);background:var(--night);color:#fff}
.mkc.on svg{color:#fff}
.area{border:1px solid var(--stone);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.area.on{border-color:var(--blue);background:#FAFBFE}
.area textarea.in{min-height:70px;font-size:14px}
.ready{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.ready li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.ready .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.ready .ok .ic{background:var(--ok-bg);color:var(--ok)}
.ready .todo .ic{background:var(--warn-bg);color:var(--warn)}
.bigacts{display:grid;gap:10px}
.bigacts .btn{justify-content:flex-start;padding:14px 20px;font-size:16px;border-radius:12px}
.bigacts .btn small{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:2px}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:4px;padding-top:16px;border-top:1px solid var(--stone)}
.preview{position:sticky;top:76px;display:grid;gap:12px;min-width:0}
.pv-label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pv-main{display:flex;justify-content:center}
.pv-main .frame{box-shadow:0 22px 48px -22px rgba(20,25,45,.5),0 0 0 1px rgba(20,25,45,.06);border-radius:4px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.thumbs button{flex:none;padding:0;border:2px solid transparent;border-radius:5px;background:none;position:relative}
.thumbs button.on{border-color:var(--blue)}
.thumbs .tn{position:absolute;bottom:3px;right:4px;background:rgba(30,36,56,.8);color:#fff;font-size:10px;border-radius:4px;padding:0 5px;z-index:2}
.thumbs .frame{pointer-events:none;border-radius:3px}
@media (max-width:1060px){
  .ed-main{grid-template-columns:1fr}
  .preview{position:static}
}
@media (max-width:560px){ .row3{grid-template-columns:1fr 1fr} .mk{grid-template-columns:1fr} }

/* ── Overlays ──────────────────────────────── */
.modal-wrap{position:fixed;inset:0;z-index:80;background:rgba(14,18,32,.62);display:grid;place-items:start center;overflow-y:auto;padding:5vh 16px}
.modal{background:#fff;color:var(--ink);border-radius:16px;width:min(680px,100%);padding:28px;display:grid;gap:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(860px,100%)}
.modal h2{font-size:34px;font-weight:600;line-height:1.1}
.modal .lead{color:var(--body);margin-top:-8px}
.modal-acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--stone)}
.sendstep{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.sendstep .n{width:36px;height:36px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-weight:600}
.sendstep .t{display:grid;gap:8px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--stone)}
.demo{display:grid;gap:16px}
.demo .lead{margin-top:-6px}
.demo ol{margin:0;padding-left:0;list-style:none;display:grid;gap:12px;counter-reset:d}
.demo li{counter-increment:d;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.demo li::before{content:counter(d);width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue-2);display:grid;place-items:center;font-weight:700}
.demo li b{display:block}
.demo .say{display:block;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--blue-2);margin-top:2px}
.tips{background:var(--paper);border-radius:12px;padding:14px 18px;display:grid;gap:6px;font-size:14px}
.tips ul{margin:0;padding-left:18px;display:grid;gap:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Present */
.present{position:fixed;inset:0;z-index:100;background:#0E1220;display:flex;flex-direction:column}
.pr-stage{flex:1;display:grid;place-items:center;min-height:0;padding:16px}
.pr-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 14px;color:rgba(255,255,255,.75);font-size:14px;flex-wrap:wrap}
.pr-bar .sp{flex:1}
.pr-bar .count{font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.pr-dots{display:flex;gap:6px;flex-wrap:wrap}
.pr-dots button{width:9px;height:9px;border-radius:50%;border:0;background:rgba(255,255,255,.25);padding:0}
.pr-dots button.on{background:#fff}

/* Viewer (the copy sent to the client) */
.viewer{min-height:100vh;background:#E9E5DB}
.vbar{position:sticky;top:0;z-index:30;background:var(--night);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.vbar img{height:34px;width:auto}
.vbar .who{font-size:13px;color:rgba(255,255,255,.75);line-height:1.35;min-width:0;flex:1 1 220px}
.vbar .who b{color:#fff;font-weight:600;display:block;font-size:14px}
.vdeck{max-width:1180px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:22px}
.vdeck .frame{box-shadow:0 18px 40px -22px rgba(20,25,45,.45);border-radius:4px}
.vfoot{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 40px;max-width:70ch;margin:0 auto}
@media (max-width:760px){ .vdeck{padding:0;gap:0} .vdeck .frame{box-shadow:none;border-radius:0;border-bottom:8px solid #E9E5DB} }

/* ── Pages ─────────────────────────────────── */
.frame{position:relative;overflow:hidden;background:var(--paper)}
.frame.fixed{width:calc(1122px * var(--s,1));height:calc(793px * var(--s,1));flex:none}
.frame.fixed > .pg{width:1122px;height:793px;transform:scale(var(--s,1));transform-origin:0 0}
.frame.flow > .pg{width:100%}
.pg{position:relative;background:var(--paper);color:var(--ink);container-type:inline-size;overflow:hidden;font-family:var(--sans);font-size:15.5px;line-height:1.6;display:flex;flex-direction:column;text-align:left}
.pg .pg-in{flex:1;padding:54px 66px 0;display:flex;flex-direction:column;gap:20px;min-height:0}
.pg .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 66px 0;padding:14px 0 22px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--stone)}
.pg .eyb{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--blue);font-weight:600}
.pg h1{font-family:var(--serif);font-weight:500}
.pg h2{font-size:50px;font-weight:500;line-height:1.04;color:var(--ink)}
.pg h3{font-size:23px;font-weight:600;line-height:1.2}
.pg .lede{font-size:17px;font-weight:300;color:var(--body);max-width:64ch;line-height:1.65}
.pg .small{font-size:12.5px;color:var(--muted);line-height:1.5}
.pg .num{font-variant-numeric:tabular-nums}
.pg .cols{display:grid;grid-template-columns:1fr 1fr;gap:44px;flex:1;min-height:0}
.pg .cols.c37{grid-template-columns:.85fr 1.15fr}
.pg .cols.c73{grid-template-columns:1.2fr .8fr}
.pg .stack{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.pg .ph-box{border-radius:6px;overflow:hidden;background:#3A4466;min-height:0;height:100%}
.pg .ph-box img,.pg .ph-box svg{width:100%;height:100%;object-fit:cover;display:block}
.pg .rule{height:1px;background:var(--stone)}
.pg .gold{color:var(--seller)}

/* cover */
.pg.cover{color:#fff;background:#1E2438}
.cv-img{position:absolute;inset:0}
.cv-img img,.cv-img svg{width:100%;height:100%;object-fit:cover;display:block}
.cv-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,22,38,.86) 0%,rgba(18,22,38,.55) 42%,rgba(18,22,38,.05) 75%),linear-gradient(0deg,rgba(18,22,38,.55),rgba(18,22,38,0) 45%)}
.cv-top{position:absolute;top:40px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cv-top img{height:46px;width:auto}
.cv-txt{position:absolute;left:60px;bottom:120px;max-width:620px;display:grid;gap:12px}
.cv-txt .eyb{color:rgba(255,255,255,.82)}
.cv-txt h1{font-size:76px;line-height:.98;letter-spacing:-.01em}
.cv-sub{font-size:19px;font-weight:300;color:rgba(255,255,255,.86)}
.cv-for{margin-top:18px;display:grid;gap:2px;border-left:2px solid rgba(255,255,255,.6);padding-left:16px}
.cv-for span{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.cv-for b{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.15}
.cv-agent{position:absolute;left:60px;right:60px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;font-size:14px;color:rgba(255,255,255,.88);border-top:1px solid rgba(255,255,255,.28);padding-top:14px}
.cv-agent span{color:rgba(255,255,255,.65);font-size:12.5px}

/* agent card */
.agent{display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--stone);border-radius:6px;padding:26px;align-self:start}
.agent .face{width:132px;height:132px;border-radius:50%;overflow:hidden;background:var(--night);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:48px;font-weight:600}
.agent .face img{width:100%;height:100%;object-fit:cover}
.agent h3{font-size:30px}
.agent .role{font-size:13.5px;color:var(--muted);margin-top:-8px}
.agent ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.agent li{display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
.agent li svg{flex:none;width:16px;height:16px;color:var(--blue)}
.agent .crest{height:44px;width:auto;align-self:flex-start;margin-top:4px}
.note{font-size:17px;line-height:1.7;color:var(--body);font-weight:300;white-space:pre-line}
.promises{display:grid;gap:14px;margin-top:6px}
.promise{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start}
.promise .k{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--blue);line-height:1}
.promise b{display:block;font-size:15.5px}
.promise span{color:var(--body);font-size:14.5px}
.sign{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--ink)}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.fact{background:#fff;border:1px solid var(--stone);border-radius:6px;padding:12px 14px}
.fact b{display:block;font-family:var(--serif);font-size:32px;font-weight:600;line-height:1}
.fact span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.feat{display:flex;flex-wrap:wrap;gap:7px}
.feat span{border:1px solid var(--stone-2);border-radius:999px;padding:4px 12px;font-size:13px;background:#fff}
.love{font-family:var(--serif);font-size:23px;line-height:1.4;color:var(--ink);font-style:italic}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff;border:1px solid var(--stone);border-radius:6px;overflow:hidden}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--stone);background:var(--paper)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--stone);font-variant-numeric:tabular-nums;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.you td{background:var(--blue-soft);font-weight:600;color:var(--blue-2)}
.tbl.mini{font-size:13px}
.tbl.mini th{padding:7px 12px}
.tbl.mini td{padding:6px 12px}
.tbl .r{text-align:right}
.tbl .mk-on{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--seller);color:var(--seller);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fff;border:1px solid var(--stone);border-radius:6px;padding:16px 18px;display:grid;gap:2px}
.tile span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:lining-nums}
.tile.dark{background:var(--night);border-color:var(--night);color:#fff}
.tile.dark span{color:rgba(255,255,255,.7)}

/* price bar */
.askbig{display:grid;gap:4px}
.askbig span{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.askbig b{font-family:var(--serif);font-size:80px;font-weight:600;line-height:.95;color:var(--ink);font-variant-numeric:lining-nums}
.askbig em{font-style:normal;font-size:17px;color:var(--body)}
.pbar{position:relative;height:150px;margin:6px 6px 0}
.pbar .track{position:absolute;left:0;right:0;top:74px;height:4px;background:var(--stone);border-radius:2px}
.pbar .band{position:absolute;top:62px;height:28px;background:rgba(45,75,142,.14);border:1px solid rgba(45,75,142,.35);border-radius:4px}
.pbar .band i{position:absolute;top:34px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);white-space:nowrap}
.pbar .dot{position:absolute;top:69px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink);border:2px solid var(--paper)}
.pbar .dot.mkt{background:var(--paper);border:2px solid var(--seller)}
.pbar .ppin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pbar .ppin b{background:var(--blue);color:#fff;font-size:13px;padding:4px 10px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pbar .ppin i{width:2px;height:40px;background:var(--blue)}
.pbar .ax{position:absolute;top:112px;font-size:11.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:-1px}
.legend i.mkt{background:var(--paper);border:2px solid var(--seller)}
.legend i.band{border-radius:2px;background:rgba(45,75,142,.25);border:1px solid rgba(45,75,142,.5)}

/* cards on pages */
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{background:#fff;border:1px solid var(--stone);border-radius:6px;padding:18px 20px;display:grid;gap:6px;align-content:start}
.pcard h3{font-size:22px}
.pcard p{font-size:14px;color:var(--body);line-height:1.55}
.pcard .ic{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.pcard .ic svg{width:18px;height:18px}
.pcards.mkt{grid-template-columns:repeat(3,1fr);gap:12px}
.pcards.mkt .pcard{padding:14px 16px;grid-template-columns:34px 1fr;column-gap:12px}
.pcards.mkt .pcard p{grid-column:2}
.pcards.mkt .pcard h3{font-size:19px;align-self:center}

/* timeline */
.tline{display:grid;gap:0;position:relative}
.tl{display:grid;grid-template-columns:150px 22px 1fr;gap:16px;align-items:start;padding-bottom:16px;position:relative}
.tl .when{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600;text-align:right;padding-top:3px}
.tl .dotc{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);background:var(--paper);margin-top:5px;position:relative;z-index:1}
.tl.key .dotc{background:var(--blue)}
.tl:not(:last-child)::after{content:"";position:absolute;left:174px;top:21px;bottom:-5px;width:2px;background:var(--stone-2)}
.tl b{font-size:16px;display:block}
.tl span{color:var(--body);font-size:14px}

/* net sheet */
.net{background:#fff;border:1px solid var(--stone);border-radius:6px;overflow:hidden}
.net .ln{display:flex;justify-content:space-between;gap:16px;padding:13px 20px;border-bottom:1px solid var(--stone);font-size:15.5px;font-variant-numeric:tabular-nums}
.net .ln span:first-child{color:var(--body)}
.net .ln.tot{background:var(--night);color:#fff;border:0;padding:18px 20px;align-items:center}
.net .ln.tot span:first-child{color:rgba(255,255,255,.8);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.net .ln.tot b{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:lining-nums}

/* process */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.proc .s{background:#fff;border:1px solid var(--stone);border-radius:6px;padding:16px 16px 14px;display:grid;gap:6px;align-content:start}
.proc .s .k{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--blue);line-height:1}
.proc .s b{font-size:15px;line-height:1.3}
.proc .s span{font-size:13px;color:var(--body);line-height:1.5}
.proc .s.hl{background:var(--night);border-color:var(--night);color:#fff}
.proc .s.hl .k{color:#C9D6F5}
.proc .s.hl span{color:rgba(255,255,255,.78)}
.callout{border-left:3px solid var(--blue);background:var(--blue-soft);padding:12px 16px;border-radius:0 6px 6px 0;font-size:14px;color:var(--ink)}

/* checklist */
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:14.5px;line-height:1.45}
.chk li::before{content:"";width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;margin-top:3px}
.chk li small{display:block;color:var(--muted);font-size:12.5px}

/* close page */
.pg.close{background:var(--night);color:#fff}
.pg.close .foot{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.14)}
.pg.close .eyb{color:#AFC2EE}
.pg.close h2{color:#fff;font-size:56px}
.strip{height:150px;border-radius:6px;overflow:hidden;flex:none}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.pg.close .lede{color:rgba(255,255,255,.78)}
.nexts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.nexts .s{border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:18px 20px;display:grid;gap:6px;align-content:start}
.nexts .s .k{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1;color:#AFC2EE}
.nexts .s b{font-size:16px}
.nexts .s span{font-size:13.5px;color:rgba(255,255,255,.72)}
.closebar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:auto;padding-bottom:6px}
.closebar .who{display:flex;align-items:center;gap:14px}
.closebar .who .face{width:62px;height:62px;border-radius:50%;overflow:hidden;background:var(--night-3);display:grid;place-items:center;font-family:var(--serif);font-size:24px;font-weight:600}
.closebar .who .face img{width:100%;height:100%;object-fit:cover}
.closebar .who b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
.closebar .who span{font-size:13.5px;color:rgba(255,255,255,.72)}
.wa{display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#0B2E17;font-weight:700;border-radius:999px;padding:14px 26px;text-decoration:none;font-size:16px;border:0}
.wa:hover{background:#1FBF5B}
.wa svg{width:20px;height:20px}
.mandate{font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.04em}

/* calculators */
.calc{display:grid;gap:12px;align-content:start}
.calc label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink)}
.calc label small{font-weight:400;color:var(--muted)}
.pin{width:100%;border:1px solid var(--stone-2);border-radius:6px;padding:9px 12px;background:#fff;font-size:16px;font-variant-numeric:tabular-nums;min-width:0}
.pin:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,75,142,.15)}
.calc .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc .tick{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13.5px}
.calc .tick input{margin-top:3px;accent-color:var(--blue)}
.res{background:var(--night);color:#fff;border-radius:6px;padding:24px 26px;display:grid;gap:12px;align-content:start;align-self:start}
.res .hd span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.res .hd b{display:block;font-family:var(--serif);font-size:62px;font-weight:600;line-height:1;font-variant-numeric:lining-nums}
.res .hd em{font-style:normal;font-size:15px;color:rgba(255,255,255,.7)}
.res .ln{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:9px;font-size:14.5px;font-variant-numeric:tabular-nums}
.res .ln span:first-child{color:rgba(255,255,255,.75)}
.res .ln .q{color:#F3C77A}
.res .ok{color:#8FE0B0}
.res .stretch{color:#F3C77A}

/* areas */
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.areas.n3,.areas.n5,.areas.n6{grid-template-columns:repeat(3,1fr)}
.areas .a{background:#fff;border:1px solid var(--stone);border-radius:6px;padding:18px 20px;display:grid;gap:6px;align-content:start;border-top:3px solid var(--buyer)}
.areas .a h3{font-size:25px}
.areas .a p{font-size:14px;color:var(--body);line-height:1.55}

/* wish list */
.wish{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
.wish .full{grid-column:1/-1}
.wchips{display:flex;flex-wrap:wrap;gap:7px}
.wchip{border:1px solid var(--stone-2);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.wchip.on{background:var(--night);border-color:var(--night);color:#fff}
.wish textarea.pin{min-height:62px;resize:vertical;font-size:14.5px}

/* narrow pages (phones) */
@container (max-width:760px){
  .pg .pg-in{padding:30px 20px 0;gap:16px}
  .pg .foot{margin:22px 20px 0;padding-bottom:18px;font-size:9.5px;letter-spacing:.12em}
  .pg h2{font-size:36px}
  .pg.close h2{font-size:40px}
  .pg .cols,.pg .cols.c37,.pg .cols.c73{grid-template-columns:1fr;gap:22px}
  .pg .ph-box{height:auto;aspect-ratio:4/3}
  .cv-top{top:22px;left:20px;right:20px}
  .cv-top img{height:34px}
  .cv-txt{left:20px;right:20px;bottom:110px}
  .cv-txt h1{font-size:44px}
  .cv-for b{font-size:24px}
  .cv-agent{left:20px;right:20px;bottom:22px;font-size:13px}
  .tiles,.pcards,.pcards.mkt,.nexts,.areas,.areas.n3,.areas.n5,.areas.n6{grid-template-columns:1fr}
  .proc{grid-template-columns:1fr 1fr}
  .askbig b{font-size:52px}
  .res .hd b{font-size:46px}
  .wish{grid-template-columns:1fr}
  .tl{grid-template-columns:96px 18px 1fr;gap:10px}
  .tl:not(:last-child)::after{left:113px}
  .tbl{font-size:13px}
  .tbl th,.tbl td{padding:8px 8px}
  .tbl .hide-s{display:none}
  .net .ln.tot b{font-size:30px}
  .agent .face{width:96px;height:96px;font-size:36px}
}
.frame.flow > .pg.cover{min-height:600px}

/* ── Print (Save as PDF) ───────────────────── */
#print-root{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important}
  body.printing > *:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  #print-root .frame{width:1122px;height:793px;overflow:hidden;break-after:page;page-break-after:always;box-shadow:none;border-radius:0}
  #print-root .frame:last-child{break-after:auto;page-break-after:auto}
  #print-root .pg{transform:none!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

</style>
</head>

const Store = (function () {
  const mem = new Map();
  let dbp = null, broken = false;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('charne-client-studio', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    }).catch(e => { broken = true; return null; });
    return dbp;
  }
  function tx(mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      if (!db) { const r = fn(null); return res(r && 'result' in r ? r.result : undefined); }
      const t = db.transaction('kv', mode), st = t.objectStore('kv');
      const req = fn(st);
      t.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    }));
  }
  return {
    get broken() { return broken; },
    get: k => tx('readonly', st => st ? st.get(k) : { result: mem.get(k) }),
    set: (k, v) => tx('readwrite', st => st ? st.put(v, k) : (mem.set(k, v), null)),
    del: k => tx('readwrite', st => st ? st.delete(k) : (mem.delete(k), null)),
    all: () => tx('readonly', st => st ? st.getAll() : { result: Array.from(mem.values()) }),
    keys: () => tx('readonly', st => st ? st.getAllKeys() : { result: Array.from(mem.keys()) })
  };
})();

async function loadAll() {
  try {
    const s = await Store.get('settings');
    if (s) ME = Object.assign({}, DEFAULT_ME, s);
    const keys = await Store.keys();
    const out = [];
    for (const k of keys) if (String(k).startsWith('client:')) { const c = await Store.get(k); if (c) out.push(c); }
    CLIENTS = out.sort((a, b) => b.updated - a.updated);
    return !!s;
  } catch (e) { return false; }
}

function yourRow(c, ask) {
  const fl = num(c.floor);
  if (!fl && !ask) return '';
  return '<tr class="you"><td>Your home</td><td class="r hide-s">' + esc(c.beds || '—') + '</td><td class="r">' + (fl ? esc(fl) + ' m²' : '—') + '</td><td class="r">' + (ask ? money(ask) : '—') + '</td><td class="r hide-s">' + (ask ? 'Asking' : '') + '</td><td class="r">' + (ask && fl ? money(ask / fl) : '—') + '</td></tr>';
}
function priceTiles(c, stats, ask, low) {
  if (!ask) return '';
  const fl = num(c.floor), per = fl ? ask / fl : null;
  const t = [];
  if (per) t.push(['Asking price per m²', money(per), stats.perM2 ? (Math.abs(per / stats.perM2 - 1) < 0.03 ? 'In line with recent sales' : (per > stats.perM2 ? Math.round((per / stats.perM2 - 1) * 100) + '% above the average' : Math.round((1 - per / stats.perM2) * 100) + '% below the average')) : '']);
  if (stats.perM2) t.push(['Average sold per m²', money(stats.perM2), stats.sold.length + ' recent sale' + (stats.sold.length > 1 ? 's' : '')]);
  if (low && ask > low) t.push(['Room to negotiate', money(ask - low), 'Down to the bottom of the range']);
  if (!t.length) return '';
  return '<div class="tiles" style="margin-top:auto">' + t.map((x, i) => '<div class="tile' + (i === 0 ? ' dark' : '') + '"><span>' + x[0] + '</span><b>' + x[1] + '</b>' + (x[2] ? '<em class="small" style="font-style:normal' + (i === 0 ? ';color:rgba(255,255,255,.7)' : '') + '">' + esc(x[2]) + '</em>' : '') + '</div>').join('') + '</div>';
}
function areaText(c, a) { const t = c.areaText || {}; return Object.prototype.hasOwnProperty.call(t, a) ? t[a] : (SUBURB_TEXT[a] || ''); }
function areaList(c) { return (c.areas || []).slice(0, 6).map(a => [a, areaText(c, a)]); }

function pagesFor(c, me) { return c.type === 'buyer' ? buyerPages(c, me) : listingPages(c, me); }

// Interactive bits inside pages (calculators, wish list). Delegated so they
// work in the preview, the presentation, the PDF and the client's copy.
function readPin(pg, k) { const el = pg.querySelector('[data-ci="' + k + '"]'); if (!el) return null; if (el.type === 'checkbox') return el.checked; return el.dataset.ci === 'rate' || el.dataset.ci === 'years' ? num(el.value) : parseMoney(el.value); }
function setOut(pg, k, v) { const el = pg.querySelector('[data-co="' + k + '"]'); if (el) el.innerHTML = v; }
function updateCalc(pg) {
  const kind = pg.dataset.calc;
  if (kind === 'afford') {
    const price = readPin(pg, 'price') || 0, dep = readPin(pg, 'deposit') || 0, rate = readPin(pg, 'rate') || 0, years = readPin(pg, 'years') || 20, income = readPin(pg, 'income');
    const bond = Math.max(price - dep, 0), pay = repayment(bond, rate, years);
    setOut(pg, 'pay', price ? money(pay) : '—');
    setOut(pg, 'term', price ? 'over ' + years + ' years at ' + rate + '%' : 'Enter a purchase price');
    setOut(pg, 'bond', price ? money(bond) : '—');
    setOut(pg, 'total', price ? money(pay * years * 12) : '—');
    setOut(pg, 'need', price ? money(pay / 0.30) + ' / month' : '—');
    const showInc = !!income;
    $$('[data-co-row]', pg).forEach(r => r.hidden = !showInc);
    const ladder = pg.querySelector('[data-co="ladder"]');
    if (ladder) {
      if (!price) ladder.innerHTML = '';
      else {
        const share = dep / price;
        const pts = Array.from(new Set([0.8, 0.9, 1, 1.1].map(k => Math.round(price * k / 50000) * 50000))).filter(v => v > 0);
        ladder.innerHTML = '<div class="small" style="letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px">Other price points</div><table class="tbl mini"><thead><tr><th>Price</th><th class="r">Per month</th><th class="r">Income needed</th></tr></thead><tbody>' +
          pts.map(v => { const pm = repayment(v * (1 - share), rate, years); return '<tr' + (v === Math.round(price / 50000) * 50000 ? ' class="you"' : '') + '><td>' + money(v) + '</td><td class="r">' + money(pm) + '</td><td class="r">' + money(pm / 0.3) + '</td></tr>'; }).join('') + '</tbody></table>';
      }
    }
    if (showInc) {
      setOut(pg, 'max', money(maxBond(income, rate, years)));
      setOut(pg, 'fit', !price ? '—' : (pay <= income * 0.30 ? '<span class="ok">Within reach</span>' : '<span class="stretch">A stretch</span>'));
    }
  } else if (kind === 'costs') {
    const price = readPin(pg, 'price') || 0, dep = readPin(pg, 'deposit') || 0, vat = readPin(pg, 'vat'), tf = readPin(pg, 'tfees'), bf = readPin(pg, 'bfees');
    const duty = transferDuty(price, vat);
    const loan = price - dep > 0;
    setOut(pg, 'dep', money(dep));
    setOut(pg, 'duty', price ? (vat ? 'None (VAT sale)' : money(duty)) : '—');
    setOut(pg, 'tf', tf ? money(tf) : '<span class="q">Quote needed</span>');
    setOut(pg, 'bf', !loan ? 'No bond' : (bf ? money(bf) : '<span class="q">Quote needed</span>'));
    const complete = !!tf && (!loan || !!bf);
    setOut(pg, 'cashlabel', complete ? 'Cash needed on transfer' : 'Cash needed, before attorney fees');
    setOut(pg, 'cash', price ? money(dep + duty + (tf || 0) + (loan ? (bf || 0) : 0)) : '—');
  }
}
function initPages(root) { $$('.pg[data-calc]', root).forEach(updateCalc); }
document.addEventListener('input', e => { const pg = e.target.closest && e.target.closest('.pg[data-calc]'); if (pg) updateCalc(pg); });
document.addEventListener('change', e => { const pg = e.target.closest && e.target.closest('.pg[data-calc]'); if (pg) updateCalc(pg); });
document.addEventListener('focusout', e => {

// ───────────────────────── decks: fit, present, print ─────────────────────────
const PW = 1122, PH = 793;
function deckHTML(pages) { return pages.map((p, i) => '<div class="frame" data-i="' + i + '">' + p + '</div>').join(''); }
function fitFrames(frames, width, maxH, allowFlow) {
  const flow = allowFlow && width < 760;
  const s = Math.min(width / PW, maxH ? maxH / PH : Infinity);
  frames.forEach(f => {
    f.classList.toggle('fixed', !flow); f.classList.toggle('flow', flow);
    if (!flow) f.style.setProperty('--s', s.toFixed(4)); else f.style.removeProperty('--s');
  });
}

function present(c, me, start) {
  CURRENT_CLIENT = c; CURRENT_ME = me;
  const pages = pagesFor(c, me);
  let i = Math.max(0, Math.min(start || 0, pages.length - 1));
  const ov = $('#overlay');
  ov.innerHTML = '<div class="present" role="dialog" aria-label="Presentation"><div class="pr-stage">' + deckHTML(pages) + '</div>' +
    '<div class="pr-bar"><button class="btn btn-d btn-sm" data-pr="prev" aria-label="Previous page">←</button><span class="count" id="pr-count"></span><button class="btn btn-d btn-sm" data-pr="next" aria-label="Next page">→</button>' +
    '<div class="pr-dots">' + pages.map((_, k) => '<button data-pr-go="' + k + '" aria-label="Page ' + (k + 1) + '"></button>').join('') + '</div><span class="sp"></span>' +
    '<span style="font-size:12.5px;opacity:.6">← → to move · Esc to finish</span><button class="btn btn-d btn-sm" data-pr="full">Full screen</button><button class="btn btn-d btn-sm" data-pr="close">Close</button></div></div>';
  const stage = $('.pr-stage', ov), frames = $$('.frame', stage);
  function layout() { fitFrames(frames, stage.clientWidth - 32, stage.clientHeight - 32, false); }
  function show() {
    frames.forEach((f, k) => f.hidden = k !== i);
    $('#pr-count').textContent = (i + 1) + ' / ' + pages.length;
    $$('[data-pr-go]', ov).forEach((b, k) => b.classList.toggle('on', k === i));
  }
  function go(n) { i = Math.max(0, Math.min(pages.length - 1, n)); show(); }
  function close() {
    document.removeEventListener('keydown', key); window.removeEventListener('resize', layout);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    ov.onclick = null; ov.innerHTML = '';
  }
  function key(e) {
    if (e.target.closest && e.target.closest('input,textarea,select')) { if (e.key === 'Escape') e.target.blur(); return; }
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(i - 1); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(pages.length - 1);
    else if (e.key === 'Escape' && !document.fullscreenElement) close();
  }
  ov.onclick = e => {
    const b = e.target.closest('[data-pr],[data-pr-go]'); if (!b) return;
    if (b.dataset.prGo) return go(Number(b.dataset.prGo));
    const a = b.dataset.pr;
    if (a === 'prev') go(i - 1); else if (a === 'next') go(i + 1); else if (a === 'close') close();
    else if (a === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here. Press F11.')); }
  };
  document.addEventListener('keydown', key); window.addEventListener('resize', layout);
  document.addEventListener('fullscreenchange', () => setTimeout(layout, 60));
  layout(); show(); initPages(stage);
  if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
}

function preparePrint(c, me) {
  CURRENT_CLIENT = c; CURRENT_ME = me;
  const root = $('#print-root');
  root.innerHTML = deckHTML(pagesFor(c, me));
  $$('.frame', root).forEach(f => { f.classList.add('fixed'); f.style.setProperty('--s', '1'); });
  initPages(root);
  const oldTitle = document.title;
  document.title = docTitle(c);
  document.body.classList.add('printing');
  let finished = false;
  return function done() {
    if (finished) return; finished = true;
    document.body.classList.remove('printing'); document.title = oldTitle; root.innerHTML = '';
  };
}
function printDeck(c, me) {
  const done = preparePrint(c, me);
  const after = () => { window.removeEventListener('afterprint', after); done(); };
  window.addEventListener('afterprint', after);
  setTimeout(() => { window.print(); setTimeout(after, 500); }, 250);
}
function docTitle(c) {
  return c.type === 'buyer' ? 'Buyer guide - ' + (c.names || 'client') : 'Selling plan - ' + (c.address || c.names || 'client');
}
function exportHTML(c, me) {
  const payload = JSON.stringify({ v: 1, client: c, me: me, made: new Date().toISOString() }).replace(/</g, '\\u003c');
  const re = /<script id="cs-client" type="application\/json">[\s\S]*?<\/script>/;
  let html = SOURCE.replace(re, () => '<script id="cs-client" type="application/json">' + payload + '<\/script>');
  html = html.replace(/<title>[\s\S]*?<\/title>/, () => '<title>' + esc(docTitle(c)) + '</title>');
  return html;
}

function timeAgo(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago';
}

app.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-open]'); if (!t) return;
  const d = t.dataset;
  if (d.new) { const c = d.new === 'buyer' ? newBuyer(ME) : newListing(ME); saveClient(c, true); go({ name: 'edit', id: c.id, step: 0 }); }
  else if (d.example) {
    const have = CLIENTS.find(x => x.example && x.type === d.example);
    const c = have || (d.example === 'buyer' ? exampleBuyer(ME) : exampleListing(ME));
    if (!have) saveClient(c, true);
    go({ name: 'edit', id: c.id, step: 0 }); toast(have ? 'Here is the example again.' : 'Example loaded. Change anything you like.');
  }
  else if (d.open) go({ name: 'edit', id: d.open, step: 0 });
  else if (d.present) { const c = CLIENTS.find(x => x.id === d.present); if (c) present(c, ME, 0); }
  else if (d.send) { const c = CLIENTS.find(x => x.id === d.send); if (c) openSend(c); }
  else if (d.copy) {
    const src0 = CLIENTS.find(x => x.id === d.copy); if (!src0) return;
    const c = JSON.parse(JSON.stringify(src0)); c.id = uid(); c.created = Date.now(); c.example = false;
    c.names = ''; c.first = ''; c.phone = ''; c.email = ''; c.date = todayISO();
    if (c.type === 'listing') { c.address = ''; c.photo = ''; c.photo2 = ''; c.bond = null; } else { c.income = null; }
    saveClient(c, true); go({ name: 'edit', id: c.id, step: 0 }); toast('Copied. Comparables and settings kept; client details cleared.');
  }
  else if (d.del) {
    const c = CLIENTS.find(x => x.id === d.del); if (!c) return;
    if (!confirm('Delete ' + (c.address || c.names || 'this client') + '? This cannot be undone.')) return;
    CLIENTS = CLIENTS.filter(x => x !== c); await Store.del('client:' + c.id); render(); toast('Deleted.');
  }
  else if (d.act === 'me') openMe(false);
  else if (d.act === 'demo') openDemo();
  else if (d.act === 'ai') openAI();
  else if (d.act === 'backup') backup();
  else if (d.act === 'home') { flushSaves(); go({ name: 'home' }); }
  else if (d.act === 'present') { const c = CLIENTS.find(x => x.id === VIEW.id); if (c) present(c, ME, 0); }
  else if (d.act === 'send') { const c = CLIENTS.find(x => x.id === VIEW.id); if (c) openSend(c); }
  else if (d.act === 'pdf') { const c = CLIENTS.find(x => x.id === VIEW.id); if (c) printDeck(c, ME); }
});

const STEPS = {

    { key: 'client', title: 'The client', pages: [0, 1] },
    { key: 'home', title: 'Their home', pages: [2, 0] },
    { key: 'price', title: 'Sales & price', pages: [4, 3] },
    { key: 'net', title: 'Walk-away figure', pages: [8] },
    { key: 'market', title: 'Marketing & launch', pages: [6, 7] },
    { key: 'send', title: 'Present & send', pages: [11] }
  ],
  buyer: [
    { key: 'client', title: 'The buyer', pages: [0, 1] },
    { key: 'budget', title: 'Budget', pages: [3, 4] },
    { key: 'areas', title: 'Areas', pages: [5] },
    { key: 'wish', title: 'Wish list', pages: [6] },
    { key: 'send', title: 'Present & send', pages: [8] }
  ]
};
function f(label, input, hint) { return '<div class="f"><label>' + label + '</label>' + input + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>'; }
function inp(c, k, opts) {
  opts = opts || {};
  let v = c[k];
  if (opts.money) v = moneyInput(v);
  return '<input class="in" data-k="' + k + '"' + (opts.money ? ' data-t="money" inputmode="numeric"' : '') + (opts.type ? ' type="' + opts.type + '"' : '') + (opts.step ? ' step="' + opts.step + '"' : '') +
    (opts.min != null ? ' min="' + opts.min + '"' : '') + (opts.list ? ' list="' + opts.list + '"' : '') + (opts.type === 'number' ? ' data-t="num"' : '') +
    ' value="' + esc(v == null ? '' : v) + '" placeholder="' + esc(opts.ph || '') + '">';
}
function sel(c, k, vals) { return '<select class="in" data-k="' + k + '"' + (typeof vals[0] === 'number' ? ' data-t="num"' : '') + '>' + vals.map(v => '<option' + (String(v) === String(c[k]) ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>'; }
function area(c, k, ph) { return '<textarea class="in" data-k="' + k + '" placeholder="' + esc(ph || '') + '">' + esc(c[k] || '') + '</textarea>'; }
function tog(c, k, label) { return '<label class="toggle"><input type="checkbox" data-k="' + k + '" data-t="bool"' + (c[k] ? ' checked' : '') + '><span>' + label + '</span></label>'; }
function dropZone(c, k, title, hint) {
  return '<div class="drop" tabindex="0" data-photo="' + k + '" role="button" aria-label="' + esc(title) + '">' +
    (c[k] ? '<img src="' + src(c[k]) + '" alt=""><div class="drop-acts"><span class="link">Replace</span><span class="link" data-clear-photo="' + k + '">Remove</span></div>'
      : '<div class="big">' + esc(title) + '</div><div>Drag a photo here, click to choose one, or paste (Ctrl+V)</div>') +
    (hint ? '<div class="hint">' + hint + '</div>' : '') + '<input type="file" accept="image/*" hidden></div>';
}

      '<div class="row2">' + f('Floor size (m²)', inp(c, 'floor', { type: 'number', min: 0, ph: 'e.g. 148' })) + f('Stand size (m²)', inp(c, 'erf', { type: 'number', min: 0, ph: 'optional' })) + '</div>' +
      f('Cover photo', dropZone(c, 'photo', 'Add the cover photo', 'Their home, front or garden side. Landscape works best.')) +
      '<div class="f"><span class="lbl">Features</span><div class="chips" data-chips="features">' + FEATURES.concat((c.features || []).filter(x => !FEATURES.includes(x))).map(x => '<button type="button" class="chip' + ((c.features || []).includes(x) ? ' on' : '') + '" data-v="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>' +

      '<div class="hint"><button class="link" data-write-love>Write it for me</button> from the features you ticked. Edit as you like.</div></div>' +
      f('Second photo (optional)', dropZone(c, 'photo2', 'Add a second photo', 'Shown on page 3. Inside or the garden.'));
  } else if (key === 'price') {
    const st = compStats(c);
    h = '<h2>Comparable sales & price</h2><p class="lead">Add three to six recent sales nearby: what they sold for, not asking prices. Add a listing that\'s on the market too, if it\'s competition.</p>' +

        '<input class="in" data-comp="' + i + '" data-ck="size" data-t="num" type="number" min="0" value="' + esc(r.size || '') + '" placeholder="Size m²"></div>' +
        '<div class="row3 comp3"><input class="in" data-comp="' + i + '" data-ck="beds" data-t="num" type="number" min="0" value="' + esc(r.beds || '') + '" placeholder="Beds">' +
        '<input class="in" data-comp="' + i + '" data-ck="date" type="month" value="' + esc(r.date || '') + '" title="Month sold">' +
        '<select class="in" data-comp="' + i + '" data-ck="status">' + ['Sold', 'On the market'].map(s => '<option' + (s === r.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div></div>').join('') +
      ((c.comps || []).length < 6 ? '<button class="btn btn-l" data-add-comp>+ Add a sale</button>' : '') +

      '<div class="sumbox" id="comp-sum">' + compSummary(c, st) + '</div>' +
      '<div class="row3">' + f('Range from', inp(c, 'low', { money: true, ph: '2 000 000' })) + f('Range to', inp(c, 'high', { money: true, ph: '2 200 000' })) + f('Asking price', inp(c, 'ask', { money: true, ph: '2 099 000' })) + '</div>' +
      '<div class="hint">Type prices any way: 2099000, 2 099 000 or 2.1m.</div>';
  } else if (key === 'net') {
    h = '<h2>What they\'ll walk away with</h2><p class="lead">Page 9 works out the seller\'s estimated net at the asking price. Leave anything you don\'t know blank. It simply won\'t show.</p>' +
      '<div class="row2">' + f('Commission %', inp(c, 'commission', { type: 'number', min: 0, step: 0.25 }), 'Your rate for this mandate') + '<div class="f" style="align-content:end">' + tog(c, 'vatIncl', 'This % already includes VAT') + '</div></div>' +
      f('Bond settlement (optional)', inp(c, 'bond', { money: true, ph: 'From their bank' }), 'Ask what they still owe. The bank gives the exact figure later.') +
      f('Bond cancellation fees (optional)', inp(c, 'cancel', { money: true, ph: 'From the attorney\'s quote' })) +
      f('Compliance certificates (optional)', inp(c, 'certs', { money: true, ph: 'From quotes' }), 'Electrical always; fence and gas if present.') +
      '<div class="sumbox" id="net-sum">' + netSummary(c) + '</div>';
  } else if (key === 'market') {
    h = '<h2>Marketing & launch</h2><p class="lead">Tick what you\'ll do for this home. Page 7 shows each one with a line on why it matters.</p>' +
      '<div class="mk" data-chips="marketing">' + MARKETING.map(m => '<button type="button" class="mkc' + ((c.marketing || []).includes(m[0]) ? ' on' : '') + '" data-v="' + m[0] + '">' + icon(m[1]) + '<span>' + esc(m[2]) + '</span></button>').join('') + '</div>' +

      f('Gross monthly income (optional)', inp(c, 'income', { money: true, ph: 'Household, before tax' }), 'Only if they shared it. It shows the largest bond banks are likely to offer.') +

function compSummary(c, st) {
  st = st || compStats(c);
  if (!st.sold.length) return '<span>Add sold prices and sizes to see the average and a suggested price.</span>';
  let s = '<span>Average sold: <b>' + money(st.avg) + '</b>' + (st.perM2 ? ' · Average per m²: <b>' + money(st.perM2) + '</b>' : '') + '</span>';
  if (st.indicative) s += '<span>Their ' + esc(c.floor) + ' m² at that rate: <b>' + money(st.indicative) + '</b></span><div><button class="link" data-suggest>Use this to fill in the range and asking price</button></div>';
  else if (st.perM2) s += '<span class="hint">Add the floor size on step 2 to get a suggested price.</span>';
  return s;
}
function netSummary(c) {
  const ask = num(c.ask);
  if (!ask) return '<span>Add the asking price on step 3 first.</span>';
  const com = commission(ask, num(c.commission), c.vatIncl);
  return '<span>At ' + money(ask) + ', commission incl. VAT is <b>' + money(com.incl) + '</b></span><span>Estimated amount to the seller</span><span class="big">' + money(sellerNet(c, ask)) + '</span>';
}
function buyerSummary(c) {
  const p = num(c.priceMax); if (!p) return '<span>Add a price to see the monthly repayment.</span>';
  const bond = Math.max(p - (num(c.deposit) || 0), 0), pay = repayment(bond, num(c.rate) || PRIME, num(c.years) || 20);
  return '<span>At ' + money(p) + ', the repayment is about</span><span class="big">' + money(pay) + ' / month</span><span>Transfer duty: <b>' + money(transferDuty(p)) + '</b> · Income banks look for: <b>' + money(pay / 0.3) + '</b></span>';
}
function readiness(c) {
  const out = [];
  out.push([!!c.names, c.type === 'buyer' ? 'Buyer\'s name' : 'Seller\'s name']);
  if (c.type === 'listing') {
    out.push([!!c.address, 'Address']);
    out.push([!!c.photo, 'Cover photo of their home']);
    out.push([compStats(c).sold.length >= 1, 'At least one comparable sale']);
    out.push([!!num(c.ask), 'Asking price']);
  } else {
    out.push([!!num(c.priceMax), 'Budget']);
    out.push([(c.areas || []).length > 0, 'At least one area']);
  }
  out.push([!!c.phone, 'Their WhatsApp number, for sending their copy']);
  out.push([!!ME.phone, 'Your own WhatsApp number in <button class="link" data-act="me">My details</button>, so their buttons reach you']);
  return out;
}
function writeLove(c) {
  const t = (c.propType || 'home').toLowerCase();
  const open = (c.beds ? c.beds + '-bedroom ' : '') + t + (c.suburb ? ' in ' + c.suburb : '') + '.';
  const lines = (c.features || []).map(x => FEATURE_LINE[x] || (x + '.')).slice(0, 4);
  return [open.charAt(0).toUpperCase() + open.slice(1)].concat(lines).join(' ');
}

let refreshPreview = () => {};
function renderEditor(c) {
  const steps = STEPS[c.type];
  const step = Math.max(0, Math.min(VIEW.step || 0, steps.length - 1));
  VIEW.step = step;
  if (VIEW.focus == null) VIEW.focus = steps[step].pages[0];
  CURRENT_CLIENT = c; CURRENT_ME = ME;
  document.title = (c.type === 'buyer' ? 'Buyer guide' : 'Listing') + ' – ' + (c.address || c.names || 'new') + ' · Client Studio';
  app.innerHTML = '<div class="ed"><div class="ed-bar"><button class="btn btn-d btn-sm" data-act="home">← All clients</button>' +
    '<div class="ttl" id="ed-title">' + esc(edTitle(c)) + '<small>' + (c.type === 'buyer' ? 'Buyer guide' : 'Listing presentation') + '</small></div>' +
    '<span class="saved" id="saved">Saved ✓</span><button class="btn btn-d btn-sm" data-act="pdf">Save as PDF</button><button class="btn btn-d btn-sm" data-act="present">▶ Present</button><button class="btn btn-p btn-sm" data-act="send">Send to client</button></div>' +
    '<nav class="steps" aria-label="Steps">' + steps.map((s, i) => '<button class="step' + (i === step ? ' on' : '') + (i < step ? ' done' : '') + '" data-step="' + i + '"><b>' + (i < step ? '✓' : i + 1) + '</b>' + esc(s.title) + '</button>').join('') + '</nav>' +
    '<div class="ed-main"><form class="form" id="form" autocomplete="off" onsubmit="return false">' + stepForm(c, step) + '</form>' +
    '<aside class="preview" aria-label="Preview"><div class="pv-label"><span id="pv-name"></span><span>Live preview · click a page below to see it</span></div><div class="pv-main" id="pv-main"></div><div class="thumbs" id="thumbs"></div></aside></div></div>';
  const form = $('#form');
  const pvMain = $('#pv-main'), thumbs = $('#thumbs');
  const draw = () => {
    const pages = pagesFor(c, ME);
    const fi = Math.min(VIEW.focus || 0, pages.length - 1);
    pvMain.innerHTML = '<div class="frame">' + pages[fi] + '</div>';
    const pvW = pvMain.clientWidth || 700;
    const maxH = Math.max(320, window.innerHeight - 250);
    fitFrames($$('.frame', pvMain), pvW, maxH, false);
    thumbs.innerHTML = pages.map((p, i) => '<button type="button" data-focus="' + i + '"' + (i === fi ? ' class="on"' : '') + ' aria-label="Page ' + (i + 1) + '"><span class="tn">' + (i + 1) + '</span><div class="frame">' + p + '</div></button>').join('');
    fitFrames($$('.frame', thumbs), 120, null, false);
    $('#pv-name').textContent = 'Page ' + (fi + 1) + ' of ' + pages.length;
    initPages(pvMain);
    const t = $('#ed-title'); if (t) t.firstChild.textContent = edTitle(c);
  };
  refreshPreview = debounce(draw, 140);
  draw();
  window.onresize = debounce(draw, 150);

  const change = () => { saveClient(c); refreshPreview(); updateSums(c); };
  form.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.k) {
      const k = el.dataset.k, t = el.dataset.t;
      let v = el.value;
      if (t === 'money') v = parseMoney(v);

function modal(html, wide) {
  const ov = $('#overlay');
  ov.innerHTML = '<div class="modal-wrap"><div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
  const wrap = $('.modal-wrap', ov);
  const close = () => { ov.innerHTML = ''; document.removeEventListener('keydown', esck); };

const AI_PROMPT = "You help Charn\u00e9 Snyman, property practitioner at RB Brand Real Estate (Pretoria East and Centurion, South Africa), prepare client presentations in her Client Studio. She describes a client in her own words. You reply with the client's details as one JSON block that she pastes into the studio, which then builds the finished presentation.\n\n## How to reply\n\n1. If the address or the client's name is missing, ask for it in one short question. Otherwise do not ask questions: fill in what you can and leave out what you don't know.\n2. Reply with exactly one ```json code block, then one line listing anything important that is still missing (for example \"Missing: bond settlement, cover photo\"). Nothing else.\n3. The JSON must have \"app\": \"charne-client-studio\" and \"type\": \"listing\" (for a seller / valuation / listing presentation) or \"buyer\" (for a buyer guide).\n4. Use plain numbers for money, in rand, with no spaces or \"R\" (2650000, not \"R2.65m\"). Dates are YYYY-MM-DD; months of sale are YYYY-MM.\n5. Never invent facts. Comparable sales, prices, sizes, bond amounts and incomes come only from what she tells you. If she gives no sales, leave \"comps\" out. You may suggest a price range only when she gives sales; say so in the missing line.\n6. Write in her style: short sentences, lifestyle first and then the facts, concrete features (covered patio, built-in braai, solar, stand size in m\u00b2). No exclamation marks. Never use \"nestled\", \"boasting\" or \"dream home\". British/South African spelling.\n7. Photos can't be sent this way. She adds them in the studio afterwards.\n\n## Listing presentation fields (\"type\": \"listing\")\n\n- \"names\": seller name(s) as on the cover, e.g. \"Johan & Elmarie van der Merwe\"\n- \"first\": how to greet them, e.g. \"Johan and Elmarie\"\n- \"phone\", \"email\": the seller's, if given\n- \"date\": appointment date (default today)\n- \"note\": a personal note from Charn\u00e9, 2 short paragraphs, warm and plain, in the first person\n- \"address\", \"suburb\", \"city\" (\"Pretoria East\", \"Centurion\", \"Pretoria\" or \"Hartbeespoort\")\n- \"propType\": one of \"Freehold house\", \"Townhouse\", \"Cluster home\", \"Estate home\", \"Apartment\", \"Smallholding\", \"Vacant stand\"\n- \"beds\", \"baths\" (0.5 steps allowed), \"garages\", \"floor\" (m\u00b2), \"erf\" (stand m\u00b2)\n- \"features\": list, using these names where they fit: Covered patio, Built-in braai, Pool, Garden, Solar power, Inverter & batteries, Borehole, Water tanks, Double garage, Automated garage doors, Open-plan living, Scullery, Study, Flatlet, Staff quarters, Walk-in closet, Fireplace, Views, Security estate, Pet-friendly, Fibre, Near schools\n- \"love\": \"What buyers will love\", 2 to 4 short sentences in her style. Mention load-shedding resilience (solar, inverter, borehole) when the home has it.\n- \"comps\": up to 6 recent sales: {\"addr\": \"4-bed, same street\", \"price\": 2650000, \"size\": 220, \"beds\": 4, \"date\": \"2026-08\", \"status\": \"Sold\"}. Use \"status\": \"On the market\" for competing listings.\n- \"compSource\": where the sales figures come from, if she says (e.g. \"Lightstone\")\n- \"low\", \"high\", \"ask\": the recommended range and asking price, if she gives them\n- \"commission\": percent (default 6), \"vatIncl\": true only if her percent already includes VAT\n- \"bond\": what the seller still owes, \"cancel\": bond cancellation fees, \"certs\": compliance certificate costs (only if given)\n- \"marketing\": list of ids from: photos, p24, pp, site, social, ads, buyers, showday, board, video, drone, feedback (default: photos, p24, pp, site, social, buyers, showday, feedback)\n- \"launch\": launch date (default two weeks from today)\n- \"mandate\": \"Sole mandate\", \"Open mandate\" or \"Dual mandate\"; \"months\": 1 to 6\n\n## Buyer guide fields (\"type\": \"buyer\")\n\n- \"names\", \"first\", \"phone\", \"email\", \"date\", \"note\" (as above; the note invites them to fill in the wish list on page 7)\n- \"firstTime\", \"preapproved\": true or false\n- \"timeline\": one of \"As soon as possible\", \"In the next 3 months\", \"In 3 to 6 months\", \"Later this year\", \"Just looking for now\"\n- \"priceMax\": budget, \"deposit\", \"income\": gross monthly household income (only if given), \"rate\": bond rate % (default 10.75, prime since September 2026), \"years\": 20, 25 or 30\n- \"areas\": up to 6 suburbs. Known ones: Equestria, Faerie Glen, Moreleta Park, Garsfontein, The Hills, Silver Lakes, Woodhill, Mooikloof, Lynnwood, Waterkloof, Rietvalleirand, Wierda Park, Eldoraigne, Rooihuiskraal North, Kosmos. Others are allowed.\n- \"areaText\": optional {\"Suburb\": \"one or two lines about living there\"}. Only for suburbs not in the known list, or when she asks for different wording. Keep it general and accurate.\n- \"beds\", \"baths\", \"garages\": what they want\n- \"wants\": list from: Garden, Pool, Pet-friendly, Solar or backup power, Security estate, Study, Flatlet, Fibre, Near schools, Single storey, Double garage, Borehole or water tanks\n\n## Example\n\nCharn\u00e9: \"Valuation tomorrow for Johan and Elmarie van der Merwe, 12 Jacaranda Street, Faerie Glen. 4 bed, 2 bath, double garage, 210 m\u00b2 on 850 m\u00b2. Pool, solar, covered patio. Sold nearby: 2.65m for 220 m\u00b2 in Aug, 2.55m for 205 m\u00b2 in July. Asking 2.6m. They owe about 1.1m.\"\n\nReply:\n\n```json\n{\n  \"app\": \"charne-client-studio\",\n  \"type\": \"listing\",\n  \"names\": \"Johan & Elmarie van der Merwe\",\n  \"first\": \"Johan and Elmarie\",\n  \"address\": \"12 Jacaranda Street\",\n  \"suburb\": \"Faerie Glen\",\n  \"city\": \"Pretoria East\",\n  \"propType\": \"Freehold house\",\n  \"beds\": 4, \"baths\": 2, \"garages\": 2, \"floor\": 210, \"erf\": 850,\n  \"features\": [\"Pool\", \"Solar power\", \"Covered patio\", \"Double garage\"],\n  \"love\": \"Summer afternoons at the pool and evenings on the covered patio. Solar power keeps function extractJSON(text) {
  let t = String(text || '');
  const fences = Array.from(t.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)).map(m => m[1]);
  const tries = fences.length ? fences : [t];
  for (const chunk of tries) {
    const a = chunk.search(/[\[{]/), b = Math.max(chunk.lastIndexOf('}'), chunk.lastIndexOf(']'));
    if (a < 0 || b <= a) continue;
    try { return JSON.parse(chunk.slice(a, b + 1).replace(/[“”]/g, '"')); } catch (e) { /* next */ }
  }

}

  ['low', 'high', 'ask', 'bond', 'cancel', 'certs', 'priceMax', 'deposit', 'income'].forEach(k => { if (x[k] == null || x[k] === '') return; const v = typeof x[k] === 'number' ? Math.round(x[k]) : parseMoney(x[k]); if (v != null && v >= 0) c[k] = v; });
  ['vatIncl', 'firstTime', 'preapproved'].forEach(k => { if (typeof x[k] === 'boolean') c[k] = x[k]; });
  const sb = pick(SUBURBS.map(r => r[0]), c.suburb); if (sb) c.suburb = sb;
  const pt = pick(PROP_TYPES, x.propType); if (pt) c.propType = pt;
  const tl = pick(TIMELINES, x.timeline); if (tl) c.timeline = tl;
  const md = pick(['Sole mandate', 'Open mandate', 'Dual mandate'], x.mandate); if (md) c.mandate = md;
  if (type === 'buyer' && c.years && ![20, 25, 30].includes(c.years)) c.years = 20;
  if (c.months) c.months = Math.min(6, Math.max(1, Math.round(c.months)));
  const strs = v => Array.isArray(v) ? v.filter(s => typeof s === 'string' && s.trim()).map(s => s.trim()) : null;
  const feats = strs(x.features); if (feats) c.features = feats.map(f => pick(FEATURES, f) || f);
  const wants = strs(x.wants); if (wants) c.wants = wants.map(w => pick(WANTS, w) || w);
  const mk = strs(x.marketing);
  if (mk) { const ids = mk.map(m => (MARKETING.find(r => r[0] === m.toLowerCase() || r[2].toLowerCase() === m.toLowerCase()) || [])[0]).filter(Boolean); if (ids.length) c.marketing = Array.from(new Set(ids.concat(['feedback']))); }
  const areas = strs(x.areas); if (areas) c.areas = Array.from(new Set(areas.map(a => pick(SUBURBS.map(s => s[0]), a) || a))).slice(0, 6);
  if (x.areaText && typeof x.areaText === 'object') { c.areaText = {}; Object.keys(x.areaText).forEach(k => { if (typeof x.areaText[k] === 'string') c.areaText[pick(SUBURBS.map(s => s[0]), k) || k] = x.areaText[k].trim(); }); }
  if (type === 'buyer') (c.areas || []).forEach(a => { if (!(a in SUBURB_TEXT) && !(c.areaText && a in c.areaText)) { c.areaText = c.areaText || {}; c.areaText[a] = ''; } });
  if (type === 'listing' && Array.isArray(x.comps) && x.comps.length) {
    c.comps = x.comps.slice(0, 6).filter(r => r && typeof r === 'object').map(r => ({
      addr: String(r.addr || r.address || r.description || '').trim(),
      price: typeof r.price === 'number' ? Math.round(r.price) : parseMoney(r.price),
      size: parseFloat(r.size || r.floor) || '', beds: parseFloat(r.beds) || '',
      date: /^\d{4}-\d{2}/.test(String(r.date || '')) ? String(r.date).slice(0, 7) : '',
      status: /market|listed|active|for sale/i.test(String(r.status || '')) ? 'On the market' : 'Sold'
    }));
  }
  if (!c.first && c.names) c.first = '';
  return c;
}
function importAI(text) {
  const raw = extractJSON(text);
  const list = Array.isArray(raw) ? raw : (Array.isArray(raw.clients) ? raw.clients : [raw.client || raw]);
  const made = list.map(normalizeAI);
  made.forEach(c => saveClient(c, true));
  return made;
}
function afterImport(made) {
  $('#overlay').innerHTML = '';
  const c = made[made.length - 1];
  go({ name: 'edit', id: c.id, step: STEPS[c.type].length - 1 });
  toast((made.length > 1 ? made.length + ' clients built' : 'Built') + '. Add the photo' + (c.type === 'buyer' ? ' if you like' : '') + ', then present or send.', 4500);
}
function copyText(t, ok) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(ok); } catch (e) { toast('Could not copy. Use the download instead.'); } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(() => toast(ok), fallback); else fallback();
}

  m.el.addEventListener('click', e => {

    }
  });
  setTimeout(() => { const t = $('#ai-reply'); if (t) t.addEventListener('paste', () => setTimeout(() => { try { extractJSON(t.value); $('#ai-err').textContent = ''; } catch (e) { /* wait for Build */ } }, 0)); }, 0);
}

async function backup() {
  flushSaves();
  const data = { app: 'charne-client-studio', v: 1, saved: new Date().toISOString(), settings: ME, clients: CLIENTS };
  download('Client Studio backup ' + todayISO() + '.json', JSON.stringify(data), 'application/json');
  toast('Backup saved to Downloads.');
}
async function restore(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'charne-client-studio') throw new Error('not ours');
    if (!confirm('Restore ' + (data.clients || []).length + ' clients from this backup? Clients already here are replaced by the backup\'s version.')) return;
    if (data.settings) { ME = Object.assign({}, DEFAULT_ME, data.settings); await Store.set('settings', ME); }
    for (const c of data.clients || []) await Store.set('client:' + c.id, c);
    await loadAll(); $('#overlay').innerHTML = ''; render(); toast('Restored.');
  } catch (e) { toast('That file isn\'t a Client Studio backup.'); }
}

// ───────────────────────── viewer (client's copy) ─────────────────────────
function renderViewer(data) {
  const c = data.client, me = Object.assign({}, DEFAULT_ME, data.me || {});
  CURRENT_CLIENT = c; CURRENT_ME = me;
  document.title = docTitle(c);
  document.body.style.background = '#E9E5DB';
  const pages = pagesFor(c, me);
  app.innerHTML = '<div class="viewer"><div class="vbar"><img src="' + ASSETS.lockupWhite + '" alt="RB Brand Real Estate"><div class="who"><b>' + esc(c.type === 'buyer' ? 'Your home-buying guide' : 'Your selling plan') + '</b>Prepared for ' + esc(c.names || 'you') + ' by ' + esc(me.name) + '</div>' +
    '<button class="btn btn-d btn-sm" data-v="present" id="v-present">▶ Present</button><button class="btn btn-d btn-sm" data-v="pdf">Save PDF</button>' +
    '<a class="btn btn-g btn-sm" href="' + esc(waLink(me.phone, 'Hi ' + (me.first || '') + ', ')) + '" target="_blank" rel="noopener">WhatsApp ' + esc(me.first || '') + '</a></div>' +
    '<div class="vdeck" id="vdeck">' + deckHTML(pages) + '</div><p class="vfoot">Prepared by ' + esc(me.name) + ', ' + esc(me.agency) + (me.ffc ? ' (FFC ' + esc(me.ffc) + ')' : '') + ', on ' + esc(fmtDate(c.date)) + '. Figures are estimates to plan with; the bank and the attorneys confirm the final numbers.</p></div>';
  const deck = $('#vdeck'), frames = $$('.frame', deck);
  const layout = () => { const w = deck.clientWidth - (window.innerWidth < 760 ? 0 : 32); fitFrames(frames, w, null, true); $('#v-present').hidden = window.innerWidth < 900; };
  layout(); initPages(deck);
  window.addEventListener('resize', debounce(layout, 120));
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    if (b.dataset.v === 'present') present(c, me, 0);
    if (b.dataset.v === 'pdf') printDeck(c, me);
  });
}

// ───────────────────────── start ─────────────────────────
async function start() {
  if (SHIPPED && SHIPPED.client) { renderViewer(SHIPPED); return; }
  const hadSettings = await loadAll();
  CURRENT_ME = ME;
  render();
  if (!hadSettings) openMe(true);
}

window.__studio = { importAI, extractJSON, AI_PROMPT, preparePrint, transferDuty, repayment, commission, parseMoney, money, waNumber, firstNameOf, exportHTML, pagesFor, get ME() { return ME; }, get CLIENTS() { return CLIENTS; } };
start();
