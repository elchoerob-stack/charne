<!doctype html>
<html><head><meta charset="utf-8"><title>CMS Workflow Recorder</title>
<style>
  body{font:13px system-ui,Segoe UI,sans-serif;margin:0;width:320px;color:#16203A;background:#F7F5F1}
  header{background:#0F2040;color:#fff;padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#7C879E}.dot.on{background:#E24C4C;box-shadow:0 0 0 3px rgba(226,76,76,.25)}
  main{padding:12px}label{display:block;font-size:11px;color:#4E5468;margin:8px 0 3px}
  input,select,textarea{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #D6CFC2;border-radius:6px;font:inherit;background:#fff}
  .row{display:flex;gap:8px;margin-top:10px}button{flex:1;padding:8px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
  .primary{background:#0F2040;color:#fff}.danger{background:#F8EAEA;color:#8B1A1A}.ghost{background:#fff;border:1px solid #D6CFC2}
  .stat{font-size:12px;color:#4E5468;margin-top:8px}.msg{margin-top:8px;font-size:12px;min-height:16px}
  details{margin-top:10px;font-size:12px}summary{cursor:pointer;color:#4E5468}
</style></head>
<body>
<header><span class="dot" id="dot"></span> CMS Workflow Recorder</header>
<main>
  <div id="setup">
    <label>Workflow title</label><input id="title" placeholder="e.g. Create a booking with OEM menu">
    <div class="row" style="margin-top:0">
      <div style="flex:1"><label>Purpose</label><select id="purpose"><option value="sop">SOP / training</option><option value="problem">Problem capture</option></select></div>
      <div style="flex:1"><label>Dealer code</label><input id="dealer" placeholder="e.g. UPN01"></div>
    </div>
    <label>Recorded by</label><input id="by" placeholder="Your name">
    <div class="row"><button class="primary" id="start">● Start recording</button></div>
  </div>
  <div id="live" hidden>
    <div class="stat" id="stat">Recording…</div>
    <label>Add a note at this point</label>
    <div class="row" style="margin-top:0"><input id="note" placeholder="What just happened / what you expected"><button class="ghost" id="addNote" style="flex:0 0 auto">Add</button></div>
    <div class="row"><button class="danger" id="stop">■ Stop</button></div>
  </div>
  <div id="done" hidden>
    <div class="stat" id="summary"></div>
    <div class="row"><button class="primary" id="upload">Send to CMS Agent</button><button class="ghost" id="download">Download JSON</button></div>
    <div class="row"><button class="ghost" id="discard">Discard</button></div>
  </div>
  <div class="msg" id="msg"></div>
  <details><summary>Server settings</summary>
    <label>CMS Agent server URL</label><input id="server" placeholder="http://localhost:8787">
    <label>Token (optional)</label><input id="token" type="password">
    <div class="row"><button class="ghost" id="save">Save</button></div>
  </details>
</main>
<script src="popup.js"></script>
</body></html>
