<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charné Deal Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0F2040; --ink-2:#1B2E52; --gold:#C49A2F; --gold-soft:#F2E7CC;
  --paper:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBFAF7; --line:#E5E0D8; --line-2:#D6CFC2;
  --t1:#16203A; --t2:#4E5468; --t3:#7C7A78;
  --go:#1A6B3A; --go-bg:#E9F3EC; --wait:#8A6100; --wait-bg:#FBF1DC; --stop:#8B1A1A; --stop-bg:#F8EAEA;
  --chrome:#0F2040; --chrome-t:#FFFFFF; --chrome-t2:rgba(255,255,255,.62); --chrome-line:rgba(255,255,255,.14);
  --shadow:0 1px 2px rgba(15,32,64,.05), 0 8px 24px -12px rgba(15,32,64,.18);
  --r:10px;
  --p-agent:#C49A2F; --p-buyer:#3A6EA5; --p-seller:#2E8B57; --p-conveyancer:#7B3068; --p-principal:#3C4A66;
  --viz:#2F4A7C; --viz-soft:#DDE3EE;
  --gold-ink:#8A6100; --btn-p-bg:#0F2040; --btn-p-fg:#FFFFFF; --toast-bg:#0F2040; --toast-fg:#FFFFFF; --tip-bg:#0F2040; --tip-fg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1122; --surface:#111B31; --surface-2:#16223B; --line:#22304C; --line-2:#2C3C5C;
    --t1:#ECE9E2; --t2:#A9B2C6; --t3:#7C879E; --gold-soft:#3A2F14;
    --go:#5FBF87; --go-bg:#12301F; --wait:#D9A93C; --wait-bg:#332715; --stop:#E28080; --stop-bg:#331919;
    --chrome:#101C36; --chrome-line:rgba(255,255,255,.10);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --p-agent:#E0B44F; --p-buyer:#5D9BE8; --p-seller:#3FB37E; --p-conveyancer:#E2739F; --p-principal:#9AA8C4;
    --viz:#D9AE45; --viz-soft:#26334D;
    --gold-ink:#E0B44F; --btn-p-bg:#C49A2F; --btn-p-fg:#10182B; --toast-bg:#C49A2F; --toast-fg:#10182B; --tip-bg:#25334F; --tip-fg:#ECE9E2;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1122; --surface:#111B31; --surface-2:#16223B; --line:#22304C; --line-2:#2C3C5C;
  --t1:#ECE9E2; --t2:#A9B2C6; --t3:#7C879E; --gold-soft:#3A2F14;
  --go:#5FBF87; --go-bg:#12301F; --wait:#D9A93C; --wait-bg:#332715; --stop:#E28080; --stop-bg:#331919;
  --chrome:#101C36; --chrome-line:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    --p-agent:#E0B44F; --p-buyer:#5D9BE8; --p-seller:#3FB37E; --p-conveyancer:#E2739F; --p-principal:#9AA8C4;
    --viz:#D9AE45; --viz-soft:#26334D;
    --gold-ink:#E0B44F; --btn-p-bg:#C49A2F; --btn-p-fg:#10182B; --toast-bg:#C49A2F; --toast-fg:#10182B; --tip-bg:#25334F; --tip-fg:#ECE9E2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--t1);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Spectral,Georgia,"Times New Roman",serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Chrome ─────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;background:var(--chrome);color:var(--chrome-t);border-bottom:1px solid var(--chrome-line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:7px;background:linear-gradient(150deg,var(--gold),#8E6B14);display:grid;place-items:center;font-family:Spectral,serif;font-weight:700;color:#0F2040;font-size:15px;flex:none}
.brand-t{min-width:0}
.brand-t b{display:block;font-family:Spectral,serif;font-weight:600;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--chrome-t2)}
.bar-sp{flex:1}
.rolebtn{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid var(--chrome-line);border-radius:999px;padding:5px 12px 5px 5px;color:var(--chrome-t)}
.rolebtn:hover{background:rgba(255,255,255,.13)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0F2040;flex:none;letter-spacing:.02em}
.rolebtn .rt{text-align:left;line-height:1.15}
.rolebtn .rt b{display:block;font-size:12.5px;font-weight:600}
.rolebtn .rt span{display:block;font-size:10px;color:var(--chrome-t2);letter-spacing:.08em;text-transform:uppercase}
.caret{opacity:.6}
.pop{position:absolute;top:56px;right:16px;z-index:60;width:296px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pop-h{padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pop-i{display:flex;gap:11px;align-items:center;width:100%;padding:11px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.pop-i:last-child{border-bottom:0}
.pop-i:hover{background:var(--surface-2)}
.pop-i[aria-current="true"]{background:var(--gold-soft)}
.pop-i .n{flex:1;min-width:0}
.pop-i .n b{display:block;font-size:13px;font-weight:600}
.pop-i .n span{display:block;font-size:11px;color:var(--t2)}
.dot-n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--stop-bg);color:var(--stop);font-size:11px;font-weight:700;display:grid;place-items:center}
.dot-0{background:var(--go-bg);color:var(--go)}

/* ── Deal strip ─────────────────────────── */
.strip{background:var(--chrome);color:var(--chrome-t);border-bottom:1px solid var(--chrome-line)}
.strip-in{max-width:1180px;margin:0 auto;padding:0 16px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.strip h1{font-size:21px;color:#fff}
.strip .ref{font-size:11px;color:var(--chrome-t2);letter-spacing:.06em}
.prog{flex:1;min-width:220px}
.prog-l{display:flex;justify-content:space-between;font-size:11px;color:var(--chrome-t2);margin-bottom:5px}
.track{height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E4C878);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── Shell ──────────────────────────────── */
.shell{max-width:1180px;margin:0 auto;padding:20px 16px 96px;display:grid;grid-template-columns:216px minmax(0,1fr);gap:26px;align-items:start}
.shell>main{min-width:0}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;background:none;border:0;border-radius:8px;color:var(--t2);font-size:13.5px;font-weight:500;text-align:left}
.rail button:hover{background:var(--surface);color:var(--t1)}
.rail button[aria-current="true"]{background:var(--surface);color:var(--t1);font-weight:600;box-shadow:var(--shadow)}
.rail button[aria-current="true"] svg{color:var(--gold)}
.rail .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--t3);font-family:"IBM Plex Mono",monospace}
.rail-note{margin-top:14px;padding:11px;border:1px dashed var(--line-2);border-radius:9px;font-size:11px;color:var(--t3);line-height:1.45}
.tabs{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding:16px 12px 84px;gap:0}
  .rail{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;background:none;border:0;color:var(--t3);font-size:10px;font-weight:600;position:relative}
  .tabs button[aria-current="true"]{color:var(--gold)}
  .tabs .cnt{position:absolute;top:4px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:99px;background:var(--stop);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .strip h1{font-size:18px}
  .strip .ref{font-size:10.5px}
  .sec-h{flex-direction:column;gap:1px;align-items:flex-start;margin-bottom:14px}
}
@media (max-width:560px){
  .brand-t{display:none}
  .rolebtn .rt b{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* ── Cards ──────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:16px;flex:1;min-width:0}
.card-b{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>*{min-width:0}
.grid2>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:2px 0 12px}
.sec-h h2{font-size:19px}
.sec-h p{margin:0;font-size:12.5px;color:var(--t2)}

/* ── Chips / states ─────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.c-go{background:var(--go-bg);color:var(--go)}
.c-wait{background:var(--wait-bg);color:var(--wait)}
.c-stop{background:var(--stop-bg);color:var(--stop)}
.c-mute{background:var(--surface-2);color:var(--t3);border:1px solid var(--line)}
.c-gold{background:var(--gold-soft);color:var(--gold-ink)}
.stripe{width:3px;border-radius:99px;align-self:stretch;flex:none}

/* ── Tiles ──────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.tile .k{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.tile .v{font-family:Spectral,serif;font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--t2);margin-top:2px}

/* ── Action list ────────────────────────── */
.act{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0;padding-bottom:0}
.act:first-child{padding-top:0}
.act-t{flex:1;min-width:0}
.act-t b{display:block;font-size:13.5px;font-weight:600}
.act-t span{display:block;font-size:12px;color:var(--t2);margin-top:1px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--gold);color:var(--gold-ink)}
.btn-p{background:var(--btn-p-bg);color:var(--btn-p-fg);border-color:var(--btn-p-bg)}
.btn-p:hover{filter:brightness(1.12)}
.btn-g{background:var(--gold);color:#10182B;border-color:var(--gold)}
.btn-g:hover{color:#10182B;filter:brightness(1.07)}
.btn-s{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{text-align:center;padding:26px 16px;color:var(--t2);font-size:13px}
.empty b{display:block;font-family:Spectral,serif;font-size:15px;color:var(--t1);margin-bottom:3px}

/* ── Stage spine ────────────────────────── */
.spine{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:34px 1fr;gap:14px}
.node{display:flex;flex-direction:column;align-items:center}
.bead{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--t3);font-family:"IBM Plex Mono",monospace;flex:none;z-index:1}
.stage.done .bead{background:var(--go);border-color:var(--go);color:#fff}
.stage.now .bead{border-color:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 4px var(--gold-soft)}
.line{flex:1;width:2px;background:var(--line);margin:4px 0}
.stage.done .line{background:var(--go)}
.stage-c{padding-bottom:16px;min-width:0}
.stage-hd{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:4px 0 0;text-align:left}
.stage-hd h3{font-size:15.5px;flex:1;min-width:0}
.stage.locked .stage-hd h3{color:var(--t3)}
.stage-sub{font-size:12px;color:var(--t2);margin:3px 0 0}
.stage-body{margin-top:11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.task{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;margin-top:1px;padding:0}
.task.on .tick{background:var(--go);border-color:var(--go);color:#fff}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:13px;font-weight:600}
.task.on .tx b{color:var(--t2)}
.task .tx span{display:block;font-size:11.5px;color:var(--t3);margin-top:2px}
.owner{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ── Vault ──────────────────────────────── */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.doc.restricted{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 9px,var(--surface) 9px,var(--surface) 18px);border-style:dashed}
.doc-t{display:flex;gap:9px;align-items:flex-start}
.doc-t .ic{width:30px;height:30px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--t3);flex:none}
.doc-t b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.doc-t span{display:block;font-size:11px;color:var(--t3);margin-top:2px}
.doc-f{font-size:11px;color:var(--t2);border-top:1px dashed var(--line);padding-top:8px;word-break:break-all}
.doc-a{display:flex;gap:7px;margin-top:auto;flex-wrap:wrap}
.link-box{border:1px solid var(--gold);background:var(--gold-soft);border-radius:8px;padding:9px 11px;font-size:11px}
.link-box .u{display:block;word-break:break-all;color:var(--t2);margin:4px 0 6px;font-size:10.5px;line-height:1.4}
.cd{font-weight:700;color:var(--gold-ink)}
.cd.exp{color:var(--stop)}

/* ── Thread ─────────────────────────────── */
.msg{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}
.msg:last-of-type{border-bottom:0}
.msg-b{flex:1;min-width:0}
.msg-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg-h b{font-size:13px;font-weight:600}
.msg-h .tm{font-size:10.5px;color:var(--t3)}
.msg-x{font-size:13.5px;color:var(--t1);margin:4px 0 0;white-space:pre-wrap}
.tagref{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:3px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:11px;color:var(--t2);font-weight:500}
.comp{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
textarea,select,input[type=text]{width:100%;font:inherit;font-size:13.5px;color:var(--t1);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 11px}
textarea{resize:vertical;min-height:74px}
.comp-r{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
select{width:auto;max-width:100%;padding:7px 10px;font-size:12.5px}

/* ── Audit ──────────────────────────────── */
.log{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.logrow{display:grid;grid-template-columns:132px 92px 1fr;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:12px;background:var(--surface)}
.logrow:nth-child(even){background:var(--surface-2)}
.logrow:last-child{border-bottom:0}
.logrow .ts{color:var(--t3);font-size:11px}
.logrow .who{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.logrow{grid-template-columns:1fr;gap:2px}.logrow .ts{order:3}}

/* ── Property ───────────────────────────── */
.hero{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.hero-img{height:170px;position:relative;display:flex;align-items:flex-end;padding:14px;overflow:hidden;
  background:linear-gradient(145deg,#0C2E18 0%,#1E6B3E 55%,#2E8B57 100%)}
.hero-img::before{content:"";position:absolute;inset:0;opacity:.20;
  background-image:linear-gradient(135deg,rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(225deg,rgba(255,255,255,.9) 1px,transparent 1px);
  background-size:46px 46px;background-position:0 12px}
.hero-img::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 78% 8%,rgba(196,154,47,.34),transparent 62%)}
.hero-img .pill{position:relative;z-index:1}
.hero-img .pill{background:rgba(15,32,64,.72);color:#fff;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
.specs{display:flex;gap:18px;flex-wrap:wrap;padding:13px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--t2)}
.specs b{color:var(--t1);font-weight:600}

/* ── Misc ───────────────────────────────── */
.note{display:flex;gap:10px;padding:11px 13px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--t2);line-height:1.5}
.note b{color:var(--t1)}
.toast{background:var(--toast-bg);color:var(--toast-fg);position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);z-index:80;padding:10px 16px;border-radius:99px;font-size:12.5px;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 30px;font-size:11px;color:var(--t3);line-height:1.6}
.foot a{color:var(--t2)}
svg{display:block}

/* ── Breadcrumb / context bar ───────────── */
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--chrome-t2)}
.crumb button{background:none;border:0;color:var(--chrome-t2);padding:2px 0;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.crumb button:hover{color:#fff;text-decoration:underline}
.pop-group{padding:9px 14px 5px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.pop-i:disabled{opacity:.55;cursor:not-allowed}
.pop-i:disabled:hover{background:none}

/* ── Deal cards ─────────────────────────── */

/* ══ Format ═════════════════════════════════════════════════════════ */
const DAY = 864e5;
const d0 = n => new Date(Date.now() + n * DAY);
const iso = d => new Date(d).toISOString();
const R = n => "R " + Math.round(n).toLocaleString("en-ZA");
const Rm = n => n >= 1e6 ? "R " + (n / 1e6).toFixed(2).replace(/\.00$/, "") + "m" : R(n);
const dstr = d => new Date(d).toLocaleDateString("en-ZA", { day:"numeric", month:"short", year:"numeric" });
const stampf = d => new Date(d).toLocaleString("en-ZA", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" }).replace(",", "");
const daysTo = d => Math.round((new Date(d) - Date.now()) / DAY);
const dayDiff = d => Math.round((new Date(new Date(d).toDateString()) - new Date(new Date().toDateString())) / DAY);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const ago = t => { const m = (Date.now() - new Date(t)) / 6e4;
  if (m < 1) return "just now"; if (m < 60) return Math.floor(m) + " min ago";
  if (m < 1440) return Math.floor(m / 60) + " hr ago";
  const d = Math.floor(m / 1440); return d === 1 ? "yesterday" : d + " days ago"; };
const avatar = (personId, s = 28) => { const p = P[personId];
  return `<span class="av" style="width:${s}px;height:${s}px;background:${COL(p.role)};font-size:${Math.round(s * .39)}px">${p.ini}</span>`; };
const token = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

const THREADS = {

function buildDeal(D){
  const meta = { ...D };
  const st = { meta, done:{}, docs:{}, links:{}, msgs:[], log:[], open:{}, seen:{},
    access:{ buyer:"joined", seller:"joined", conveyancer:"joined" },
    extra:(D.extras || []).map(([person, preset, status]) => ({ person, preset, status, token:token() })),
    otpDate:iso(d0(-D.otpAgo)), bondDue:D.bondIn === null ? null : iso(d0(D.bondIn)) };
  const span = Math.max(1, D.otpAgo - D.lastAct);
  const at = frac => iso(d0(-(D.otpAgo - span * frac)));
  const done = [];
  STAGES.filter(s => s.n < D.stage).forEach((s, i, arr) => {
    const base = (i + 1) / (arr.length + 1);
    s.tasks.forEach((t, j) => {
      st.done[t.id] = true;
      const ts = at(base - .04 + (j / s.tasks.length) * .07);
      if (t.doc) st.docs[t.doc] = { file:FNAME[t.doc], size:(120 + j * 97) + " KB", by:t.owner, ts, verified:true };
      done.push({ ts, who:D[t.owner], act:t.doc ? "Document uploaded" : "Task completed", det:t.doc ? `${DOC[t.doc].name} · ${FNAME[t.doc]}` : `Stage ${s.n} · ${t.label}` });
    });
    done.push({ ts:at(base + .05), who:D.agent, act:"Stage complete", det:`${s.name} — documents from this stage are now locked` });
  });
  (D.extra || []).forEach((id, k) => {
    const t = TASK[id]; st.done[id] = true;
    const ts = iso(d0(-(D.lastAct + (D.extra.length - k))));
    if (t.doc) st.docs[t.doc] = { file:FNAME[t.doc], size:(180 + k * 64) + " KB", by:D[t.owner], ts, verified:k % 2 === 0 };
    done.push({ ts, who:D[t.owner], act:t.doc ? "Document uploaded" : "Task completed", det:t.doc ? `${DOC[t.doc].name} · ${FNAME[t.doc]}` : `Stage ${t.stage} · ${t.label}` });
  });
  st.log = [{ ts:iso(d0(-D.otpAgo)), who:D.agent, act:"Deal room opened", det:`${D.address}, ${D.area} · ${D.ref}` },
            { ts:iso(d0(-D.otpAgo + .2)), who:D.agent, act:"Parties invited", det:"Purchaser, seller and transferring attorney granted access" },
            ...done].sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const thread = THREADS[Math.min(7, D.stage)] || THREADS[1];
  st.msgs = thread.map(([role, body], i) => ({ id:`${D.id}m${i}`, by:D[role] || D.agent,
    ts:iso(d0(-(D.lastAct + (thread.length - i) * 1.4))), body, tag:{ k:"stage", v:Math.min(7, D.stage) } }));
  return st;
}

  if (!d) return null;

};
const extraIn = (d, person) => (d && d.extra || []).find(e => e.person === person && e.status === "joined");
function accessIn(d, person){
  const r = roleIn(d, person);
  if (r) return { role:r, cats:null, core:true };
  const x = extraIn(d, person);
  if (x){ const pr = EXTRA_ROLES[x.preset]; return { role:pr.as, cats:pr.cats, core:false, preset:x.preset }; }
  return null;
}

};

const current = d => STAGES.find(s => !stageDone(d, s)) || STAGES[6];
const isClosed = d => STAGES.every(s => stageDone(d, s));
const pctOf = d => Math.round(ALL_TASKS.filter(t => d.done[t.id]).length / ALL_TASKS.length * 100);
const openFor = (d, role) => current(d).tasks.filter(t => t.owner === role && !d.done[t.id]);
const lastTouch = d => d.log.length ? d.log[0].ts : d.otpDate;
const stalled = d => !isClosed(d) && (Date.now() - new Date(lastTouch(d))) / DAY > 14;
const bondRisk = d => d.bondDue && !d.done.t2c ? daysTo(d.bondDue) : null;
const atRisk = d => !isClosed(d) && (stalled(d) || (bondRisk(d) !== null && bondRisk(d) < 7));

const myDeals = () => {
  const list = Object.values(S.deals), r = me().role;
  if (isPrincipal(S.me)) return list;

};

    const ds = all.filter(d => d.meta.agent === a), act = ds.filter(d => !isClosed(d));
    return { a, ds, act, pipeline:act.reduce((n, d) => n + d.meta.price, 0),
      prog:act.length ? Math.round(act.reduce((n, d) => n + pctOf(d), 0) / act.length) : 0,
      risk:act.filter(atRisk).length, closed:ds.length - act.length };
  }).sort((x, y) => y.pipeline - x.pipeline);
  const avgDays = Math.round(active.reduce((n, d) => n + -daysTo(d.otpDate), 0) / (active.length || 1));

  return `<div class="stack">

        return `<div class="act">
          <span class="stripe" style="background:var(--stop)"></span>
          <div class="act-t"><b>${esc(d.meta.address)}, ${esc(d.meta.area)}</b>
            <span>${P[d.meta.agent].name} · ${br !== null && br < 7 ? (br < 0 ? `bond condition lapsed ${Math.abs(br)} days ago` : `bond condition due in ${br} days`) : `no movement in ${Math.round((Date.now() - new Date(lastTouch(d))) / DAY)} days`} · stage ${current(d).n}</span></div>
          <button class="btn btn-s" data-act="open" data-d="${d.meta.id}">Open file</button>
        </div>`; }).join("")}</div>
    </div>` : ""}

    <div class="grid2">
      <div class="card">
        <div class="card-h">${ICON.track}<h2>Where the work is sitting</h2></div>
        <div class="card-b">
          <p style="margin:0 0 12px;font-size:12px;color:var(--t2)">Active transfers by stage. Hover a row to see which files.</p>
          <div class="chart">${byStage.map(b => `
            <button class="crow" data-empty="${b.deals.length ? 0 : 1}" data-tip="${esc(b.deals.length ? b.deals.map(d => `${d.meta.address} — ${P[d.meta.agent].name.split(" ")[0]}`).join(" • ") : "No files at this stage")}" data-tiptitle="${esc(b.s.n + ". " + b.s.name)}">
              <span class="cl">${b.s.n}. ${b.s.name}</span>
              <span class="cbar"><i style="width:${b.deals.length / max * 100}%"></i></span>
              <span class="cv">${b.deals.length}</span>
            </button>`).join("")}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">${ICON.log}<h2>Latest movement</h2></div>
        <div class="card-b" style="padding:6px 16px 14px">
          ${all.flatMap(d => d.log.slice(0, 2).map(e => ({ ...e, d }))).sort((a, b) => new Date(b.ts) - new Date(a.ts)).slice(0, 6)
            .map(e => `<div class="act" style="padding:11px 0">
              <span class="stripe" style="background:${COL(P[e.who].role)}"></span>
              <div class="act-t"><b>${esc(e.act)}</b><span>${esc(e.d.meta.address)} · ${P[e.who].name.split(" ")[0]} · ${ago(e.ts)}</span></div></div>`).join("")}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">${ICON.team}<h2>Agents</h2></div>
      <div class="tblwrap"><table>
        <thead><tr><th>Agent</th><th>Active</th><th>Pipeline</th><th>Average progress</th><th>Attention</th><th>Registered</th><th></th></tr></thead>
        <tbody>${agents.map(a => `<tr>
          <td><span class="who-cell">${avatar(a.a, 26)}<b>${P[a.a].name}</b></span></td>
          <td class="num">${a.act.length}</td>
          <td class="num">${Rm(a.pipeline)}</td>
          <td><div style="display:flex;align-items:center;gap:9px"><div class="minibar" style="flex:1"><i style="width:${a.prog}%"></i></div><span class="num" style="font-size:12px;color:var(--t2)">${a.prog}%</span></div></td>
          <td>${a.risk ? `<span class="chip c-stop">${a.risk} file${a.risk > 1 ? "s" : ""}</span>` : `<span class="chip c-go">Clear</span>`}</td>
          <td class="num">${a.closed}</td>

        </tr>`).join("")}</tbody>
      </table></div>
    </div>

    <div class="note">${ICON.shield}<div><b>Oversight without oversharing.</b> As principal you can see every file's progress, but the purchasers' and sellers' FICA and finance documents stay closed to you — POPIA asks that people only reach the personal information they actually need. Your access is written to each file's audit log like everyone else's.</div></div>
  </div>`;
}

/* ══ Shared deal partials ═══════════════════════════════════════════ */
const partyOf = (d, role) => role === "agent" ? d.meta.agent : d.meta[role] || d.meta.agent;
const ownerChip = (d, role) => `<span class="chip c-mute"><span class="stripe" style="background:${COL(role)};width:3px;height:11px"></span>${P[partyOf(d, role)].kind}</span>`;
const DOCSTATE = { awaiting:{ cls:"c-wait", txt:"Awaiting upload" }, uploaded:{ cls:"c-gold", txt:"Uploaded" },
  verified:{ cls:"c-go", txt:"Verified" }, locked:{ cls:"c-go", txt:"Locked" } };
function taskAction(d, t, live){
  if (!live) return `<span class="chip c-mute">${ICON.lock} Locked</span>`;
  if (d.done[t.id]) return `<span class="chip c-go">${ICON.check} Done</span>`;
  if (t.owner !== myRole()) return `<span class="chip c-wait">Waiting on ${P[partyOf(d, t.owner)].name.split(" ")[0]}</span>`;
  return t.doc
    ? `<button class="btn btn-g btn-s" data-act="upload" data-d="${t.doc}" data-t="${t.id}">${ICON.up} Upload</button>`
    : `<button class="btn btn-p btn-s" data-act="task" data-t="${t.id}">Mark done</button>`;
}

      ${r === "agent" ? `<button class="btn btn-s" data-act="send" data-ctx='${esc(JSON.stringify({ deal:d.meta.id, to:d.meta.buyer, tpl:"bond_reminder", when:d.bondDue, people:[d.meta.buyer, d.meta.seller] }))}'>${ICON.chat} Remind the buyer</button>` : ""}</div></div>` : ""}

    ${r === "principal" ? "" : `<div class="card">
      <div class="card-h">${ICON.check}<h2>Your next steps</h2><span class="chip c-mute">Stage ${c.n} · ${c.name}</span></div>
      <div class="card-b">
        ${mine.length ? mine.map(t => `<div class="act">
            <span class="stripe" style="background:${COL(r)}"></span>
            <div class="act-t"><b>${esc(t.label)}</b><span>${t.doc ? "Adds " + esc(DOC[t.doc].name) + " to the vault" : esc(t.note || "Confirm to advance the file")}</span></div>

        ${r === "agent" || r === "conveyancer" ? `<span style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn btn-s" data-act="nudge" data-t="${t.id}">In the room</button>
          <button class="btn btn-g btn-s" data-act="send" data-ctx='${esc(JSON.stringify({ deal:d.meta.id, to:partyOf(d, t.owner), tpl:"doc_request", item:t.label, people:["buyer", "seller", "conveyancer"].map(x => d.meta[x]) }))}'>${ICON.chat} WhatsApp</button></span>`

      <div class="card-b">
        ${l.offers.length ? l.offers.map(o => (r === "prospect" && o.person !== S.me) ? "" : `<div class="act">

        ${r === "prospect" && l.status === "active" && !(myOffer && myOffer.status === "submitted") ? `<form id="offerform" style="margin-top:16px;border-top:1px solid var(--line);padding-top:16px">
          <div class="subhead" style="border:0;padding:0;margin:0 0 11px">Make an offer</div>
          <div class="form">

          </div>
          <button type="submit" class="btn btn-g" style="margin-top:13px">${ICON.send} Send this offer to ${esc(P[l.meta.agent].name.split(" ")[0])}</button>
          <p style="margin:10px 0 0;font-size:11.5px;color:var(--t3)">This is an expression of interest inside the concept — a real Offer to Purchase is a signed document.</p>
        </form>` : ""}
      </div>
    </div>` : ""}

    <div class="note">${ICON.shield}<div><b>Access to a house is granted one buyer at a time.</b> ${isAgent
      ? "Each buyer sees only the documents you shared and only their own offer — never what anyone else offered. Revoke a link and it stops working immediately."
      : `You are seeing ${esc(l.meta.address)} because ${esc(P[l.meta.agent].name)} gave you access to it. You cannot see other buyers, their offers, or any other house on her books.`}</div></div>
  </div>`;
}

const mentionRe = () => new RegExp("@(" + STAFF.map(id => P[id].name.split(" ")[0]).join("|") + ")(?![\\p{L}])", "giu");
const mentionise = txt => esc(txt).replace(mentionRe(),
  (m) => `<span class="chip c-gold" style="padding:1px 7px">${m}</span>`);
const mentions = txt => STAFF.filter(id => new RegExp("@" + P[id].name.split(" ")[0] + "(?![\\p{L}])", "iu").test(txt || ""));

/* ══ Board ══════════════════════════════════════════════════════════ */
const LISTS = [
  { id:"market", name:"On the market",        kind:"house", tint:"var(--go)" },
  { id:"offer",  name:"Offer in",             kind:"house", tint:"var(--gold)" },
  { id:"s1", n:1, name:"OTP & FICA",          kind:"deal",  tint:"var(--p-agent)" },
  { id:"s2", n:2, name:"Bond & Deposit",      kind:"deal",  tint:"var(--p-buyer)" },
  { id:"s3", n:3, name:"Compliance",          kind:"deal",  tint:"var(--p-seller)" },
  { id:"s4", n:4, name:"Rates & SARS",        kind:"deal",  tint:"var(--p-conveyancer)" },
  { id:"s5", n:5, name:"Drafting & Signature",kind:"deal",  tint:"var(--p-buyer)" },
  { id:"s6", n:6, name:"Deeds Office",        kind:"deal",  tint:"var(--p-conveyancer)" },
  { id:"s7", n:7, name:"Registration",        kind:"deal",  tint:"var(--go)" },
  { id:"done",   name:"Registered",           kind:"deal",  tint:"var(--go)" },
];
const LABELS = {
  urgent:{ name:"Urgent",           col:"var(--stop)" },
  client:{ name:"Waiting on client",col:"var(--wait)" },
  attorney:{ name:"With attorney",  col:"var(--p-conveyancer)" },
  admin:{ name:"Admin",             col:"var(--p-buyer)" },
  show:{ name:"Show house",         col:"var(--go)" },
};
const boardsFor = id => S.boards.filter(b => b.kind === "pipeline"
  ? (inTeam(id) || isPrincipal(id) || P[id].role === "agent")
  : b.owner === id || (b.shared || []).includes(id));
const curBoard = () => boardsFor(S.me).find(b => b.id === S.boardId) || boardsFor(S.me)[0] || S.boards[0];
const listsOf = b => b.kind === "pipeline" ? LISTS : b.lists;
const cardsOf = list => (S.board.cards || []).filter(c => c.board === S.boardId && c.list === list).sort((a, b) => a.pos - b.pos);
const labChip = k => typeof k === "string" ? LABELS[k] : k;
function listOfDeal(d){ return isClosed(d) ? "done" : "s" + current(d).n; }
function listOfListing(l){ return l.status !== "active" ? null : openOffers(l).length ? "offer" : "market"; }
function boardVisible(){
  const team = isPrincipal(S.me) ? agencyAgents() : teamOf(S.me);
  const mine = id => team.includes(id);
  const deals = Object.values(S.deals).filter(d => mine(d.meta.agent))
    .filter(d => !S.boardFilter || d.meta.agent === S.boardFilter);
  const listings = Object.values(S.listings).filter(l => mine(l.meta.agent))
    .filter(l => !S.boardFilter || l.meta.agent === S.boardFilter);
  return { deals, listings, team };
}
function dueChip(iso2){
  if (!iso2) return "";
  const n = dayDiff(iso2), cls = n < 0 ? "late" : n <= 3 ? "soon" : "ok";
  const txt = n < 0 ? Math.abs(n) + (Math.abs(n) === 1 ? "d over" : "d over") : n === 0 ? "today" : n === 1 ? "tomorrow" : new Date(iso2).toLocaleDateString("en-ZA", { day:"numeric", month:"short" });
  return `<span class="mi due ${cls}">${ICON.log} ${txt}</span>`;
}
function dealCardMini(d){
  const c = current(d), out = c.tasks.filter(t => !d.done[t.id]).length, doneN = c.tasks.length - out;
  const members = ["agent", "buyer", "seller", "conveyancer"].map(r => avatar(d.meta[r], 22)).join("");
  const labs = [];
  if (atRisk(d)) labs.push("urgent");
  if (current(d).tasks.some(t => !d.done[t.id] && (t.owner === "buyer" || t.owner === "seller"))) labs.push("client");
  if (current(d).tasks.some(t => !d.done[t.id] && t.owner === "conveyancer")) labs.push("attorney");
  return `<button class="tcard pinned" data-act="card" data-kind="deal" data-id="${d.meta.id}" data-drag="sync">
    <span class="labels">${labs.map(k => `<span class="lab" style="background:${LABELS[k].col}" title="${LABELS[k].name}"></span>`).join("")}</span>
    <span class="tt">${esc(d.meta.address)}</span>
    <span class="sub">${esc(d.meta.area)} · ${R(d.meta.price)}</span>
    <span class="meta">
      ${isClosed(d) ? `<span class="mi">${ICON.check} complete</span>` : `<span class="mi">${ICON.check} ${doneN}/${c.tasks.length}</span>`}
      ${d.msgs.length ? `<span class="mi">${ICON.chat} ${d.msgs.length}</span>` : ""}
      ${Object.keys(d.docs).length ? `<span class="mi">${ICON.file} ${Object.keys(d.docs).length}</span>` : ""}
      ${!isClosed(d) ? dueChip(d.bondDue && !d.done.t2c ? d.bondDue : null) : ""}
      <span class="faces">${members}</span>
    </span></button>`;
}
function houseCardMini(l){
  const joined = l.prospects.filter(x => x.status === "joined");
  const next = l.viewings.filter(v => daysTo(v.when) >= 0).sort((a, b) => new Date(a.when) - new Date(b.when))[0];
  return `<button class="tcard pinned" data-act="card" data-kind="house" data-id="${l.meta.id}" data-drag="sync">
    <span class="labels"><span class="lab wide" style="background:var(--go-bg);color:var(--go)">House</span>
      ${openOffers(l).length ? `<span class="lab wide" style="background:var(--wait-bg);color:var(--wait)">${openOffers(l).length} offer${openOffers(l).length > 1 ? "s" : ""}</span>` : ""}</span>
    <span class="tt">${esc(l.meta.address)}</span>
    <span class="sub">${esc(l.meta.area)} · ${R(l.meta.price)}</span>
    <span class="meta">
      <span class="mi">${ICON.people} ${joined.length}</span>
      ${next ? `<span class="mi">${ICON.log} viewing ${daysTo(next.when) === 0 ? "today" : "in " + daysTo(next.when) + "d"}</span>` : ""}
      <span class="faces">${avatar(l.meta.agent, 22)}${joined.slice(0, 3).map(x => avatar(x.person, 22)).join("")}</span>
    </span></button>`;
}
function manualCardMini(c){
  const doneN = c.checklist.filter(x => x[1]).length;
  return `<button class="tcard" data-act="card" data-kind="manual" data-id="${c.id}" data-drag="free">
    ${c.labels.length ? `<span class="labels">${c.labels.map(k => { const L3 = labChip(k); return L3 ? `<span class="lab" style="background:${L3.col}" title="${esc(L3.name)}"></span>` : ""; }).join("")}</span>` : ""}
    <span class="tt">${esc(c.title)}</span>
    <span class="meta">
      ${c.checklist.length ? `<span class="mi">${ICON.check} ${doneN}/${c.checklist.length}</span>` : ""}
      ${(c.comments || []).length ? `<span class="mi">${ICON.chat} ${c.comments.length}</span>` : ""}
      ${(c.files || []).length ? `<span class="mi">${ICON.file} ${c.files.length}</span>` : ""}
      ${dueChip(c.due)}
      <span class="faces">${c.members.map(m => avatar(m, 22)).join("")}</span>
    </span></button>`;
}
function vBoard(){
  const { deals, listings, team } = boardVisible();
  const B = curBoard(), pipeline = B.kind === "pipeline";
  return `<div class="stack">
    <div class="sec-h"><h2>${esc(B.name)}</h2><p>${pipeline ? "Every house and every transfer, in the column it is actually in" : "Imported board — works exactly as it did before"}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${boardsFor(S.me).map(b => `<button class="btn btn-s" data-act="switchboard" data-b="${b.id}" style="${b.id === S.boardId ? "border-color:var(--gold);background:var(--gold-soft)" : ""}">${esc(b.name)}</button>`).join("")}
      <button class="btn btn-s" data-act="importtrello">${ICON.up} Import a Trello board</button>
      ${!pipeline ? `<button class="btn btn-s" data-act="shareboard">${(B.shared || []).length ? ICON.people + " Shared with " + (B.shared || []).map(x => P[x].name.split(" ")[0]).join(", ") : ICON.people + " Share with the team"}</button>
        <button class="btn btn-s" data-act="delboard" style="color:var(--stop)">Remove this board</button>` : `<span class="chip c-mute">${ICON.people} Shared by ${esc(TEAM.map(x => P[x].name.split(" ")[0]).join(" and "))}</span>`}
    </div>
    ${pipeline ? `<div class="note">${ICON.shield}<div><b>The cards are the files themselves.</b> A house or a transfer sits in the column its real state puts it in — complete a step here or in the deal room and the card moves on its own. Cards you write yourself drag anywhere you like.</div></div>` : `<div class="note">${ICON.shield}<div><b>Brought across from Trello.</b> Your lists, cards, labels, due dates, checklists and members came over as they were. Everything drags and edits the way you are used to.</div></div>`}
    ${pipeline ? `<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
      <span class="eyebrow">Filter</span>
      <button class="btn btn-s" data-act="bfilter" data-p="" aria-current="${!S.boardFilter}" style="${!S.boardFilter ? "border-color:var(--gold)" : ""}">Everyone</button>
      ${team.map(a => `<button class="btn btn-s" data-act="bfilter" data-p="${a}" style="${S.boardFilter === a ? "border-color:var(--gold)" : ""}">${P[a].name.split(" ")[0]}</button>`).join("")}
      <span style="flex:1"></span>
      <span class="mono" style="font-size:11.5px;color:var(--t3)">${deals.length} transfers · ${listings.length} houses</span>
    </div>` : ""}
    <div class="boardwrap"><div class="board">${listsOf(B).map(L2 => {
      const pinned = !pipeline ? [] : L2.kind === "house"
        ? listings.filter(l => listOfListing(l) === L2.id).map(houseCardMini)
        : deals.filter(d => listOfDeal(d) === L2.id).map(dealCardMini);
      const manual = cardsOf(L2.id).map(manualCardMini);
      return `<div class="list" data-list="${L2.id}">
        <div class="list-h"><b>${esc(L2.name)}</b><span class="n">${pinned.length + manual.length}</span>
          ${!pipeline ? `<button class="mx" data-act="renlist" data-l="${L2.id}" aria-label="Rename list" style="font-size:13px">⋯</button>` : ""}</div>
        <div class="list-rail" style="background:${L2.tint || "var(--line-2)"};opacity:.5"></div>
        <div class="cards" data-drop="${L2.id}">${pinned.join("")}${manual.join("")}</div>
        <button class="addcard" data-act="addcard" data-list="${L2.id}">${ICON.plus} Add a card</button>
      </div>`;
    }).join("")}
    ${!pipeline ? `<div class="list" style="background:none;border-style:dashed"><button class="addcard" data-act="addlist" style="padding:14px 13px">${ICON.plus} Add a list</button></div>` : ""}</div></div>
  </div>`;
}

/* ══ Card detail ════════════════════════════════════════════════════ */

function closeCard(){ S.card = null; renderModal(); }

  if (!S.card) return;
  const { kind, id } = S.card;
  let body = "", title = "", sub = "", foot = "";
  if (kind === "deal"){
    const d = S.deals[id], c = current(d), a = accessIn(d, S.me);
    title = d.meta.address; sub = `${d.meta.area} · ${R(d.meta.price)} · stage ${c.n} of 7`;
    const doneN = c.tasks.filter(t => d.done[t.id]).length;
    body = `
      <div class="mblock"><div class="eyebrow">This stage — ${esc(c.name)}</div>
        <div class="bar-mini"><i style="width:${doneN / c.tasks.length * 100}%"></i></div>
        ${c.tasks.map(t => `<div class="check ${d.done[t.id] ? "on" : ""}">

          <span class="tx">${esc(t.label)}<br><span style="font-size:11px;color:var(--t3)">${P[partyOf(d, t.owner)].kind}${!d.done[t.id] && a && t.owner !== a.role ? " — theirs to do" : ""}</span></span>

        ${(d.extra || []).filter(x => x.status === "joined").map(x => `<span class="chip c-mute">${avatar(x.person, 20)} ${esc(P[x.person].name.split(" ")[0])}</span>`).join("")}</div></div>

  } else if (kind === "house"){

    body = `
      <div class="mblock"><div class="eyebrow">Buyers with access</div>
        ${l.prospects.length ? l.prospects.map(pr => `<div class="check"><span class="tick" style="opacity:.55">${pr.status === "joined" ? ICON.check : ""}</span>
          <span class="tx">${esc(P[pr.person].name)}<br><span style="font-size:11px;color:var(--t3)">${pr.status === "joined" ? "has access" : "invitation sent"}</span></span></div>`).join("")
          : `<p style="margin:0;font-size:13px;color:var(--t2)">Nobody yet.</p>`}</div>
      <div class="mblock"><div class="eyebrow">Viewings</div>
        ${l.viewings.length ? l.viewings.map(v => `<div class="check"><span class="tick" style="opacity:.55">${v.person ? ICON.check : ""}</span>
          <span class="tx">${new Date(v.when).toLocaleString("en-ZA", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })}<br>
          <span style="font-size:11px;color:var(--t3)">${v.person ? "booked by " + esc(P[v.person].name) : "open slot"}</span></span></div>`).join("")
          : `<p style="margin:0;font-size:13px;color:var(--t2)">No slots set.</p>`}</div>
      ${l.offers.length ? `<div class="mblock"><div class="eyebrow">Offers</div>
        ${l.offers.map(o => `<div class="check"><span class="tick" style="opacity:.55"></span><span class="tx">${R(o.amount)} — ${esc(P[o.person].name)}<br>
          <span style="font-size:11px;color:var(--t3)">${o.status === "submitted" ? "waiting on the seller" : o.status}</span></span></div>`).join("")}</div>` : ""}`;

function inbox(){
  const out = [];
  const seen = S.inboxSeen || {};
  // cards assigned to me that are due
  S.board.cards.filter(c => c.members.includes(S.me) && c.due).forEach(c => {
    const n = dayDiff(c.due);
    if (n <= 2) out.push({ rank:n < 0 ? 0 : 2, id:"due" + c.id, kind:"card", cardId:c.id, board:c.board, urgent:n < 0,
      title:c.title, why:n < 0 ? `${Math.abs(n)} day${Math.abs(n) === 1 ? "" : "s"} overdue` : n === 0 ? "due today" : n === 1 ? "due tomorrow" : `due in ${n} days`, ts:c.due });
  });
  // someone pulled me into a card
  S.board.cards.forEach(c => (c.comments || []).forEach(m => {
    if (m.by !== S.me && mentions(m.body).includes(S.me))
      out.push({ rank:1, id:"men" + c.id + m.ts, kind:"card", cardId:c.id, board:c.board, urgent:false,
        title:c.title, why:`${P[m.by].name.split(" ")[0]} mentioned you`, ts:m.ts });
  }));
  // steps in a file that are mine
  myDeals().forEach(d => { const acc = accessIn(d, S.me); if (!acc) return;
    openFor(d, acc.role).forEach(t => out.push({ rank:atRisk(d) ? 0 : 4, id:"task" + d.meta.id + t.id, kind:"deal", dealId:d.meta.id,
      urgent:atRisk(d), title:t.label, why:`${d.meta.address} · stage ${current(d).n}`, ts:lastTouch(d) }));
  });
  // messages in a file I have not read
  myDeals().forEach(d => { const n = unread(d, S.me);
    if (n) out.push({ rank:5, id:"msg" + d.meta.id, kind:"deal", dealId:d.meta.id, urgent:false,
      title:`${n} new message${n > 1 ? "s" : ""}`, why:d.meta.address, ts:d.msgs[d.msgs.length - 1].ts, chat:true });
  });
  // offers waiting on me
  myListings().filter(l => l.meta.agent === S.me).forEach(l => openOffers(l).forEach(o =>
    out.push({ rank:0, id:"off" + o.id, kind:"house", houseId:l.meta.id, urgent:true,
      title:`Offer of ${R(o.amount)} to answer`, why:`${l.meta.address} · from ${P[o.person].name}`, ts:o.ts })));
  return out.filter(x => !seen[x.id])
    .sort((a, b) => (a.rank - b.rank) || (new Date(b.ts) - new Date(a.ts)));
}

/* A framed preview blocks file downloads, so only offer the .ics where it works. */
const canDownload = () => { try { return window.self === window.top; } catch { return false; } };
const waNumber = m => { let n = String(m || "").replace(/[^\d+]/g, "");
  if (n.startsWith("+")) n = n.slice(1);
  if (n.startsWith("0")) n = "27" + n.slice(1);
  if (!n.startsWith("27") && n.length === 9) n = "27" + n;
  return n; };
const waLink = (mobile, text) => `https://wa.me/${waNumber(mobile)}?text=${encodeURIComponent(text)}`;
const mailLink = (email, subject, body) => `mailto:${encodeURIComponent(email || "")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
const gcalLink = (title, startISO, mins, details, where) => {
  const f = d => new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, "");
  const end = new Date(new Date(startISO).getTime() + mins * 6e4);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + `&text=${encodeURIComponent(title)}&dates=${f(startISO)}/${f(end)}`
    + `&details=${encodeURIComponent(details || "")}&location=${encodeURIComponent(where || "")}`;
};
function icsFor(title, startISO, mins, details, where){
  const f = d => new Date(d).toISOString().replace(/[-:]|\.\d{3}/g, "");
  const end = new Date(new Date(startISO).getTime() + mins * 6e4);
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//RB Brand//Deal Room//EN", "BEGIN:VEVENT",
    "UID:" + token() + "@rbbrand", "DTSTAMP:" + f(new Date()), "DTSTART:" + f(startISO), "DTEND:" + f(end),
    "SUMMARY:" + String(title).replace(/\n/g, " "),
    "DESCRIPTION:" + String(details || "").replace(/\n/g, "\\n"),
    "LOCATION:" + String(where || ""), "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}

    otp:g("f_otp"), bond:g("f_bond"), bname:g("f_bname"), bmob:g("f_bmob"), bmail:g("f_bmail"),
    sname:g("f_sname"), smob:g("f_smob"), smail:g("f_smail"), cname:g("f_cname"), cfirm:g("f_cfirm"), cmail:g("f_cmail") });
  window.scrollTo({ top:0 });
});

/* ══ Bringing a Trello board across ═════════════════════════════════
   Trello exports a board as JSON (Board menu → Print, export and share
   → Export as JSON). Everything below is read in the browser; the file
   never leaves the device. ════════════════════════════════════════════ */
const TRELLO_COL = { green:"#3F8F5B", yellow:"#C9A227", orange:"#C97B2A", red:"#B3392F", purple:"#7B3068",
  blue:"#3A6EA5", sky:"#3E8FA8", lime:"#6C9A3F", pink:"#B85585", black:"#4A4A55",
  green_dark:"#2E6B45", blue_dark:"#2C5580", null:"#8A8A94" };
const trelloImport = Object.assign(document.createElement("input"), { type:"file", accept:".json,application/json", hidden:true });
document.body.appendChild(trelloImport);
trelloImport.addEventListener("change", () => {
  const f = trelloImport.files && trelloImport.files[0];
  trelloImport.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onerror = () => toast("That file could not be read");
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); }
    catch { toast("That is not a Trello export — look for the .json file"); return; }
    try { adoptTrello(data); }
    catch (err) { toast("Could not read that board: " + err.message); }
  };
  r.readAsText(f);
});
function adoptTrello(t){
  if (!t || !Array.isArray(t.lists) || !Array.isArray(t.cards))
    throw new Error("no lists or cards in the file");
  const bid = "b" + Date.now();
  const lists = t.lists.filter(l => !l.closed).sort((a, b) => (a.pos || 0) - (b.pos || 0))
    .map(l => ({ id:bid + "_" + l.id, name:l.name || "Untitled list" }));
  const listBy = Object.fromEntries(t.lists.map(l => [l.id, bid + "_" + l.id]));
  const known = new Set(lists.map(l => l.id));

  // members become people, so their faces show on the cards
  const memberBy = {};
  (t.members || []).forEach(m => {
    const name = m.fullName || m.username || "Member";
    const existing = Object.keys(P).find(k => P[k].name.toLowerCase() === name.toLowerCase());
    memberBy[m.id] = existing || newPerson("t_", name, "", "", "Team member", "agent", "From Trello");
  });

  const checksBy = {};
  (t.checklists || []).forEach(cl => {
    (checksBy[cl.idCard] = checksBy[cl.idCard] || []).push(
      ...(cl.checkItems || []).sort((a, b) => (a.pos || 0) - (b.pos || 0))
        .map(ci => [ci.name, ci.state === "complete"]));
  });

  let n = 0;
  t.cards.filter(c => !c.closed && known.has(listBy[c.idList])).forEach(c => {
    S.board.cards.push({
      id:"c" + (S.board.next++), board:bid, list:listBy[c.idList],
      title:c.name || "Untitled card", desc:c.desc || "",
      labels:(c.labels || []).map(l => ({ name:l.name || l.color || "Label", col:TRELLO_COL[l.color] || "#8A8A94" })),
      members:(c.idMembers || []).map(id => memberBy[id]).filter(Boolean),
      due:c.due || null, checklist:checksBy[c.id] || [], pos:c.pos || 0,
      files:[], comments:[], activity:[{ who:S.me, ts:new Date().toISOString(), what:"brought this card across from Trello" }],
    });
    n++;
  });
  if (!lists.length) throw new Error("every list in that board is archived");
  S.boards.push({ id:bid, name:t.name || "Imported board", kind:"custom", lists, owner:S.me, shared:[] });
  S.boardId = bid; S.view = "board"; S.card = null;
  toast(`${t.name || "Board"} brought across — ${n} card${n === 1 ? "" : "s"} in ${lists.length} lists`);
  render(); window.scrollTo({ top:0 });
}

/* ══ Dragging a card ════════════════════════════════════════════════
   Pointer events, so a finger works exactly like a mouse: touch holds
   briefly before it lifts, which keeps the board scrollable. ═════════ */
let drag = null;
function cardAt(e){ return e.target.closest ? e.target.closest("[data-drag]") : null; }
document.addEventListener("pointerdown", e => {
  if (S.view !== "board" || S.card) return;
  const card = cardAt(e); if (!card) return;
  const touch = e.pointerType !== "mouse";
  drag = { card, id:card.dataset.id, kind:card.dataset.kind, free:card.dataset.drag === "free",
    x0:e.clientX, y0:e.clientY, live:false, pointer:e.pointerId,
    timer:touch ? setTimeout(() => startDrag(e.clientX, e.clientY), 220) : null, touch };
}, { passive:true });
function startDrag(x, y){
  if (!drag || drag.live) return;
  drag.live = true;
  const r = drag.card.getBoundingClientRect();
  drag.dx = x - r.left; drag.dy = y - r.top;
  drag.layer = document.createElement("div");
  drag.layer.className = "drag-layer";
  drag.layer.innerHTML = drag.card.outerHTML;
  drag.layer.style.width = r.width + "px";
  document.body.appendChild(drag.layer);
  moveLayer(x, y);
  drag.card.classList.add("ghost");
  if (drag.free){
    drag.slot = document.createElement("div");
    drag.slot.className = "slot";
    drag.card.parentNode.insertBefore(drag.slot, drag.card.nextSibling);
  }
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
}
function moveLayer(x, y){ drag.layer.style.left = (x - drag.dx) + "px"; drag.layer.style.top = (y - drag.dy) + "px"; }
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const far = Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0);
  if (!drag.live){
    if (drag.touch){ if (far > 12){ clearTimeout(drag.timer); drag = null; } return; }   // let the board scroll
    if (far > 6) startDrag(e.clientX, e.clientY); else return;
  }
  e.preventDefault();
  moveLayer(e.clientX, e.clientY);
  drag.layer.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  drag.layer.style.display = "";
  // near an edge, walk the board along — on a phone only one column fits
  const wrap = document.querySelector(".boardwrap");
  if (wrap){
    const wr = wrap.getBoundingClientRect(), edge = 74;
    drag.scroll = e.clientX > wr.right - edge ? 16 : e.clientX < wr.left + edge ? -16 : 0;
    if (drag.scroll && !drag.scrollTimer){
      drag.scrollTimer = setInterval(() => { if (drag && drag.scroll) wrap.scrollLeft += drag.scroll; }, 16);
    } else if (!drag.scroll && drag.scrollTimer){ clearInterval(drag.scrollTimer); drag.scrollTimer = null; }
  }
  const listEl = under && under.closest ? under.closest(".list") : null;
  document.querySelectorAll(".list.over").forEach(l => l.classList.remove("over"));
  if (listEl) listEl.classList.add("over");
  drag.target = listEl ? listEl.dataset.list : null;
  if (drag.free && drag.slot && listEl){
    const zone = listEl.querySelector(".cards");
    const after = [...zone.querySelectorAll(".tcard:not(.ghost)")].find(el => {
      const r = el.getBoundingClientRect(); return e.clientY < r.top + r.height / 2;
    });
    zone.insertBefore(drag.slot, after || null);
  }
}, { passive:false });
document.addEventListener("pointerup", () => {
  if (!drag) return;
  clearTimeout(drag.timer); clearInterval(drag.scrollTimer);
  const d = drag; drag = null;
  document.querySelectorAll(".list.over").forEach(l => l.classList.remove("over"));
  if (d.layer) d.layer.remove();
  if (d.card) d.card.classList.remove("ghost");
  if (!d.live){ if (d.slot) d.slot.remove(); return; }
  if (!d.free){
    if (d.slot) d.slot.remove();
    if (d.target && d.target !== d.card.closest(".list").dataset.list)
      toast(d.kind === "deal" ? "This card moves when the file moves — open it and complete the step"
                              : "A house moves when its offer is accepted");
    render();
    return;
  }
  // a card of her own: drop it where the placeholder sits
  const zone = d.slot && d.slot.parentNode;
  const c = S.board.cards.find(x => x.id === d.id);
  if (zone && c){
    const listId = zone.dataset.drop;
    const siblings = [...zone.children].filter(el => el.classList.contains("tcard") || el === d.slot);
    const idx = siblings.indexOf(d.slot);
    const before = siblings.slice(0, idx).filter(el => el.dataset && el.dataset.kind === "manual").pop();
    const after = siblings.slice(idx + 1).find(el => el.dataset && el.dataset.kind === "manual");
    const pb = before ? (S.board.cards.find(x => x.id === before.dataset.id) || {}).pos : null;
    const pa = after ? (S.board.cards.find(x => x.id === after.dataset.id) || {}).pos : null;
    c.list = listId;
    c.pos = pb !== null && pa !== null ? (pb + pa) / 2 : pa !== null ? pa - 1 : pb !== null ? pb + 1 : Date.now();
  }
  if (d.slot) d.slot.remove();
  render();
});
document.addEventListener("pointercancel", () => { if (drag){ clearTimeout(drag.timer); clearInterval(drag.scrollTimer); if (drag.layer) drag.layer.remove();
  if (drag.card) drag.card.classList.remove("ghost"); if (drag.slot) drag.slot.remove(); drag = null; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.card) closeCard(); });

/* ══ Chart tooltip ══════════════════════════════════════════════════ */
let tipEl = null;
function showTip(el){
  hideTip();
  tipEl = document.createElement("div");
  tipEl.className = "tip";
  tipEl.innerHTML = `<b>${esc(el.dataset.tiptitle)}</b>${esc(el.dataset.tip)}`;
  document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  tipEl.style.left = Math.max(8, Math.min(window.innerWidth - t.width - 8, r.left)) + "px";
  tipEl.style.top = (r.top - t.height - 8 < 8 ? r.bottom + 8 : r.top - t.height - 8) + "px";
}
function hideTip(){ if (tipEl){ tipEl.remove(); tipEl = null; } }
document.addEventListener("mouseover", e => { const c = e.target.closest("[data-tip]"); if (c) showTip(c); });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("focusin", e => { const c = e.target.closest("[data-tip]"); if (c) showTip(c); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, { passive:true });

/* ══ Link countdown ═════════════════════════════════════════════════ */
setInterval(() => {
  const d = D(); if (!d) return;
  document.querySelectorAll("[data-cd]").forEach(el => {
    const l = d.links[el.dataset.cd]; if (!l) return;
    const left = Math.floor((l.until - Date.now()) / 1000);
    if (left <= 0){ el.textContent = "Link expired"; el.classList.add("exp"); return; }
    el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  });
}, 1000);

/* ══ Team sync ══════════════════════════════════════════════════════
   Off unless config.js supplies a Firebase project. With no config the
   app behaves exactly as it always has: everything stays on this device.
   With one, the team's boards, houses and transfers follow them between
   phone and laptop, and between Charné and Rassie. ═══════════════════ */
const SYNC_KINDS = { cards:"card", deals:"deal", listings:"listing", boards:"board", people:"person" };
let sync = { on:false, status:"local", db:null, ws:null, uid:null, pending:{}, timer:null, applying:false };

/* Each entity is one document, so two people editing different cards never
   collide. Within one document the newer revision wins. */
function localEntities(){
  const out = {};
  (S.board.cards || []).forEach(c => out["cards/" + c.id] = c);
  Object.entries(S.deals).forEach(([id, d]) => out["deals/" + id] = d);
  Object.entries(S.listings).forEach(([id, l]) => out["listings/" + id] = l);
  (S.boards || []).forEach(b => out["boards/" + b.id] = b);
  Object.entries(S.people || {}).forEach(([id, p]) => out["people/" + id] = p);
  return out;
}
function applyRemote(path, body){
  const [coll, id] = path.split("/");
  if (coll === "cards"){
    const i = S.board.cards.findIndex(c => c.id === id);
    if (i >= 0) S.board.cards[i] = body; else S.board.cards.push(body);
  } else if (coll === "deals") S.deals[id] = body;
  else if (coll === "listings") S.listings[id] = body;
  else if (coll === "boards"){
    const i = S.boards.findIndex(b => b.id === id);
    if (i >= 0) S.boards[i] = body; else S.boards.push(body);
  } else if (coll === "people"){ S.people[id] = body; P[id] = body; }
}
function syncStatus(st){ sync.status = st;
  const el = document.getElementById("syncpill");
  if (el) el.outerHTML = syncPill();
}
function syncPill(){
  const m = { local:["c-mute", "On this device"], connecting:["c-wait", "Connecting…"],
    synced:["c-go", "Synced with the team"], offline:["c-wait", "Offline — will catch up"],
    error:["c-stop", "Sync problem"] }[sync.status] || ["c-mute", ""];
  return `<span class="chip ${m[0]}" id="syncpill" title="${sync.on ? "Team sync is on" : "No project connected — nothing leaves this device"}">${m[1]}</span>`;
}
async function startSync(){
  const cfg = window.RB_CONFIG && window.RB_CONFIG.firebase;
  if (!cfg || !cfg.projectId) return;                 // no project: stay local
  syncStatus("connecting");
  try {
    const V = "https://www.gstatic.com/firebasejs/12.16.0/";
    const [{ initializeApp }, auth, fs] = await Promise.all([
      import(V + "firebase-app.js"), import(V + "firebase-auth.js"), import(V + "firebase-firestore.js")]);
    const app = initializeApp(cfg);
    const A = auth.getAuth(app);
    const user = A.currentUser || await new Promise(res => auth.onAuthStateChanged(A, res));
    if (!user){ syncStatus("local"); sync.needsSignIn = { auth, A }; render(); return; }
    sync.uid = user.uid;
    sync.db = fs.getFirestore(app); sync.fs = fs; sync.on = true;
    sync.ws = (window.RB_CONFIG.workspace || "rb-brand");
    Object.keys(SYNC_KINDS).forEach(coll => {
      fs.onSnapshot(fs.collection(sync.db, "ws", sync.ws, coll), snap => {
        let touched = false;
        snap.docChanges().forEach(ch => {
          if (ch.type === "removed") return;
          const d = ch.doc.data(), path = coll + "/" + ch.doc.id;
          if ((S.rev[path] || 0) >= d.rev) return;      // ours is newer or the same
          S.rev[path] = d.rev; applyRemote(path, d.body); touched = true;
        });
        if (touched){ sync.applying = true; save(); render(); sync.applying = false; }
      }, err => { console.warn("sync read", err); syncStatus("error"); });
    });
    syncStatus("synced");
    pushLocal(true);
  } catch (err){ console.warn("sync unavailable", err); syncStatus("error"); }
}
/* Debounced: a burst of edits becomes one write per changed document. */
function pushLocal(all){
  if (!sync.on || sync.applying) return;
  const ents = localEntities();
  Object.entries(ents).forEach(([path, body]) => {
    const stamp = JSON.stringify(body);
    if (!all && sync.shadow && sync.shadow[path] === stamp) return;
    sync.pending[path] = body;
  });
  sync.shadow = Object.fromEntries(Object.entries(ents).map(([k, v]) => [k, JSON.stringify(v)]));
  clearTimeout(sync.timer);
  sync.timer = setTimeout(flushSync, 700);
}
async function flushSync(){
  if (!sync.on) return;
  const batch = Object.entries(sync.pending); sync.pending = {};
  if (!batch.length) return;
  try {
    const fs = sync.fs;
    await Promise.all(batch.map(([path, body]) => {
      const [coll, id] = path.split("/"), rev = Date.now();
      S.rev[path] = rev;
      return fs.setDoc(fs.doc(sync.db, "ws", sync.ws, coll, id), { rev, body });
    }));
    syncStatus(navigator.onLine ? "synced" : "offline");
  } catch (err){ console.warn("sync write", err); syncStatus(navigator.onLine ? "error" : "offline"); }
}
async function syncSignIn(){
  if (!sync.needsSignIn) return;
  const { auth, A } = sync.needsSignIn;
  try { await auth.signInWithPopup(A, new auth.GoogleAuthProvider()); location.reload(); }
  catch (err){ toast("Sign-in did not complete"); console.warn(err); }
}

render();
startSync();

/* ══ The phone app ══════════════════════════════════════════════════
   Served from a folder, this installs to the home screen and keeps
   working without signal. In the single-file preview these simply do
   nothing, which is why every step is guarded. ═════════════════════ */
(function phoneApp(){
  const head = document.head, rel = (r, href, extra) => {
    const l = document.createElement("link"); l.rel = r; l.href = href;
    Object.assign(l, extra || {}); head.appendChild(l);
  };
  try {
    rel("manifest", "manifest.webmanifest");
    rel("apple-touch-icon", "apple-touch-icon.png");
    rel("icon", "favicon-32.png", { type:"image/png", sizes:"32x32" });
    const m = document.createElement("meta"); m.name = "theme-color";
    m.content = matchMedia("(prefers-color-scheme: dark)").matches ? "#0A1122" : "#0F2040";
    head.appendChild(m);
    const cap = document.createElement("meta"); cap.name = "apple-mobile-web-app-capable"; cap.content = "yes"; head.appendChild(cap);
    const ttl = document.createElement("meta"); ttl.name = "apple-mobile-web-app-title"; ttl.content = "Deal Room"; head.appendChild(ttl);
  } catch {}

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  // a shortcut from the home screen can open straight onto a screen
  try {
    const go = new URLSearchParams(location.search).get("go");
    if (go && ["today", "board", "listings", "portfolio"].includes(go)){ S.view = go; S.deal = null; S.listing = null; render(); }
  } catch {}

  let deferred = null, dismissed = false;
  try { dismissed = localStorage.getItem("rb_install_dismissed") === "1"; } catch {}
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  function banner(html){
    document.querySelectorAll(".install").forEach(e => e.remove());
    const el = document.createElement("div"); el.className = "install"; el.innerHTML = html;
    document.body.appendChild(el);
  }
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if (dismissed || standalone) return;
    banner(`<span class="ic">${ICON.home}</span>
      <span style="flex:1"><b>Put the Deal Room on your phone</b><span>Opens like an app, and works without signal.</span></span>
      <button class="btn btn-s" data-act="install">Add</button>
      <button class="mx" data-act="install-no" aria-label="Not now" style="color:rgba(255,255,255,.6)">×</button>`);
  });
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (iOS && !standalone && !dismissed && location.protocol.startsWith("http")){
    setTimeout(() => banner(`<span class="ic">${ICON.home}</span>
      <span style="flex:1"><b>Put the Deal Room on your phone</b><span>Tap Share, then “Add to Home Screen”.</span></span>
      <button class="mx" data-act="install-no" aria-label="Not now" style="color:rgba(255,255,255,.6)">×</button>`), 2500);
  }
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "install"){
      document.querySelectorAll(".install").forEach(x => x.remove());
      if (deferred){ deferred.prompt(); const r = await deferred.userChoice.catch(() => null);
        deferred = null; if (r && r.outcome === "accepted") toast("Added to your home screen"); }
    }
    if (b.dataset.act === "install-no"){
      document.querySelectorAll(".install").forEach(x => x.remove());
      try { localStorage.setItem("rb_install_dismissed", "1"); } catch {}
    }
  });

  const pill = () => {
    document.querySelectorAll(".offline").forEach(e => e.remove());
    if (navigator.onLine) return;
    const el = document.createElement("div"); el.className = "offline";
    el.textContent = "Offline — your work is saved on this phone";
    document.body.appendChild(el);
  };
  window.addEventListener("online", () => { pill(); toast("Back online"); });
  window.addEventListener("offline", pill);
  pill();
})();
</script>
