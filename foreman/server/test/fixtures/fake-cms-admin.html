<!doctype html>
<html><head><meta charset="utf-8"><title>CMS Admin · Users</title>
<style>body{font:15px system-ui;margin:24px;max-width:520px}label{display:block;margin:12px 0 3px;font-weight:600}input,select{width:100%;padding:8px;font-size:15px}
button{margin-top:16px;padding:9px 14px;font-size:15px}.alert-danger{background:#fde8e8;color:#8b1a1a;padding:10px;margin-top:12px}#toast{background:#e6f4ea;color:#1a6b3a;padding:10px;margin-top:12px}</style></head>
<body>
<h1>Users</h1>
<form id="user-form" onsubmit="return false">
  <label for="fullname">Full name</label><input id="fullname" name="fullname" autocomplete="off">
  <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="off">
  <label for="role">Role</label>
  <select id="role" name="role"><option value="">Choose a role…</option><option>Service advisor</option><option>Workshop manager</option><option>Technician</option><option>Receptionist</option></select>
  <label for="dealer">Dealer</label>
  <select id="dealer" name="dealer"><option value="">Choose a dealer…</option><option>Suzuki Boksburg</option><option>Toyota Kimberley</option><option>Toyota Upington</option></select>
  <label for="branch">Branch code</label><input id="branch" name="branch" value="{{BRANCH}}">
  <label for="created">Created</label><input id="created" name="created" value="{{NOW}}" readonly>
  <button id="save" data-testid="btn-save" type="button">Save user</button>
  <button id="deactivate" data-testid="btn-deactivate" type="button">Deactivate user</button>
</form>
<div id="alert" role="alert" class="alert-danger" style="display:none"></div>
<div id="toast" style="display:none"></div>
<script>
const $ = (id) => document.getElementById(id);
async function send(url) {
  $("alert").style.display = "none"; $("toast").style.display = "none";
  const body = { fullname: $("fullname").value, email: $("email").value, role: $("role").value, dealer: $("dealer").value, branch: $("branch").value };
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { $("alert").textContent = j.error; $("alert").style.display = "block"; }
  else { $("toast").textContent = j.message; $("toast").style.display = "block"; }
}
$("save").onclick = () => send("/api/users");
$("deactivate").onclick = () => send("/api/users/deactivate");
</script></body></html>
