<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Foreman · Support desk</title>
<link rel="icon" href="/assets/foreman-icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0F2040">
<style>
:root{--ink:#0F2040;--gold:#C49A2F;--paper:#F7F5F1;--surface:#fff;--surface2:#FBFAF7;--line:#E5E0D8;--t1:#16203A;--t2:#4E5468;--t3:#7C7A78;--go:#1A6B3A;--go-bg:#E9F3EC;--wait:#8A6100;--wait-bg:#FBF1DC;--stop:#8B1A1A;--stop-bg:#F8EAEA;--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0A1122;--surface:#111B31;--surface2:#16223B;--line:#22304C;--t1:#ECE9E2;--t2:#A9B2C6;--t3:#7C879E;--go:#5FBF87;--go-bg:#12301F;--wait:#D9A93C;--wait-bg:#332715;--stop:#E28080;--stop-bg:#331919}}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--t1);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.bar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;position:sticky;top:0;z-index:5}
.bar b{font-size:15px}.bar a{color:#fff;font-size:12.5px;opacity:.85;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:12px 12px 60px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
label.f{display:block;font-size:11px;color:var(--t2);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:16px}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:480px){.two{grid-template-columns:1fr}}
.btn{padding:9px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2);font-weight:600;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.go{background:var(--go);color:#fff;border-color:var(--go)}
.btn.small{padding:6px 10px;min-height:34px;font-size:12px}.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:130px}
.pill{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;background:var(--wait-bg);color:var(--wait);white-space:nowrap}
.pill.go{background:var(--go-bg);color:var(--go)}.pill.stop{background:var(--stop-bg);color:var(--stop)}.pill.plain{background:var(--surface2);color:var(--t2);border:1px solid var(--line)}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.job>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.job>summary::-webkit-details-marker{display:none}
.job .ttl{flex:1 1 220px;font-weight:600;min-width:0;overflow-wrap:anywhere}.job .sub{font-size:12px;color:var(--t3);font-weight:400}
.job .body{padding:0 12px 12px;border-top:1px solid var(--line)}
.kv{font-size:13px;margin:8px 0;color:var(--t2)}.kv b{color:var(--t1)}
ul.l{margin:4px 0 0;padding-left:18px;font-size:13px}
.warn{background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.err{background:var(--stop-bg);color:var(--stop);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.ok{background:var(--go-bg);color:var(--go);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px;font:12px/1.45 ui-monospace,Consolas,monospace;margin:6px 0;max-height:240px;overflow:auto}
.reply{min-height:170px}.muted{color:var(--t3);font-size:12px}
.tabs{display:flex;gap:6px;margin:14px 0 8px}.tabs button{flex:0 0 auto}
</style></head><body>
<div class="bar"><img src="/assets/foreman-mark.svg" alt="Foreman" style="height:24px"><b>Support desk</b><a href="/shell.html" style="margin-left:auto">Command</a><a href="/board.html" style="margin-left:14px">Board</a><a href="/" style="margin-left:14px">← Foreman</a></div>
<main>
  <div id="cfg"></div>

  <div class="box">
    <label class="f" for="email" style="margin-top:0">Paste the client's e-mail</label>
    <textarea id="email" placeholder="Copy the e-mail from the shared inbox and paste it here, including who it is from."></textarea>
    <div class="two">
      <div><label class="f" for="dealer">Dealer (optional)</label><input id="dealer" placeholder="e.g. Toyota Kimberley" autocomplete="off"></div>
      <div><label class="f" for="group">Group (optional)</label><input id="group" placeholder="e.g. Morgan" autocomplete="off"></div>
    </div>
    <div class="row"><button class="btn primary" id="sort">Sort it</button></div>
    <div class="muted" style="margin-top:8px">Nothing is created in Jira until you press Approve on the job below.</div>
    <div id="intakeMsg"></div>
  </div>

  <div class="box">
    <label class="f" for="tkey" style="margin-top:0">Or load a ticket that's already in Jira</label>
    <div style="display:flex;gap:8px"><input id="tkey" placeholder="CS-259412, or paste the ticket link" autocomplete="off"><button class="btn" id="load" style="flex:0 0 auto">Load</button></div>
    <div class="muted" style="margin-top:8px">For e-mails the desk has already turned into tickets. Loading only reads the ticket; nothing changes in Jira.</div>
    <div id="loadMsg"></div>
  </div>

  <div class="tabs"><button class="btn small primary" id="tabActive">Active</button><button class="btn small" id="tabArchive">Archived</button></div>
  <div id="jobs"></div>
</main>
<script>
const tokenKey = "foreman_token";
const getToken = () => { try { return localStorage.getItem(tokenKey) || ""; } catch { return ""; } };
const raw = window.fetch.bind(window);
window.fetch = async (u, o = {}) => { const h = new Headers(o.headers || {}); if (String(u).startsWith("/api") && getToken()) h.set("Authorization", "Bearer " + getToken()); let r = await raw(u, { ...o, headers: h }); if (r.status === 401 && String(u).startsWith("/api")) { const t = prompt("Access token (CMS_AGENT_TOKEN):", getToken()); if (t) { try { localStorage.setItem(tokenKey, t.trim()); } catch {} h.set("Authorization", "Bearer " + t.trim()); r = await raw(u, { ...o, headers: h }); } } return r; };
const api = async (p, o) => { const r = await fetch("/api" + p, { headers: { "Content-Type": "application/json" }, ...o }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), j); return j; };
const post = (p, body) => api(p, { method: "POST", body: JSON.stringify(body || {}) });

// Element.append(null) writes the text "null", so every append goes through here.
const put = (el, ...kids) => { el.append(...kids.flat().filter((k) => k != null && k !== false)); return el; };

// E-mails are untrusted text. Everything dynamic goes in through textContent, never innerHTML.
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const when = (iso) => new Date(iso).toLocaleString("en-ZA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

let cfg = null, showArchived = false;
const openJobs = new Set(); // keep a job open across refreshes
try { const j = new URLSearchParams(location.search).get("job"); if (j) openJobs.add(j); } catch {}

async function loadCfg() {
  cfg = await api("/support/config");
  const el = document.getElementById("cfg"); el.replaceChildren();
  if (!cfg.jira) el.append(h("div", { class: "warn" }, "Jira is not set up yet, so tickets can't be created or closed. Add JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN and JIRA_PROJECT_KEY to server/.env and restart. You can still sort e-mails and draft replies."));
}

function catSelect(job, locked) {
  const s = h("select", { id: "cat-" + job.id, disabled: locked }, Object.entries(cfg.categories).map(([k, v]) => h("option", { value: k, selected: k === job.classification.category }, v)));
  return s;
}

function statusPill(job) {
  if (job.archived) return h("span", { class: "pill plain" }, "archived");
  return job.status === "proposed" ? h("span", { class: "pill" }, "needs your approval") : job.status === "open" ? h("span", { class: "pill plain" }, "in progress") : h("span", { class: "pill go" }, "done");
}

// What the desk requires before a ticket can be closed, read live from Jira.
function fieldsPanel(job) {
  const el = h("div", { class: "box", style: "margin:10px 0 0;background:var(--surface2)" });
  const out = h("div"), msg = h("div");
  el.append(h("div", { class: "kv", style: "margin-top:0" }, h("b", {}, "Required before closing")), out, msg);
  const api_ = { el, loaded: false };
  const inputs = {};
  const mark = (ok) => h("span", { class: "pill " + (ok ? "go" : "stop") }, ok ? "✓" : "empty");
  function line(label, ok, text, extra) { return h("div", { class: "kv", style: "display:flex;gap:8px;align-items:baseline;flex-wrap:wrap" }, mark(ok), h("b", {}, label), h("span", {}, text), extra); }
  function draw(st) {
    out.replaceChildren(); for (const k of Object.keys(inputs)) delete inputs[k];
    out.append(line("Assignee", st.assignee.ok, st.assignee.ok ? st.assignee.name : (st.assignee.name || "Unassigned") + " — will assign to you"));
    st.plan.forEach((p, i) => {
      if (p.filled) return out.append(line(p.name, true, p.current));
      if (p.kind !== "supported") return out.append(line(p.name, false, p.note || "cannot be set from here"));
      const listId = `dl-${job.id}-${i}`;
      const inp = h("input", { value: p.proposal ? p.proposal.label : "", placeholder: p.options.length ? "Start typing to choose…" : "Type the value", list: p.options.length ? listId : null, autocomplete: "off", style: "margin-top:4px" });
      inputs[p.name] = inp;
      put(out, line(p.name, false, p.proposal ? "will set to:" : "needs your choice:"), inp, p.options.length ? h("datalist", { id: listId }, p.options.map((o) => h("option", { value: o }))) : null);
    });
    const need = Object.keys(inputs).length > 0 || !st.assignee.ok;
    if (st.complete) out.append(h("div", { class: "ok" }, "All required fields are filled. This ticket is ready to close."));
    else if (need) {
      const go = h("button", { class: "btn small primary", style: "margin-top:8px" }, "Fill these in Jira");
      go.onclick = async () => { go.disabled = true; msg.replaceChildren();
        try { const choices = {}; for (const [k, v] of Object.entries(inputs)) if (v.value.trim()) choices[k] = v.value.trim();
          const r = await post("/support/jobs/" + job.id + "/fields", { choices });
          msg.replaceChildren(h("div", { class: "ok" }, r.written.length ? "Written to Jira: " + r.written.join("; ") : "Nothing needed changing.")); draw(r.status);
        } catch (e) { msg.replaceChildren(h("div", { class: "err" }, e.message)); } finally { go.disabled = false; } };
      out.append(go);
    }
  }
  api_.load = async () => {
    api_.loaded = true; out.replaceChildren(h("div", { class: "muted" }, "Checking Jira…"));
    try { const st = await api("/support/jobs/" + job.id + "/fields"); if (st.configured === false) out.replaceChildren(h("div", { class: "warn" }, "Jira isn't set up.")); else draw(st); }
    catch (e) { out.replaceChildren(h("div", { class: "err" }, e.message)); }
  };
  const re = h("button", { class: "btn small", style: "margin-top:6px" }, "Re-check"); re.onclick = () => api_.load(); el.append(re);
  return api_;
}

function renderJob(job) {
  const c = job.classification, imported = job.source === "ticket" && job.status === "open", locked = !(job.status === "proposed" || imported);
  const body = h("div", { class: "body" });
  const msg = h("div");
  const say = (kind, text) => msg.replaceChildren(text ? h("div", { class: kind }, text) : "");
  const busy = async (btn, fn) => { btn.disabled = true; say("", ""); try { await fn(); } catch (e) { say("err", e.message); } finally { btn.disabled = false; } };

  if (c.source === "keywords") body.append(h("div", { class: "warn" }, "Claude wasn't used for this sort (no credentials, or it was unreachable), so it's a keyword guess. Check the type and dealers before approving."));
  for (const w of job.warnings) body.append(h("div", { class: "warn" }, w));

  // 1. What Foreman understood
  body.append(h("label", { class: "f" }, "What kind of job"), catSelect(job, locked));
  body.append(h("label", { class: "f" }, "Ticket title"), h("input", { id: "sum-" + job.id, value: c.summary, disabled: locked }));
  body.append(h("div", { class: "two" },
    h("div", {}, h("label", { class: "f" }, c.dealers.length > 1 ? "Dealers (one per line) — multi-dealer job" : "Dealer(s), one per line"), h("textarea", { id: "dl-" + job.id, style: "min-height:60px", disabled: locked }, c.dealers.join("\n"))),
    h("div", {}, h("label", { class: "f" }, "Group"), h("input", { id: "gr-" + job.id, value: c.group || "", disabled: locked }), h("label", { class: "f" }, "From"), h("input", { id: "rq-" + job.id, value: c.requester || "", disabled: locked }))));
  if (c.asks.length) body.append(h("div", { class: "kv" }, h("b", {}, "Asked for"), h("ul", { class: "l" }, c.asks.map((a) => h("li", {}, a)))));
  if (c.missing.length) body.append(h("div", { class: "warn" }, h("b", {}, "Still missing from the client — "), c.missing.join("; ")));
  if (c.risk === "changes_data") body.append(h("div", { class: "kv" }, h("span", { class: "pill stop" }, "changes data"), " ", "This kind of job edits real records, so it only ever runs after you approve it."));

  // 2. Approval
  if (job.status === "proposed") {
    const preview = h("div");
    const save = h("button", { class: "btn small" }, "Save changes");
    const pv = h("button", { class: "btn small" }, "Preview the ticket");
    const approve = h("button", { class: "btn go" }, "Approve & create Jira ticket");
    const patch = () => ({ category: document.getElementById("cat-" + job.id).value, summary: document.getElementById("sum-" + job.id).value, dealers: document.getElementById("dl-" + job.id).value.split("\n"), group: document.getElementById("gr-" + job.id).value, requester: document.getElementById("rq-" + job.id).value });
    save.onclick = () => busy(save, async () => { await api("/support/jobs/" + job.id, { method: "PATCH", body: JSON.stringify(patch()) }); openJobs.add(job.id); await refresh(); });
    pv.onclick = () => busy(pv, async () => {
      await api("/support/jobs/" + job.id, { method: "PATCH", body: JSON.stringify(patch()) });
      const p = await api("/support/jobs/" + job.id + "/ticket-preview");
      preview.replaceChildren(...[
        p.error ? h("div", { class: "err" }, p.error) : null,
        h("div", { class: "kv" }, h("b", {}, p.draft.summary)),
        h("pre", {}, p.draft.description),
        p.fields ? h("div", { class: "muted" }, "Tags: " + (JSON.stringify({ components: p.fields.components, labels: p.fields.labels }).replace(/"/g, "") || "none") + " · assigned to you on creation") : h("div", { class: "muted" }, "Jira isn't set up, so this is only a preview.")
      ].filter(Boolean));
    });
    approve.onclick = () => busy(approve, async () => {
      if (!confirm("Create this ticket in Jira and assign it to you?")) return;
      await api("/support/jobs/" + job.id, { method: "PATCH", body: JSON.stringify(patch()) });
      await post("/support/jobs/" + job.id + "/ticket"); openJobs.add(job.id); await refresh();
    });
    body.append(h("div", { class: "row" }, save, pv, approve), preview);
  }

  if (imported) {
    const save = h("button", { class: "btn small" }, "Save changes");
    save.onclick = () => busy(save, async () => { await api("/support/jobs/" + job.id, { method: "PATCH", body: JSON.stringify({ category: document.getElementById("cat-" + job.id).value, summary: document.getElementById("sum-" + job.id).value, dealers: document.getElementById("dl-" + job.id).value.split("\n"), group: document.getElementById("gr-" + job.id).value, requester: document.getElementById("rq-" + job.id).value }) }); openJobs.add(job.id); await refresh(); });
    body.append(h("div", { class: "row" }, save), h("div", { class: "muted" }, "These only steer what Foreman suggests below; the ticket in Jira isn't changed by them."));
  }

  // 3. Ticket
  let fp = null;
  if (job.ticket) body.append(h("div", { class: "ok" }, "Ticket ", h("a", { href: job.ticket.url, target: "_blank", rel: "noopener", style: "color:inherit;font-weight:700" }, job.ticket.key), job.ticket.assigned ? " — assigned to you" : " — NOT assigned, please assign it in Jira"));

  if (job.ticket && job.status === "open" && cfg.jira) { fp = fieldsPanel(job); body.append(fp.el); }

  // 4. Reply
  const reply = h("textarea", { class: "reply", id: "rp-" + job.id }, job.reply ? job.reply.text : "");
  const copy = h("button", { class: "btn small" }, "Copy reply");
  copy.onclick = async () => { try { await navigator.clipboard.writeText(reply.value); } catch { reply.select(); document.execCommand("copy"); } copy.textContent = "Copied ✓"; setTimeout(() => (copy.textContent = "Copy reply"), 1500); };
  const instr = h("input", { id: "in-" + job.id, placeholder: "Tell it how to change the draft, e.g. “shorter, ask for his ID number”" });
  const redo = h("button", { class: "btn small" }, "Redraft");
  redo.onclick = () => busy(redo, async () => { await post("/support/jobs/" + job.id + "/reply", { instruction: instr.value }); openJobs.add(job.id); await refresh(); });
  body.append(h("label", { class: "f" }, "Reply to the client" + (job.reply ? ` (${job.reply.source === "claude" ? "drafted by Claude" : "template — Claude wasn't used"})` : "")), reply,
    h("div", { class: "muted" }, "A draft only. Foreman never sends e-mail; copy it into the shared inbox. Check anything in [square brackets] first."),
    h("div", { class: "row" }, copy), instr, h("div", { class: "row" }, redo));

  // 5. Finish
  if (job.status !== "done") {
    const note = h("input", { id: "nt-" + job.id, placeholder: job.ticket ? "Optional comment to add to the Jira ticket" : "" });
    const done = h("button", { class: "btn primary" }, job.ticket ? "Work is done — close the ticket" : "Mark done");
    done.onclick = () => busy(done, async () => { if (!confirm(job.ticket ? `Close ${job.ticket.key} in Jira and mark this done?` : "Mark this done?")) return; await post("/support/jobs/" + job.id + "/complete", { note: note.value }); openJobs.add(job.id); await refresh(); });
    if (job.status === "open" || !cfg.jira) put(body, h("label", { class: "f" }, "When the work is finished"), job.ticket ? note : null, h("div", { class: "row" }, done));
  } else {
    const arch = h("button", { class: "btn" }, job.archived ? "Move back to Active" : "Archive");
    arch.onclick = () => busy(arch, async () => { await post("/support/jobs/" + job.id + "/archive", { archived: !job.archived }); await refresh(); });
    body.append(h("div", { class: "row" }, arch));
  }
  body.append(msg);

  const det = h("details", { class: "job", open: openJobs.has(job.id) },
    h("summary", {}, h("div", { class: "ttl" }, c.summary, h("div", { class: "sub" }, `${c.category.replace(/_/g, " ")} · ${c.dealers.join(", ") || "no dealer yet"} · ${when(job.createdAt)}`)), statusPill(job)),
    body);
  det.addEventListener("toggle", () => { if (det.open) { openJobs.add(job.id); if (fp && !fp.loaded) fp.load(); } else openJobs.delete(job.id); });
  if (fp && openJobs.has(job.id)) fp.load();
  return det;
}

async function refresh() {
  const el = document.getElementById("jobs");
  const jobs = await api("/support/jobs" + (showArchived ? "?archived=1" : ""));
  el.replaceChildren(...(jobs.length ? jobs.map(renderJob) : [h("div", { class: "muted", style: "padding:14px" }, showArchived ? "Nothing archived yet." : "No active jobs. Paste an e-mail above to start.")]));
}

document.getElementById("sort").onclick = async (ev) => {
  const btn = ev.target, text = document.getElementById("email").value;
  const m = document.getElementById("intakeMsg"); m.replaceChildren();
  if (!text.trim()) return m.append(h("div", { class: "err" }, "Paste the e-mail first."));
  btn.disabled = true; btn.textContent = "Reading…";
  try {
    const job = await post("/support/intake", { email: text, dealer: document.getElementById("dealer").value, group: document.getElementById("group").value });
    openJobs.add(job.id); document.getElementById("email").value = ""; showArchived = false; setTabs(); await refresh();
  } catch (e) { m.append(h("div", { class: "err" }, e.message)); }
  finally { btn.disabled = false; btn.textContent = "Sort it"; }
};
document.getElementById("load").onclick = async (ev) => {
  const btn = ev.target, key = document.getElementById("tkey").value;
  const m = document.getElementById("loadMsg"); m.replaceChildren();
  if (!key.trim()) return m.append(h("div", { class: "err" }, "Enter a ticket key like CS-259412."));
  btn.disabled = true; btn.textContent = "Loading…";
  try { const job = await post("/support/import", { key }); openJobs.add(job.id); document.getElementById("tkey").value = ""; showArchived = false; setTabs(); await refresh(); }
  catch (e) { m.append(h("div", { class: "err" }, e.message)); }
  finally { btn.disabled = false; btn.textContent = "Load"; }
};
function setTabs() { document.getElementById("tabActive").classList.toggle("primary", !showArchived); document.getElementById("tabArchive").classList.toggle("primary", showArchived); }
document.getElementById("tabActive").onclick = () => { showArchived = false; setTabs(); refresh(); };
document.getElementById("tabArchive").onclick = () => { showArchived = true; setTabs(); refresh(); };
(async () => { try { await loadCfg(); await refresh(); } catch (e) { document.getElementById("jobs").append(h("div", { class: "err" }, e.message)); } })();
</script></body></html>
