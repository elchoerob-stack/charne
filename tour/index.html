<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#31459C">
<title>Springboks Tour Predictor</title>
<meta name="description" content="Pick the scores for every Springbok Test. Closest wins. 30 seconds, no sign-up.">
<!-- Link preview card — WhatsApp, Teams and Slack all scrape these, and they
     need absolute URLs, so the live Pages address is spelled out in full. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CMS Systems">
<meta property="og:title" content="Springboks Tour Predictor">
<meta property="og:description" content="🇿🇦 Pick the scores for every Springbok Test. Closest wins. 30 seconds, no sign-up.">
<meta property="og:url" content="https://elchoerob-stack.github.io/charne/tour/">
<meta property="og:image" content="https://elchoerob-stack.github.io/charne/tour/assets/share-card.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Springboks Tour Predictor">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/ball-icon-192.png">
<link rel="apple-touch-icon" href="assets/ball-icon-192.png">
<style>
  /* CMS Systems CI — Blue #31459C primary, Turquoise #00AEED accent,
     Red #FD4545 used sparingly, brand black #2E2E2E, built on white. */
  @font-face{font-family:Roboto;src:url("assets/Roboto-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:Roboto;src:url("assets/Roboto-Medium.ttf") format("truetype");font-weight:500;font-display:swap}
  @font-face{font-family:Roboto;src:url("assets/Roboto-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
  :root{
    --blue:#31459C; --blue-light:#98A2CD;
    --turq:#00AEED; --turq-light:#7FD6F6;
    --red:#FD4545;
    --ink:#2E2E2E; --grey:#585858; --line:#D8D8D8; --cool:#B2B2B2;
    --paper:#FFFFFF; --wash:#FFFFFF; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--wash); color:var(--ink);
    font-family:Roboto,Arial,Helvetica,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  header{
    background:var(--paper); color:var(--ink); padding:14px 16px 18px;
    border-bottom:1px solid var(--line); position:relative; overflow:hidden;
  }
  header::after{                      /* sport stripe — CI colours only */
    content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,var(--blue) 0 45%,var(--turq) 45% 82%,var(--red) 82% 100%);
  }
  .brand{display:flex;justify-content:center;margin-bottom:12px}
  .brand img{height:34px;width:auto;display:block}
  .wrap{max-width:560px;margin:0 auto}
  h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.6px;color:var(--blue);
     text-transform:uppercase;line-height:1.1}
  h1 .kick{color:var(--turq)}
  .sub{margin:7px 0 0;font-size:13px;color:var(--grey);line-height:1.5}
  nav{display:flex;gap:8px;padding:12px 16px 0;max-width:560px;margin:0 auto}
  nav{gap:6px}
  nav button{
    flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--grey);
    border-radius:999px;padding:11px 2px;font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:inherit;text-transform:uppercase;letter-spacing:.01em;transition:transform .12s;
  }
  nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  nav button:active{transform:scale(.96)}
  nav .n{display:inline-block;min-width:18px;margin-left:4px;background:var(--line);color:var(--blue);
    border-radius:999px;padding:0 5px;font-size:11.5px;font-weight:700}
  nav button.on .n{background:var(--turq);color:#fff}
  main{padding:14px 16px 96px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;
    margin-bottom:12px;box-shadow:0 1px 2px rgba(46,46,46,.05)}
  .hint{font-size:12.5px;color:var(--grey);line-height:1.55;margin:8px 0 0}
  .btn{
    display:block;width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;
    font-weight:700;font-size:16px;padding:14px;cursor:pointer;font-family:inherit;margin-top:12px;
    text-transform:uppercase;letter-spacing:.03em;transition:transform .12s,background .12s;
  }
  .btn:active{transform:scale(.98);opacity:.9}
  .btn.quiet{background:#fff;border:1.5px solid var(--turq);color:var(--turq);font-size:14px;padding:11px}
  .btn.quiet:active{background:var(--turq);color:#fff}
  .btn:disabled{opacity:.45}
  input{font-family:inherit;font-size:16px}
  .name-row{display:flex;gap:8px;flex-wrap:wrap}
  .name-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px}
  .name-row .btn{width:auto;margin:0;padding:12px 18px;font-size:14px}
  .name-row .btn.ghost{background:none;border:1px solid var(--line);color:var(--grey)}
  /* Editing shows Save and Cancel, which won't sit beside the field on a
     narrow phone — give the input its own line and let the pair share the next. */
  .name-row.two input{flex:1 1 100%}
  .name-row.two .btn{flex:1}
  .nm-pick{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;
    padding:12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px}
  .linkish{display:block;background:none;border:0;padding:0;margin-top:10px;color:var(--turq);
    font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .keeps{
    margin-top:10px;background:var(--paper);border:1px solid var(--line);
    border-left:4px solid var(--turq);border-radius:10px;
    padding:9px 11px;font-size:12.5px;color:var(--grey);line-height:1.45;
  }
  .keeps b{color:var(--blue)}
  .who{
    display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
    border-left:4px solid var(--turq);
    border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--blue);
  }
  .who button{margin-left:auto;background:none;border:0;color:var(--turq);text-decoration:underline;
    font:inherit;font-size:13px;cursor:pointer}
  .m-head{font-weight:700;font-size:15.5px;color:var(--blue);line-height:1.35}
  .m-when{display:block;font-weight:400;font-size:12.5px;color:var(--grey);margin-top:4px}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:999px;
    padding:2px 8px;vertical-align:middle;margin-right:6px}
  .tag.test{background:var(--blue);color:#fff}
  .tag.tour{background:var(--turq);color:#fff}
  .score-grid{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:end;margin-top:12px}
  .score-grid .side{min-width:0}
  .score-grid label{display:block;font-size:12px;color:var(--grey);text-align:center;
    margin-bottom:6px;line-height:1.3;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
  .score-grid input{width:100%;text-align:center;border:2px solid var(--line);border-radius:12px;
    padding:13px 4px;font-weight:700;font-size:22px;color:var(--blue);background:var(--paper)}
  .score-grid input:focus{outline:none;border-color:var(--turq);background:#fff}
  .score-grid .dash{text-align:center;padding-bottom:15px;color:var(--cool);font-weight:700}
  .picks{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .picks-h{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--turq);margin-bottom:7px}
  .pick{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:14px}
  .pick .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .ps{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
  .locked-picks{font-size:13px;color:var(--grey);text-align:center;line-height:1.5}
  .locked-picks b{color:var(--blue)}
  .avg{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);text-align:center}
  .avg-h{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--turq)}
  .avg-s{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;
    margin-top:5px;font-size:13px;color:var(--grey)}
  .avg-s b{font-size:22px;color:var(--blue);font-variant-numeric:tabular-nums}
  .avg-c{margin-top:4px;font-size:12.5px;color:var(--grey)}
  .avg-c b{color:var(--blue)}
  .locked{font-size:12.5px;color:var(--blue);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:10px}
  .done{font-size:12.5px;color:var(--turq);font-weight:700;margin-top:10px}
  .rows{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 2px rgba(46,46,46,.05)}
  .r{display:grid;grid-template-columns:30px 1fr 56px 60px;gap:8px;align-items:center;
     padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
  .r:first-child{border-top:0}
  .r.top{box-shadow:inset 4px 0 0 var(--turq)}
  .r .pos{font-weight:700;color:var(--cool)}
  .r.top .pos{color:var(--turq)}
  .r .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis}
  .r.top .nm{font-weight:700}
  .r .pl,.r .pts{text-align:right;font-variant-numeric:tabular-nums}
  .r .pl{color:var(--grey)}
  .r .pts{font-weight:700;color:var(--blue)}
  .thead{display:grid;grid-template-columns:30px 1fr 56px 60px;gap:8px;padding:4px 14px 8px;
    font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--grey)}
  .thead .pl,.thead .pts{text-align:right}
  .res{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:18px;color:var(--blue)}
  .pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--turq);color:#fff}
  .pill.miss{background:var(--line);color:var(--grey)}
  .empty{padding:22px 16px;text-align:center;color:var(--grey);font-size:14px;line-height:1.55}
  .peek{text-align:center;padding:16px;color:var(--grey);font-size:13.5px;line-height:1.6}
  .peek b{color:var(--blue)}
  .legend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
  .legend .p{font-weight:700;color:var(--blue);text-align:right}
  .share{
    position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 70%,rgba(255,255,255,0));
  }
  .share .btn{max-width:528px;margin:0 auto;background:var(--turq);color:#fff}
  .share .btn:active{opacity:.9}
  #toast{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 16px;border-radius:999px;font-size:13.5px;max-width:88%;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
  }
  #toast.show{opacity:1}
  .install{
    background:var(--blue);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
  }
  .install h3{margin:0;font-size:15.5px}
  .install p{margin:6px 0 0;font-size:13px;line-height:1.55;color:rgba(255,255,255,.86)}
  .install .row{display:flex;gap:8px;margin-top:12px}
  .install .row .btn{margin:0;flex:1;padding:11px;font-size:14.5px;background:var(--turq);color:#fff}
  .install .row .later{
    flex:0 0 auto;background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;
    border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .install code{background:rgba(255,255,255,.16);border-radius:4px;padding:1px 5px}
  .today-hero{
    background:var(--blue);color:#fff;border-radius:16px;padding:18px 16px;margin-bottom:12px;
    position:relative;overflow:hidden;
  }
  .today-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--turq) 0 70%,var(--red) 70% 100%)}
  .today-hero .when{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--turq-light)}
  .today-hero .teams{font-size:22px;font-weight:700;line-height:1.2;margin-top:7px}
  .today-hero .at{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:7px}
  .today-hero .cd{
    display:inline-block;margin-top:12px;background:rgba(255,255,255,.15);border-radius:999px;
    padding:6px 13px;font-size:13.5px;font-weight:700;
  }
  .today-none{padding:26px 18px;text-align:center;color:var(--grey);line-height:1.6}
  .today-none b{color:var(--blue)}
  .warn{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--red);
    border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.55;margin-bottom:12px;color:var(--ink)}

  /* ---------- wi, the assistant ----------
     The wi artwork is placed exactly as supplied. Everything drawn around it
     uses the CMS palette only — the wi gradient stays inside the artwork. */
  .wi-say{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
  .wi-av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--paper);
    border:1.5px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(49,69,156,.12)}
  .wi-av img{width:28px;height:auto;display:block}
  .wi-bub{position:relative;flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);
    border-radius:4px 16px 16px 16px;padding:11px 13px;font-size:14px;line-height:1.5;color:var(--ink);
    box-shadow:0 1px 2px rgba(46,46,46,.05)}
  .wi-bub .wi-n{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--turq);margin-bottom:3px}
  .wi-bub b{color:var(--blue)}
  .wi-bub .caret{display:inline-block;width:2px;height:1em;background:var(--turq);vertical-align:-2px;
    margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .wi-act{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:var(--blue);color:#fff;
    border:0;border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .wi-act:active{transform:scale(.97)}
  .wi-guide-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;
    background:var(--paper);border:1.5px dashed var(--turq);color:var(--blue);border-radius:12px;padding:10px;
    font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .wi-guide-btn img{width:18px;height:auto}
  .wi-guide-btn .call{color:var(--turq)}
  .today-hero .wi-guide-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);color:#fff}
  .today-hero .wi-guide-btn .call{color:var(--turq-light)}
  /* wi sits in the bottom bar beside Share, so it never covers a score box. */
  .share-in{display:flex;gap:12px;align-items:center;max-width:528px;margin:0 auto}
  .share-in .btn{flex:1;margin:0}
  .wi-fab{position:relative;flex:0 0 auto;width:52px;height:52px;
    border-radius:50%;background:var(--paper);border:1.5px solid var(--line);cursor:pointer;display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(49,69,156,.22)}
  .wi-fab img{width:30px;height:auto}
  .wi-fab::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--turq);
    animation:wiPulse 2.6s ease-out infinite}
  @keyframes wiPulse{0%{transform:scale(.9);opacity:.9}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
  .sheet-bg{position:fixed;inset:0;background:rgba(46,46,46,.45);z-index:60;opacity:0;pointer-events:none;
    transition:opacity .22s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;
    background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(105%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);padding:0 18px calc(22px + env(safe-area-inset-bottom));
    max-width:600px;margin:0 auto;box-shadow:0 -10px 30px rgba(46,46,46,.18)}
  .sheet.open{transform:none}
  .sheet .grab{position:sticky;top:0;background:var(--paper);padding:10px 0 6px;z-index:2;display:flex;
    align-items:center;justify-content:center}
  .sheet .grab i{display:block;width:42px;height:5px;border-radius:9px;background:var(--line)}
  .sheet .x{position:absolute;right:0;top:6px;background:none;border:0;font-size:22px;color:var(--grey);
    cursor:pointer;padding:4px 8px;font-family:inherit}
  .g-top{background:var(--blue);color:#fff;border-radius:16px;padding:16px;position:relative;overflow:hidden}
  .g-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--turq) 0 70%,var(--red) 70% 100%)}
  .g-top .k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--turq-light)}
  .g-top .t{font-size:20px;font-weight:700;margin-top:5px;line-height:1.25}
  .g-top .w{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:6px}
  .g-sec{margin-top:16px}
  .g-h{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--turq);margin-bottom:7px}
  .g-story{font-size:14.5px;line-height:1.6;color:var(--ink)}
  .g-story b{color:var(--blue)}
  .call-card{border:1.5px solid var(--turq);border-radius:16px;padding:14px;text-align:center;background:var(--paper)}
  .call-card .cw{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--turq)}
  .call-card .cw img{width:20px;height:auto}
  .call-sc{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
  .call-sc .tm{flex:1;font-size:12.5px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}
  .call-sc .n{font-size:40px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;min-width:56px}
  .call-sc .d{color:var(--cool);font-weight:700;font-size:26px}
  .call-why{font-size:13px;color:var(--grey);margin-top:6px;line-height:1.5}
  .conf{margin-top:12px;text-align:left}
  .conf .l{display:flex;justify-content:space-between;font-size:12px;color:var(--grey);margin-bottom:5px}
  .conf .l b{color:var(--blue)}
  .conf .bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
  .conf .bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--turq);transition:width 1s .25s ease}
  .form{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{display:flex;flex-direction:column;align-items:center;min-width:52px;border-radius:10px;padding:6px 7px;
    border:1px solid var(--line);font-size:11px;color:var(--grey);line-height:1.3}
  .fchip b{font-size:13px;color:#fff;border-radius:6px;width:22px;height:22px;display:grid;place-items:center;margin-bottom:3px}
  .fchip.W b{background:var(--turq)} .fchip.L b{background:var(--red)} .fchip.D b{background:var(--grey)}
  .h2h{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:center}
  .h2h div{padding:10px 4px;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
  .h2h div+div{border-left:1px solid var(--line)}
  .h2h b{display:block;font-size:22px;color:var(--blue);letter-spacing:0}
  .g-list{margin:0;padding:0;list-style:none}
  .g-list li{position:relative;padding:7px 0 7px 22px;font-size:14px;line-height:1.5;border-top:1px solid var(--line)}
  .g-list li:first-child{border-top:0}
  .g-list li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--turq)}
  .tip{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;
    padding:11px 13px;font-size:13.5px;line-height:1.55}
  .tip b{color:var(--blue)}
  .g-note{font-size:11.5px;color:var(--grey);margin-top:16px;line-height:1.5;text-align:center}
  .faq{border-top:1px solid var(--line)}
  .faq button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;
    padding:13px 2px;font:inherit;font-size:14.5px;font-weight:700;color:var(--blue);cursor:pointer;text-align:left}
  .faq button::after{content:"+";color:var(--turq);font-size:20px;font-weight:400}
  .faq.open button::after{content:"–"}

</style>

<body>

<header>
  <div class="wrap">
    <div class="brand"><img src="assets/cms-eco-logo-full-colour.png" alt="CMS eco"></div>
    <h1>Springboks Tour <span class="kick">Predictor</span></h1>
    <p class="sub" id="sub">Pick the scores. Closest wins. Everyone’s picks appear once you’ve made yours.</p>
  </div>
</header>

<nav>
  <button id="tab-today" class="on" data-tab="today">Next</button>
  <button id="tab-predict" data-tab="predict">Predict<span class="n" id="n-predict">0</span></button>
  <button id="tab-log" data-tab="log">Log</button>
  <button id="tab-results" data-tab="results">Results<span class="n" id="n-results">0</span></button>
</nav>

<main>
  <div id="warn"></div>
  <div id="install"></div>
  <div id="wi-say"></div>
  <section id="view-today"></section>
  <section id="view-predict"></section>
  <section id="view-log" hidden></section>
  <section id="view-results" hidden></section>
</main>

<div class="share"><div class="share-in"><button class="btn" id="btn-share">Share with the team</button><button class="wi-fab" id="wi-fab" aria-label="Ask wi, your guide"><img src="assets/wi-mark.png" alt=""></button></div></div>
<div id="toast"></div>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"><i></i><button class="x" id="sheet-x" aria-label="Close">×</button></div><div id="sheet-body"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, updateDoc, deleteField
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

/* This app's own Firebase project — nothing is shared with any other
   predictor. Its rules allow reading games, adding picks (p) and results (f),
   and nothing else: fixtures can't be edited or deleted from the page.
   Games still carry app:"cms"; the filter below keeps working unchanged. */
var app = initializeApp({
  apiKey: "AIzaSyD-srs0i3Ib4g00LG2CSjoSki0etMA77TU",
  authDomain: "springboks-predictor.firebaseapp.com",
  projectId: "springboks-predictor",
  storageBucket: "springboks-predictor.firebasestorage.app",
  messagingSenderId: "438918567576",
  appId: "1:438918567576:web:03d5d8d5831026fd8e22ed"
});
var db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = getFirestore(app); }
var matchesCol = collection(db, "matches");

var APP_TAG = "cms";
var PIN = "1111";
var NAME_KEY = "cms-tour-name";

var matches = [];
var myName = null;
var editingName = false;
var typingNew = false;
var tab = "today";
var ready = false;
var blocked = false;
/* The same person sometimes signed in under two spellings on different
   phones, which split their picks — and their points — across two rows on the
   log. Each alias here is folded into one name everywhere the app reads picks,
   so the log adds them up as one player. The saved picks themselves are left
   exactly as entered. Keys are lower-case, as key() produces them. */
var ALIASES = {
  "leon": "Leon Kemp",
  "leanie (en alyssa)": "Leanie"
};
try { myName = localStorage.getItem(NAME_KEY) || null; } catch (e) {}
if (myName && canonicalName(myName) !== myName) {
  myName = canonicalName(myName);
  try { localStorage.setItem(NAME_KEY, myName); } catch (e) {}
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function rawKey(n){ return String(n).trim().toLowerCase().replace(/[.\/\[\]~*]/g,"_").replace(/\s+/g," "); }
function canonicalName(n){ return ALIASES[rawKey(n)] || n; }
function key(n){ return rawKey(canonicalName(n)); }
function num(v){ var n = parseInt(v,10); return isNaN(n) ? 0 : Math.max(0, Math.min(200,n)); }
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function fmt(ms){
  if (!ms) return "Date to be confirmed";
  try { return new Date(ms).toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); }
  catch(e){ return new Date(ms).toString().slice(0,21); }
}
function locked(m){ return !!(m.ko && Date.now() > m.ko) || !!m.f; }
function mine(m){ return myName ? m.p[key(myName)] || null : null; }
function others(m){
  var me = myName ? key(myName) : null;
  return Object.keys(m.p).filter(function(k){ return k !== me; }).map(function(k){ return m.p[k]; })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
}
/* Nobody sees another pick until they've committed their own — otherwise the
   last person to enter simply copies the best-looking guess. Once a match has
   kicked off it's all open, since copying is no longer possible. */
/* Once a match kicks off nobody can change a pick, so the bottom of the list
   shows where the whole office landed — everyone's picks, mine included,
   averaged. Deliberately hidden until then: before kick-off it would give the
   room away to anyone still choosing. */
function teamAverage(m){
  var all = Object.keys(m.p).map(function(k){ return m.p[k]; });
  if (!all.length) return null;
  var h = 0, a = 0;
  all.forEach(function(e){ h += e.hs; a += e.as; });
  return { hs: h/all.length, as: a/all.length, n: all.length };
}
function avgHtml(m){
  if (!locked(m)) return "";
  var t = teamAverage(m);
  if (!t) return "";
  var hs = Math.round(t.hs), as = Math.round(t.as);
  var call = hs === as ? "a draw"
    : esc(hs > as ? m.h : m.a) + " by " + Math.abs(hs - as);
  return '<div class="avg">' +
    '<div class="avg-h">Team average · ' + t.n + ' pick' + (t.n===1?'':'s') + '</div>' +
    '<div class="avg-s"><span>' + esc(m.h) + '</span><b>' + hs + ' – ' + as + '</b><span>' + esc(m.a) + '</span></div>' +
    '<div class="avg-c">Team call: <b>' + call + '</b></div>' +
  '</div>';
}
function picksHtml(m, revealed){
  var list = others(m);
  if (!revealed) {
    return list.length
      ? '<div class="picks locked-picks">🙈 <b>' + list.length + '</b> pick' + (list.length===1?'':'s') +
        ' already in — hidden until you\'ve made yours.</div>'
      : "";
  }
  if (!list.length) {
    return '<div class="picks"><div class="picks-h">' +
      (locked(m) ? 'No other picks were in for this one.' : 'Nobody else has picked yet — you\'re first in.') +
      '</div>' + avgHtml(m) + '</div>';
  }
  return '<div class="picks"><div class="picks-h">Everyone else\'s picks</div>' +
    list.map(function(e){
      return '<div class="pick"><span class="pn">' + esc(e.name) + '</span>' +
             '<span class="ps">' + e.hs + ' – ' + e.as + '</span></div>';
    }).join("") + avgHtml(m) + '</div>';
}

/* ---------- scoring: four rules, nothing more ---------- */
function points(m, e){
  if (!m.f) return null;
  var fh = m.f[0], fa = m.f[1], out = { pts:0, tags:[] };
  if (e.hs === fh && e.as === fa) { out.pts = 10; out.tags.push("🎯 exact"); }
  else {
    var rightWinner = Math.sign(e.hs - e.as) === Math.sign(fh - fa);
    if (rightWinner) {
      var mDiff = Math.abs((e.hs - e.as) - (fh - fa));
      if (mDiff <= 3) { out.pts = 7; out.tags.push("📏 winner, margin ±3"); }
      else { out.pts = 5; out.tags.push("✅ right winner"); }
    } else out.tags.push("❌ wrong winner");
  }
  if (Math.abs(e.hs - fh) <= 3) { out.pts += 2; out.tags.push("🔢 home ±3"); }
  if (Math.abs(e.as - fa) <= 3) { out.pts += 2; out.tags.push("🔢 away ±3"); }
  out.off = Math.abs(e.hs - fh) + Math.abs(e.as - fa);
  return out;
}
function standings(m){
  var list = Object.keys(m.p).map(function(k){
    var e = m.p[k], s = points(m, e) || { pts:0, tags:[], off:0 };
    return { e:e, pts:s.pts, tags:s.tags, off:s.off };
  });
  if (m.f && list.length) {
    var best = Math.min.apply(null, list.map(function(x){ return x.off; }));
    list.forEach(function(x){ if (x.off === best) { x.pts += 2; x.tags.push("🎖 closest"); } });
  }
  list.sort(function(a,b){ return b.pts - a.pts || a.off - b.off || a.e.name.localeCompare(b.e.name); });
  var rank = 0;
  list.forEach(function(x,i){
    if (i===0 || x.pts !== list[i-1].pts || x.off !== list[i-1].off) rank = i+1;
    x.rank = rank;
  });
  return list;
}
function table(){
  var tot = {};
  matches.forEach(function(m){
    Object.keys(m.p).forEach(function(k){
      if (!tot[k]) tot[k] = { name:m.p[k].name, pts:0, played:0 };
    });
    if (!m.f) return;
    standings(m).forEach(function(s){
      var k = key(s.e.name);
      // A document whose map key doesn't match key(name) would otherwise take
      // the whole log down with it, so fall back to creating the row.
      if (!tot[k]) tot[k] = { name:s.e.name, pts:0, played:0 };
      tot[k].pts += s.pts; tot[k].played += 1;
    });
  });
  var list = Object.keys(tot).map(function(k){ return tot[k]; });
  list.sort(function(a,b){ return b.pts - a.pts || a.played - b.played || a.name.localeCompare(b.name); });
  var rank = 0;
  list.forEach(function(t,i){
    if (i===0 || t.pts !== list[i-1].pts || t.played !== list[i-1].played) rank = i+1;
    t.rank = rank;
  });
  return list;
}

/* ---------- data ---------- */
function fromDoc(d){
  var x = d.data(), p = x.p || {}, out = {}, raw = {};
  Object.keys(p).forEach(function(k){
    var e = p[k] || {};
    if (!e.name) return;
    var nm = canonicalName(e.name), ck = key(nm);
    (raw[ck] = raw[ck] || []).push(k);
    // If one person somehow has a pick under both spellings for the same
    // match, the one already stored under the combined name wins.
    if (!out[ck] || k === ck) out[ck] = { name:nm, hs:num(e.hs), as:num(e.as) };
  });
  return {
    id:d.id, h:x.h, hf:x.hf||"", a:x.a, af:x.af||"", ko:x.ko||null, vn:x.vn||"",
    tbc:!!x.tbc, kind:x.kind||"test", f:(Array.isArray(x.f) && x.f.length===2) ? [num(x.f[0]),num(x.f[1])] : null,
    p:out, raw:raw
  };
}
onSnapshot(matchesCol, function(snap){
  var all = [];
  snap.forEach(function(d){ if ((d.data()||{}).app === APP_TAG) all.push(fromDoc(d)); });
  all.sort(function(a,b){ return (a.ko||9e15) - (b.ko||9e15); });
  matches = all; ready = true; blocked = false;
  render();
}, function(err){
  ready = true;
  var code = String((err && (err.code || err.message)) || "");
  blocked = /permission-denied|insufficient/i.test(code);
  render();
});
function save(m, hs, as){
  var patch = {};
  patch["p." + key(myName)] = { name:myName, hs:num(hs), as:num(as) };
  return updateDoc(doc(db,"matches",m.id), patch).catch(function(err){
    var code = String((err && (err.code || err.message)) || "");
    if (/permission-denied|insufficient/i.test(code)) { blocked = true; render(); }
    else toast("Couldn't save — check your connection");
    throw err;
  });
}
/* Renaming has to carry the picks with it. Predictions are stored under a key
   derived from the name, so simply changing the name locally would orphan
   everything already saved — the old picks would sit under the old name and
   the log would show the person twice. Every entry is rewritten under the new
   key and the old one deleted, match by match, and the new name is only kept
   once all of those writes have come back. Finished matches move too, so past
   scores and points travel with you. */
function myStats(){
  if (!myName) return { picks:0, pts:0 };
  var k = key(myName);
  var row = table().filter(function(x){ return key(x.name) === k; })[0];
  return { picks: matches.filter(function(m){ return !!m.p[k]; }).length, pts: row ? row.pts : 0 };
}
function setName(n){
  myName = n; editingName = false; typingNew = false;
  try { localStorage.setItem(NAME_KEY, myName); } catch(e){}
  render();
}
function renameMe(newName){
  if (!myName) { setName(newName); return Promise.resolve(); }
  var oldKey = key(myName), newKey = key(newName);
  if (newName === myName) { editingName = false; render(); return Promise.resolve(); }
  if (oldKey !== newKey && matches.some(function(m){ return !!m.p[newKey]; })) {
    toast("Someone already predicts as " + newName);
    return Promise.reject(new Error("name taken"));
  }
  var moving = matches.filter(function(m){ return !!m.p[oldKey]; });
  return Promise.all(moving.map(function(m){
    var e = m.p[oldKey], patch = {};
    patch["p." + newKey] = { name:newName, hs:e.hs, as:e.as };
    (m.raw[oldKey] || [oldKey]).forEach(function(rk){
      if (rk !== newKey) patch["p." + rk] = deleteField();
    });
    return updateDoc(doc(db,"matches",m.id), patch);
  })).then(function(){
    setName(newName);
    toast(moving.length
      ? "Name updated — " + moving.length + " pick" + (moving.length===1?"":"s") + " moved with you"
      : "Name updated");
  }).catch(function(err){
    var code = String((err && (err.code || err.message)) || "");
    if (/permission-denied|insufficient/i.test(code)) { blocked = true; render(); }
    else toast("Couldn't update your name — nothing was changed");
    throw err;
  });
}
function saveResult(m, hs, as){
  return updateDoc(doc(db,"matches",m.id), { f:[num(hs),num(as)] })
    .catch(function(){ toast("Couldn't save the result"); });
}

/* ---------- render ---------- */
function counts(){
  var open = matches.filter(function(m){ return !locked(m); });
  var todo = myName ? open.filter(function(m){ return !mine(m); }).length : open.length;
  document.getElementById("n-predict").textContent = todo;
  document.getElementById("n-results").textContent = matches.filter(function(m){ return !!m.f; }).length;
}
function render(){
  counts();
  renderInstall();
  document.getElementById("warn").innerHTML = blocked
    ? '<div class="warn">🔒 <strong>Can\'t reach the database.</strong> This isn\'t your connection — the Firestore security rules need publishing. Ask Jacques.</div>'
    : "";
  ["today","predict","log","results"].forEach(function(t){
    document.getElementById("view-"+t).hidden = (t !== tab);
    document.getElementById("tab-"+t).classList.toggle("on", t === tab);
  });
  if (tab === "today") renderToday();
  if (tab === "predict") renderPredict();
  if (tab === "log") renderLog();
  if (tab === "results") renderResults();
  wireName();
  renderWi();
}
/* Everyone who has made at least one pick, one entry per person. */
function knownNames(){
  var seen = {};
  matches.forEach(function(m){
    Object.keys(m.p).forEach(function(k){ if (!seen[k]) seen[k] = m.p[k].name; });
  });
  return Object.keys(seen).map(function(k){ return seen[k]; })
    .sort(function(a,b){ return a.localeCompare(b); });
}
/* A returning player on a new phone used to type their name again from memory
   — "Leon" instead of "Leon Kemp" — and start a second, empty row on the log.
   So the first thing they see is a list of everyone already playing; typing a
   name is only for someone genuinely new. */
function pickNameHtml(){
  var names = knownNames();
  if (!names.length) return "";
  return '<div class="card"><label for="nm-pick" style="font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em">Who are you?</label>' +
    '<select id="nm-pick" class="nm-pick"><option value="">Choose your name…</option>' +
    names.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("") +
    '<option value="__new">I\'m new — add my name</option></select>' +
    '<p class="hint">Already played on another phone? Pick your name so all your points stay together.</p>' +
    '</div>';
}
function nameBlockHtml(){
  if (!myName && !editingName && !typingNew && knownNames().length) return pickNameHtml();
  if (!myName || editingName) {
    var s = editingName ? myStats() : null;
    return '<div class="card"><label for="nm" style="font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em">' +
      (editingName ? "Edit your name" : "Your name") + '</label>' +
      '<div class="name-row' + (editingName ? " two" : "") + '" style="margin-top:8px">' +
      '<input id="nm" maxlength="30" placeholder="e.g. Thabo M" value="' + esc(editingName ? (myName||"") : "") + '">' +
      '<button class="btn" id="nm-go">' + (editingName ? "Save" : "Start") + '</button>' +
      (editingName ? '<button class="btn ghost" id="nm-cancel">Cancel</button>' : '') +
      '</div>' +
      (editingName
        ? '<div class="keeps">Nothing is lost. Your <b>' + s.picks + ' pick' + (s.picks===1?"":"s") +
          '</b> and <b>' + s.pts + ' point' + (s.pts===1?"":"s") + '</b> move across to the new name, ' +
          'including matches already played.</div>'
        : '<p class="hint">Used to label your picks on the log. Nothing else — no sign-up, no password.</p>' +
          (knownNames().length ? '<button class="linkish" id="nm-back">← Back to the list of names</button>' : '')) +
      (editingName
        ? '<button class="linkish" id="nm-switch">Not ' + esc(myName) + '? Switch player</button>'
        : '') +
      '</div>';
  }
  return '<div class="card" style="padding:11px 12px"><div class="who">🙋 Predicting as ' + esc(myName) +
    '<button id="nm-change">Edit</button></div></div>';
}
function wireName(){
  var pick = document.getElementById("nm-pick");
  if (pick) pick.onchange = function(){
    if (pick.value === "__new") { typingNew = true; render(); return; }
    if (pick.value) { setName(pick.value); toast("Welcome back, " + pick.value); }
  };
  var back = document.getElementById("nm-back");
  if (back) back.onclick = function(){ typingNew = false; render(); };
  // Switching hands the phone to someone else: nothing is renamed or moved,
  // unlike Save, which carries this player's picks across to a new name.
  var sw = document.getElementById("nm-switch");
  if (sw) sw.onclick = function(){
    myName = null; editingName = false; typingNew = false;
    try { localStorage.removeItem(NAME_KEY); } catch(e){}
    render();
  };
  var go = document.getElementById("nm-go");
  if (go) go.onclick = function(){
    var v = canonicalName((document.getElementById("nm").value || "").trim().replace(/\s+/g, " "));
    if (!v) { toast("Type your name first"); return; }
    // A brand-new name that shares a first name with someone already playing
    // is most likely that person on a different phone — ask before splitting
    // them into two rows.
    if (!myName) {
      var k = key(v), first = k.split(" ")[0];
      var taken = knownNames().filter(function(n){ return key(n) === k; })[0];
      var near = knownNames().filter(function(n){ return key(n).split(" ")[0] === first; })[0];
      if (taken) v = taken;
      else if (near && confirm(near + " is already playing. Is that you?\n\nOK = carry on as " + near + "\nCancel = add " + v + " as a new player")) v = near;
    }
    go.disabled = true;
    renameMe(v).catch(function(){}).then(function(){ if (go) go.disabled = false; });
  };
  var cancel = document.getElementById("nm-cancel");
  if (cancel) cancel.onclick = function(){ editingName = false; render(); };
  var ch = document.getElementById("nm-change");
  if (ch) ch.onclick = function(){ editingName = true; render(); };
}
function matchTitle(m){
  var tag = m.kind === "test"
    ? '<span class="tag test">TEST</span>'
    : '<span class="tag tour">TOUR MATCH</span>';
  return tag + esc(m.hf) + " " + esc(m.h) + " v " + esc(m.a) + " " + esc(m.af);
}
/* Match day gets its own screen: the game everyone is talking about, your pick,
   and the rest of the office underneath. Falls back to the next fixture on a
   quiet day so the tab is never a dead end. */
function todaysMatch(){
  var now = new Date(), today = now.toDateString();
  var onToday = matches.filter(function(m){ return m.ko && new Date(m.ko).toDateString() === today; });
  if (onToday.length) return { m: onToday.sort(function(a,b){ return a.ko - b.ko; })[0], isToday: true };
  var next = matches.filter(function(m){ return !locked(m); })
    .sort(function(a,b){ return (a.ko||9e15) - (b.ko||9e15); })[0];
  return next ? { m: next, isToday: false } : null;
}
function countdown(ms){
  var s = Math.max(0, Math.floor((ms - Date.now())/1000));
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), mi = Math.floor(s%3600/60);
  if (d > 0) return d + "d " + h + "h";
  if (h > 0) return h + "h " + mi + "m";
  return mi + "m";
}
function renderToday(){
  var el = document.getElementById("view-today");
  if (!ready) { el.innerHTML = '<div class="card"><p class="hint" style="margin:0">Loading…</p></div>'; return; }
  var pick = todaysMatch();
  if (!pick) {
    el.innerHTML = '<div class="card"><div class="today-none">No fixtures left in the tour.<br>' +
      'Check the <b>Log</b> for the final standings.</div></div>' + nameBlockHtml();
    return;
  }
  var m = pick.m, e = mine(m), started = locked(m);
  var when = m.f ? "Full time" : started ? "Under way" : pick.isToday ? "Today" : "Next up";
  el.innerHTML =
    '<div class="today-hero">' +
      '<div class="when">' + when + '</div>' +
      '<div class="teams">' + esc(m.hf) + ' ' + esc(m.h) + '<br>v ' + esc(m.a) + ' ' + esc(m.af) + '</div>' +
      '<div class="at">' + esc(fmt(m.ko)) + (m.tbc ? " (provisional)" : "") + (m.vn ? " · " + esc(m.vn) : "") + '</div>' +
      (m.f
        ? '<div class="cd">' + esc(m.h) + ' ' + m.f[0] + ' — ' + m.f[1] + ' ' + esc(m.a) + '</div>'
        : started ? '<div class="cd">🔴 Kicked off — picks are locked</div>'

function wirePredict(){

  }

    btn.onclick = function(){

      if (v.hs === "" || v.as === "") { toast("Fill in both scores first"); return; }
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      save(v.m, v.hs, v.as).then(function(){ toast("Saved — good luck!"); }).catch(function(){});
    };
  });
  var all = document.getElementById("save-all");
  if (all) all.onclick = function(){
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

    });

/* Types the message out a few characters at a time. Tags are written whole so
   bold text never shows half an element. Reduced-motion users get it at once. */
function typeInto(node, html, done){
  clearInterval(wiTimer);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { node.innerHTML = html; done(); return; }
  var parts = html.match(/<[^>]+>|&[a-z#0-9]+;|[\s\S]/g) || [], i = 0, out = "";
  wiTimer = setInterval(function(){
    for (var n = 0; n < 3 && i < parts.length; i++) { out += parts[i]; if (parts[i].charAt(0) !== "<") n++; }
    node.innerHTML = out;
    if (i >= parts.length) { clearInterval(wiTimer); done(); }
  }, 16);
}

function countUp(el){
  var to = parseInt(el.getAttribute("data-count"),10) || 0, t0 = null;
  function step(ts){
    if (!t0) t0 = ts;
    var k = Math.min(1, (ts - t0) / 900);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

      '<span class="d">–</span><span class="n" data-count="' + g.call[1] + '">0</span><span class="tm">' + esc(m.a) + '</span></div>' +
      '<div class="call-why">' + esc(g.why) + '</div>' +
      '<div class="conf"><div class="l"><span>Confidence</span><b>' + esc(g.confWord) + '</b></div><div class="bar"><i data-w="' + g.conf + '"></i></div></div>' +
      '</div></div>';
  }
  if (m.f && g) {
    var wp = points(m, { hs:g.call[0], as:g.call[1] });
    html += '<div class="g-sec"><div class="tip">Final score <b>' + m.f[0] + '–' + m.f[1] + '</b>. wi called ' + g.call[0] + '–' + g.call[1] +
      ' and would have scored <b>' + wp.pts + '</b> point' + (wp.pts===1?'':'s') + '.</div></div>';
  }
  if (locked(m) && Object.keys(m.p).length) {
    var t = teamAverage(m);
    html += '<div class="g-sec"><div class="g-h">The office call</div><div class="tip">Across <b>' + t.n + '</b> pick' + (t.n===1?'':'s') +
      ', the office averaged <b>' + Math.round(t.hs) + '–' + Math.round(t.as) + '</b>' + (g ? ' against wi\'s ' + g.call[0] + '–' + g.call[1] : '') + '.</div></div>';
  }
  html += '<div class="g-sec"><div class="g-h">Bok form · last 5, newest first</div><div class="form">' +
    form.map(function(r){
      var k = r.us > r.them ? "W" : r.us < r.them ? "L" : "D";
      return '<div class="fchip ' + k + '"><b>' + k + '</b>' + r.us + '–' + r.them + '<span>' + esc(short(r.o)) + '</span></div>';
    }).join("") + '</div></div>';
  if (g && g.h2h) {
    html += '<div class="g-sec"><div class="g-h">Head to head · ' + g.h2h.played + ' Tests</div><div class="h2h">' +
      '<div><b data-count="' + g.h2h.us + '">0</b>Boks</div><div><b data-count="' + g.h2h.draw + '">0</b>Draws</div>' +
      '<div><b data-count="' + g.h2h.them + '">0</b>' + esc(opp) + '</div></div></div>';
  }
  if (g && g.facts) html += '<div class="g-sec"><div class="g-h">Worth knowing</div><ul class="g-list">' +
    g.facts.map(function(f){ return '<li>' + f + '</li>'; }).join("") + '</ul></div>';
  var yr = boksForm(), pf = 0, pa = 0;
  yr.forEach(function(r){ pf += r.us; pa += r.them; });
  html += '<div class="g-sec"><div class="g-h">How to score big</div><div class="tip">' +
    'Get the winner right for <b>5</b>; land the winning margin within 3 for <b>7</b>; nail it exactly for <b>10</b>. ' +
    'Each team\'s score within 3 adds <b>+2</b>, and the closest pick of the match gets another <b>+2</b>. ' +
    'This year the Boks have averaged <b>' + Math.round(pf/yr.length) + '–' + Math.round(pa/yr.length) + '</b> over ' + yr.length + ' Tests — a sensible starting point.</div></div>';
  html += '<p class="g-note">wi\'s guides are written from published results and are just for fun — the ball\'s still oval.</p>';
  return html;
}
function helpHtml(){
  var nx = nextOpen();
  var qa = [
    ["How do I make a pick?", "Type a score in each box and tap <b>Save my pick</b>. On the <b>Predict</b> tab you can fill several and tap <b>Save all</b>. You can change a pick any time until kick-off."],
    ["How do points work?", "🎯 Exact score <b>10</b> · 📏 right winner with the margin within 3 <b>7</b> · ✅ right winner <b>5</b> · 🔢 each team's score within 3 <b>+2</b> · 🎖 closest pick of the match <b>+2</b>."],
    ["Why can't I see other people's picks?", "They stay hidden until you've made yours, so nobody can copy the best-looking guess. Once a game kicks off, everything is open."],
    ["I played on another phone — where are my points?", "Tap <b>Edit</b> next to your name, then <b>Switch player</b>, and choose your name from the list. Your points follow the name, not the phone."],
    ["When do picks lock?", "At kick-off. Times on the cards are South African time."],
    ["Who enters the results?", "The organiser, once the final whistle has gone. The log updates straight away for everyone."],
    ["Is wi a real AI?", "wi is the CMS assistant. Here it reads the live picks and log to tell you what to do next, and its match guides are written from published results."]
  ];
  return '<div class="g-top"><div class="k">Ask wi</div><div class="t">How can I help?</div>' +
    '<div class="w">Tap a question.</div></div>' +
    (nx ? '<div class="g-sec"><button class="wi-guide-btn" data-guide="' + esc(nx.id) + '"><img src="assets/wi-mark.png" alt="">Guide to the next game: ' + esc(short(nx.h)) + ' v ' + esc(short(nx.a)) + '</button></div>' : '') +
    '<div class="g-sec">' + qa.map(function(x){
      return '<div class="faq"><button>' + x[0] + '</button><div class="a">' + x[1] + '</div></div>';
    }).join("") + '</div>';
}
/* wi keeps score too, off the log: its calls marked with the same rules
   (minus the closest-pick bonus, which is for people). */
function wiScoreHtml(){
  var done = matches.filter(function(m){ return m.f && WI[m.id]; });
  if (!done.length) {
    var nx = matches.filter(function(m){ return WI[m.id] && !m.f; })[0];
    return nx ? '<div class="card"><div class="beat"><img src="assets/wi-mark.png" alt=""><div class="bt"><b>Beat wi.</b> wi has made its calls for the Springbok Tests — they\'ll be marked here with the same rules as yours.</div></div></div>' : "";
  }
  var pts = 0;
  done.forEach(function(m){ var g = WI[m.id]; pts += points(m, { hs:g.call[0], as:g.call[1] }).pts; });
  var beat = myName ? done.reduce(function(sum, m){
    var e = m.p[key(myName)]; return sum + (e ? points(m, e).pts : 0);
  }, 0) : null;
  return '<div class="card"><div class="beat"><img src="assets/wi-mark.png" alt=""><div class="bt"><b>wi</b> · ' + done.length + ' game' + (done.length===1?'':'s') + ' marked' +
    (beat !== null ? '<br>' + (beat > pts ? 'You\'re beating wi by <b>' + (beat-pts) + '</b> 💪' : beat < pts ? 'wi is ahead of you by <b>' + (pts-beat) + '</b>' : 'You and wi are level') + ' on these games.' : '') +
    '</div><div class="bp">' + pts + '</div></div></div>';
}
document.addEventListener("click", function(ev){
  var g = ev.target.closest("[data-guide]");
  if (g) {
    var m = matches.filter(function(x){ return x.id === g.getAttribute("data-guide"); })[0];
    if (m) openSheet(guideHtml(m));
    return;
  }
  var go = ev.target.closest("[data-go]");
  if (go) { tab = go.getAttribute("data-go"); render(); window.scrollTo({ top:0, behavior:"smooth" }); return; }
  var q = ev.target.closest(".faq button");
  if (q) { q.parentNode.classList.toggle("open"); return; }
});
document.getElementById("wi-fab").onclick = function(){ openSheet(helpHtml()); };
document.getElementById("sheet-bg").onclick = closeSheet;
document.getElementById("sheet-x").onclick = closeSheet;
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

/* ---------- nav + share ---------- */
Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
  b.onclick = function(){ tab = b.getAttribute("data-tab"); render(); };
});
/* The share message is written for WhatsApp: *asterisks* render as bold there,
   and it degrades to plain text everywhere else. A log full of zeros reads
   flat, so before anyone has scored we show the turnout instead. */
/* Kick-off times in the message are always South African time, whatever
   timezone the phone doing the sharing happens to be set to. */
function sast(ms, opts){
  try { return new Intl.DateTimeFormat("en-ZA", Object.assign({ timeZone:"Africa/Johannesburg" }, opts)).format(new Date(ms)); }
  catch(e){ return new Date(ms).toString().slice(0,21); }
}
/* Day and month are built by hand: phones disagree on "Sep" vs "Sept" and
   whether the day gets a leading zero. */
function sastDate(ms){
  var mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return parseInt(sast(ms, { day:"numeric" }), 10) + " " + mon[parseInt(sast(ms, { month:"numeric" }), 10) - 1];
}
function sastWhen(ms){
  return sast(ms, { weekday:"short" }) + " " + sastDate(ms) + ", " +
    sast(ms, { hour:"2-digit", minute:"2-digit", hour12:false });
}
function city(vn){
  var parts = String(vn || "").split(",");
  return parts.length > 1 ? parts[parts.length-1].trim() : String(vn || "").trim();
}
/* First names on the podium, unless two players share one. */
function logName(name, t){
  var first = name.split(" ")[0];
  var clash = t.filter(function(x){ return x.name.split(" ")[0].toLowerCase() === first.toLowerCase(); }).length > 1;
  return clash ? name : first;
}
function shareMessage(){
  var url = location.origin + location.pathname;
  var t = table();
  var scored = t.filter(function(x){ return x.pts > 0; });
  var open = matches.filter(function(m){ return !locked(m); })
    .sort(function(a,b){ return (a.ko||9e15) - (b.ko||9e15); });
  var n = open.length;
  var L = [];
  L.push("*SPRINGBOKS TOUR PREDICTOR* 🇿🇦🏉");
  L.push("");
  var wiStarted = matches.some(function(m){ return WI[m.id] && m.f; });
  if (n) {
    L.push(wiStarted
      ? "*" + n + " Springbok Test" + (n===1?"":"s") + "* still to pick:"
      : "The All Blacks series is done (Boks 3–1 🙌). The predictor is back with *" + n + " more Springbok Test" + (n===1?"":"s") + "*:");
    L.push("");
    open.forEach(function(m){
      var flag = isBoks(m.h) ? m.af : m.hf;
      L.push(flag + " *" + m.h.replace("South Africa","SA") + " v " + m.a.replace("South Africa","SA") + "*: " +
        (m.ko ? sastWhen(m.ko) : "date TBC") + (m.vn ? " (" + city(m.vn) + ")" : ""));
    });
    var nx = open[0];
    if (nx.ko) {
      var days = (nx.ko - Date.now()) / 864e5;
      var whenLock = days < 6 ? "on " + sast(nx.ko, { weekday:"long" }) : "on " + sast(nx.ko, { weekday:"short" }) + " " + sastDate(nx.ko);
      L.push("");
      L.push("⏱ *" + (nx.vn ? city(nx.vn) : nx.h + " v " + nx.a) + " picks lock at " + sast(nx.ko, { hour:"2-digit", minute:"2-digit", hour12:false }) + " " + whenLock + ".* Get yours in before then.");
    }
  } else {
    L.push("Every game's been played. The final log is in 👇");
  }
  L.push("");
  L.push("*What's new*");
  L.push("🤖 *Meet wi*, the CMS assistant. It tells you what to do on each screen and has a *match guide* for every game: form, head-to-head, and wi's own score prediction.");
  L.push("🥊 *Beat wi*: wi's predictions get scored the same way as ours. Let's see who's smarter, the office or the bot.");
  L.push("👤 *Choose your name from the list* when you open the app, so all your points stay together. Played on a different phone before? Pick the same name and your points are still there.");
  L.push("");
  if (scored.length) {
    L.push("🏆 *The log so far*");
    var medals = ["🥇","🥈","🥉"];
    for (var r = 1; r <= 3; r++) {
      var at = t.filter(function(x){ return x.rank === r && x.pts > 0; });
      if (!at.length) continue;
      L.push(medals[r-1] + " " + at.map(function(x){ return logName(x.name, t); }).join(" & ") + ": " + at[0].pts);
    }
    if (n) L.push("Everything's still up for grabs. An exact score is worth 10 points.");
  } else if (t.length) {
    L.push("👥 *" + t.length + "* of us are in so far. Nobody's on the board yet. Wide open.");
  } else {
    L.push("👀 Not a single pick in yet. First one in leads the log.");
  }
  L.push("");
  L.push("👉 " + url);
  L.push("");
  L.push("Pick the scores. Closest wins. 30 seconds, no sign-up.");
  return L.join("\n");
}
document.getElementById("btn-share").onclick = function(){
  var msg = shareMessage();
  if (navigator.share) { navigator.share({ text: msg }).catch(function(){}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(msg).then(function(){ toast("Link copied — paste it in the group"); });
  else prompt("Copy this:", msg);
};

/* ---------- install to home screen ----------
   Offered on the first open so colleagues end up with an icon rather than a
   link buried in a chat thread. Chrome/Android hands us a real prompt;
   iOS Safari never fires the event, so it gets the manual steps instead. */
var deferredInstall = null;
var INSTALL_DISMISSED = "cms-tour-install-dismissed";
function standalone(){
  return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || !!navigator.standalone;
}
function dismissed(){
  try { return localStorage.getItem(INSTALL_DISMISSED) === "1"; } catch(e){ return false; }
}
function renderInstall(){
  var el = document.getElementById("install");
  if (!el) return;
  if (standalone() || dismissed()) { el.innerHTML = ""; return; }
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent || "");
  if (deferredInstall) {
    el.innerHTML = '<div class="install"><h3>📲 Add this to your home screen</h3>' +
      '<p>One tap to open, works offline, and you\'ll get it back without hunting for the link.</p>' +
      '<div class="row"><button class="btn" id="btn-install">Install</button>' +
      '<button class="later" id="btn-install-later">Not now</button></div></div>';
  } else if (ios) {
    el.innerHTML = '<div class="install"><h3>📲 Add this to your home screen</h3>' +
      '<p>Tap the <strong>Share</strong> button below, then <strong>Add to Home Screen</strong>. ' +
      'It then opens like a normal app.</p>' +
      '<div class="row"><button class="later" id="btn-install-later" style="flex:1">Got it</button></div></div>';
  } else { el.innerHTML = ""; return; }
  var go = document.getElementById("btn-install");
  if (go) go.onclick = function(){
    if (!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){ deferredInstall = null; renderInstall(); });
  };
  var later = document.getElementById("btn-install-later");
  if (later) later.onclick = function(){
    try { localStorage.setItem(INSTALL_DISMISSED, "1"); } catch(e){}
    renderInstall();
  };
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstall = e;
  renderInstall();
});
window.addEventListener("appinstalled", function(){
  deferredInstall = null;
  try { localStorage.removeItem(INSTALL_DISMISSED); } catch(e){}
  renderInstall();
  toast("Installed — look for the CMS icon on your home screen");
});

if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){}
}
renderInstall();
render();
setInterval(function(){ if (!ready) return; counts(); if (tab === "today") renderToday(); renderWi(); }, 30000);
</script>
